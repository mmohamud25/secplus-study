<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"/>
<meta name="theme-color" content="#050d18"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"/>
<meta name="apple-mobile-web-app-title" content="Sec+ Study"/>
<title>Security+ Study Hub | secplus.kulaninstitute.org</title>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@700;800&family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet"/>
<style>
:root{
  --bg:#050d18;--bg2:#080f1a;--bg3:#0a1525;--bg4:#0d1f35;
  --border:#1e293b;--text:#f1f5f9;--text2:#94a3b8;--text3:#475569;--text4:#334155;
  --cyan:#00d4ff;--red:#ff4d6d;--green:#06d6a0;--yellow:#f9c74f;--purple:#a855f7;--orange:#f97316;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{background:var(--bg);font-family:'DM Sans',sans-serif;color:var(--text);overflow-x:hidden;min-height:100%}
::-webkit-scrollbar{display:none}
button{cursor:pointer;font-family:inherit;transition:all .18s ease}
button:active{transform:scale(.97);opacity:.8}
input,select{font-family:inherit;outline:none}
input:focus,select:focus{border-color:var(--cyan)!important;box-shadow:0 0 0 2px rgba(0,212,255,.15)!important}
#app{max-width:480px;margin:0 auto;min-height:100vh;position:relative;background:var(--bg)}
#content{padding-bottom:90px}
/* NAV */
#nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:480px;background:rgba(8,15,26,.95);border-top:1px solid rgba(255,255,255,.06);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);z-index:100;padding-bottom:env(safe-area-inset-bottom,8px)}
#nav .tabs{display:flex}
#nav .tab{flex:1;background:transparent;border:none;padding:10px 4px 8px;display:flex;flex-direction:column;align-items:center;gap:3px;color:var(--text4);font-size:9px;letter-spacing:.5px;text-transform:uppercase;font-weight:500;position:relative;transition:color .2s}
#nav .tab.active{color:var(--cyan)}
#nav .tab.active::before{content:"";position:absolute;top:0;left:50%;transform:translateX(-50%);width:40%;height:2px;border-radius:0 0 4px 4px;background:linear-gradient(90deg,transparent,var(--cyan),transparent)}
#nav .tab .icon{font-size:20px;line-height:1}
#nav .tab.active .icon{filter:drop-shadow(0 0 6px rgba(0,212,255,.6))}
/* CARDS */
.card{background:linear-gradient(135deg,rgba(13,31,53,.9),rgba(10,21,37,.95));border:1px solid var(--border);border-radius:16px;padding:18px 16px;box-shadow:0 4px 24px rgba(0,0,0,.4)}
.btn-primary{background:linear-gradient(135deg,#00d4ff,#0099cc);color:#000814;border:none;border-radius:12px;padding:14px 20px;font-weight:700;font-size:15px;width:100%;min-height:50px;cursor:pointer;box-shadow:0 4px 16px rgba(0,212,255,.3);letter-spacing:.3px;font-family:inherit}
.btn-secondary{background:transparent;border:1px solid var(--border);border-radius:12px;padding:12px 20px;font-weight:600;font-size:14px;width:100%;cursor:pointer;color:var(--text3);font-family:inherit}
.btn-back{background:transparent;border:none;color:var(--text3);font-size:13px;cursor:pointer;padding:0 0 16px;display:flex;align-items:center;gap:6px}
/* CHIPS */
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:10px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex-shrink:0;border:1px solid var(--border);background:rgba(10,21,37,.6);border-radius:20px;padding:6px 14px;font-size:12px;font-weight:600;cursor:pointer;white-space:nowrap;transition:all .2s;color:var(--text3)}
.chip.active{box-shadow:0 0 10px currentColor;opacity:1}
/* PROGRESS */
.progress{height:5px;background:var(--bg4);border-radius:3px;overflow:hidden;margin-bottom:20px}
.progress-fill{height:100%;border-radius:3px;transition:width .4s ease;background:linear-gradient(90deg,rgba(0,212,255,.7),var(--cyan))}
/* FLIP CARD */
.flip-card{min-height:220px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;cursor:pointer;user-select:none;border-radius:16px;border:2px solid var(--cyan);padding:24px 20px;background:linear-gradient(135deg,rgba(10,31,53,.9),rgba(13,31,53,.95));transition:all .25s;box-shadow:0 4px 20px rgba(0,0,0,.4)}
.flip-card.flipped{border-color:var(--green);background:linear-gradient(135deg,rgba(13,45,26,.9),rgba(10,31,37,.95))}
/* ANSWER BTN */
.answer-btn{background:rgba(8,15,26,.9);border:1px solid var(--border);border-radius:12px;padding:14px 16px;text-align:left;cursor:pointer;color:var(--text2);font-size:14px;font-family:inherit;display:flex;align-items:center;gap:12px;min-height:52px;transition:all .2s;width:100%}
.answer-btn .letter{width:26px;height:26px;border-radius:6px;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;flex-shrink:0;background:rgba(30,41,59,.5)}
.answer-btn.correct{background:#052e16;border-color:#22c55e;color:#86efac}
.answer-btn.correct .letter{background:rgba(34,197,94,.2);color:#22c55e}
.answer-btn.wrong{background:#2d0a0a;border-color:#ef4444;color:#fca5a5}
.answer-btn.wrong .letter{background:rgba(239,68,68,.2);color:#ef4444}
.answer-btn.selected{background:#0d2d40;border-color:var(--cyan);color:var(--cyan)}
/* MATCH BTN */
.match-btn{border-radius:10px;padding:11px 10px;text-align:left;cursor:pointer;font-family:inherit;min-height:44px;line-height:1.4;transition:all .15s;width:100%;border:1px solid var(--border);background:rgba(10,21,37,.8);color:var(--text2)}
.match-btn.matched{background:#052e16;border-color:#22c55e;color:#86efac}
.match-btn.selected{background:#0d2d40;border-color:var(--cyan);color:var(--cyan)}
.match-btn.wrong{background:#2d0a0a;border-color:#ef4444;color:#fca5a5;animation:shake .4s ease}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-4px)}75%{transform:translateX(4px)}}
/* ORDER */
.order-item{background:var(--bg3);border:1px solid var(--border);border-radius:12px;padding:12px 14px;display:flex;align-items:center;gap:10px;margin-bottom:8px;transition:all .2s}
.order-item.correct{background:#052e16;border-color:#22c55e}
.order-item.wrong{background:#2d0a0a;border-color:#ef4444}
.order-num{width:28px;height:28px;border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:800;flex-shrink:0}
/* SCORE */
.score-display{text-align:center;padding:28px 20px}
.score-pct{font-family:'Syne',sans-serif;font-size:44px;font-weight:800}
/* DOMAIN COLORS */
[data-d="1"]{--dc:var(--cyan)}[data-d="2"]{--dc:var(--red)}[data-d="3"]{--dc:var(--green)}[data-d="4"]{--dc:var(--yellow)}[data-d="5"]{--dc:var(--purple)}
/* ANIMATIONS */
@keyframes fadeUp{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
.fu{animation:fadeUp .3s ease both}
.fu1{animation:fadeUp .3s .07s ease both}
.fu2{animation:fadeUp .3s .14s ease both}
.fu3{animation:fadeUp .3s .21s ease both}
/* HERO */
.hero{position:relative;padding:36px 20px 28px;overflow:hidden;background:linear-gradient(180deg,rgba(0,212,255,.06) 0%,transparent 100%)}
.hero::before{content:"";position:absolute;top:-60px;right:-40px;width:200px;height:200px;border-radius:50%;background:radial-gradient(circle,rgba(0,212,255,.1) 0%,transparent 70%);pointer-events:none}
.hero::after{content:"";position:absolute;bottom:-30px;left:-60px;width:160px;height:160px;border-radius:50%;background:radial-gradient(circle,rgba(168,85,247,.08) 0%,transparent 70%);pointer-events:none}
/* EXPLAIN BOX */
.explain{background:rgba(6,15,10,.9);border:1px solid rgba(34,197,94,.2);border-left:3px solid #22c55e;border-radius:10px;padding:14px;margin-top:12px}
/* LOG BOX */
.logbox{background:#020810;border:1px solid rgba(34,197,94,.15);border-radius:10px;padding:12px;font-family:'Courier New',monospace;font-size:11px;color:#22c55e;line-height:1.8;overflow-x:auto;white-space:pre;margin-bottom:16px}
/* FIREWALL TABLE */
.fw-table{width:100%;border-collapse:collapse;font-size:12px}
.fw-table th{padding:8px 6px;text-align:left;color:var(--text3);font-weight:600;border-bottom:1px solid var(--border);background:rgba(15,23,42,.8)}
.fw-table td{padding:7px 5px;border-bottom:1px solid rgba(15,25,42,.8)}
.fw-input{background:var(--bg3);border:1px solid #1e3a5f;border-radius:6px;padding:6px 8px;color:var(--text);font-size:11px;font-family:inherit;width:100%}
.fw-select{background:var(--bg3);border:1px solid #1e3a5f;border-radius:6px;padding:6px 4px;font-size:11px;font-family:inherit;cursor:pointer}
/* ZONE */
.zone{background:var(--bg3);border:2px solid var(--border);border-radius:12px;padding:12px;margin-bottom:10px;transition:border-color .15s}
.zone.droptarget{border-color:rgba(0,212,255,.4)}
.zone-device{display:inline-flex;align-items:center;gap:4px;border-radius:6px;padding:5px 10px;font-size:11px;font-weight:600;cursor:pointer;margin:3px;border:1px solid;transition:all .15s}
/* RESPONSIVE GRID */
.mode-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:0 16px;margin-bottom:14px}
.mode-card{background:linear-gradient(135deg,rgba(13,31,53,.9),rgba(10,21,37,.95));border:1px solid var(--border);border-radius:16px;padding:16px 14px;cursor:pointer;display:flex;flex-direction:column;gap:8px;position:relative;overflow:hidden;transition:transform .2s,border-color .2s}
.mode-card:active{transform:scale(.97)}
</style>
</head>
<body>
<div id="app">
  <div id="content"></div>
  <nav id="nav">
    <div class="tabs">
      <button class="tab active" data-tab="home"><span class="icon">🏠</span>Home</button>
      <button class="tab" data-tab="cards"><span class="icon">🃏</span>Cards</button>
      <button class="tab" data-tab="quiz"><span class="icon">🎯</span>Quiz</button>
      <button class="tab" data-tab="match"><span class="icon">🧩</span>Match</button>
      <button class="tab" data-tab="pbq"><span class="icon">🧪</span>PBQ</button>
    </div>
  </nav>
</div>

<script>
// ─── DATA ───────────────────────────────────────────────────────────────────

const DOMAINS=[
  {id:1,name:"General Security Concepts",weight:12,color:"#00d4ff"},
  {id:2,name:"Threats, Vulnerabilities & Mitigations",weight:22,color:"#ff4d6d"},
  {id:3,name:"Security Architecture",weight:18,color:"#06d6a0"},
  {id:4,name:"Security Operations",weight:28,color:"#f9c74f"},
  {id:5,name:"Security Program Management",weight:20,color:"#a855f7"},
];

const FC=[
  // D1
  {t:"CIA Triad",d:"Confidentiality, Integrity, Availability — the three core security principles",dm:1},
  {t:"Confidentiality",d:"Data accessible only to authorized parties — protected by encryption and access controls",dm:1},
  {t:"Integrity",d:"Data is accurate and unaltered — verified by hashing, checksums, digital signatures",dm:1},
  {t:"Availability",d:"Systems accessible when needed — supported by redundancy, backups, uptime SLAs",dm:1},
  {t:"Least Privilege",d:"Users receive only the minimum access required to perform their specific job duties",dm:1},
  {t:"Separation of Duties",d:"Critical tasks split across multiple people so no single person can commit fraud alone",dm:1},
  {t:"Dual Control",d:"Two authorized people must be SIMULTANEOUSLY PRESENT to perform a sensitive action",dm:1},
  {t:"Job Rotation",d:"Employees rotate roles — reduces insider threat and exposes concealed misconduct",dm:1},
  {t:"Need to Know",d:"Access granted only when required for a specific task — even if user has clearance",dm:1},
  {t:"Zero Trust",d:"Never trust, always verify — every access request authenticated regardless of location",dm:1},
  {t:"Defense in Depth",d:"Multiple layered security controls — if one fails, others still protect",dm:1},
  {t:"Non-repudiation",d:"Sender cannot deny sending — achieved by digital signatures using the private key",dm:1},
  {t:"MFA",d:"Multi-Factor Authentication — requires 2+ DIFFERENT factor types to authenticate",dm:1},
  {t:"Something You Know",d:"Knowledge factor — passwords, PINs, security questions",dm:1},
  {t:"Something You Have",d:"Possession factor — smart card, hardware token, OTP app, phone",dm:1},
  {t:"Something You Are",d:"Inherence factor — biometrics: fingerprint, retina scan, facial recognition",dm:1},
  {t:"Symmetric Encryption",d:"One shared key encrypts AND decrypts — fast, bulk data (AES, 3DES, RC4)",dm:1},
  {t:"Asymmetric Encryption",d:"Public/private key pair — slow, used for key exchange and digital signatures (RSA, ECC)",dm:1},
  {t:"AES",d:"Advanced Encryption Standard — symmetric, strongest common cipher (128/192/256-bit keys)",dm:1},
  {t:"RSA",d:"Asymmetric algorithm using large prime factorization — key exchange and signatures",dm:1},
  {t:"Hashing",d:"One-way transformation producing a fixed-length digest — cannot be reversed",dm:1},
  {t:"MD5",d:"128-bit hash — BROKEN, vulnerable to collisions. Do NOT use for security",dm:1},
  {t:"SHA-256",d:"256-bit hash from SHA-2 family — current standard, collision resistant",dm:1},
  {t:"Salting",d:"Unique random value added before hashing each password — defeats rainbow table attacks",dm:1},
  {t:"Digital Signature",d:"Hash of message encrypted with senders PRIVATE key — proves authenticity and integrity",dm:1},
  {t:"PKI",d:"Public Key Infrastructure — system of CAs and certificates managing asymmetric keys",dm:1},
  {t:"Perfect Forward Secrecy",d:"Unique session keys per session — past sessions stay secure if server key is later stolen",dm:1},
  {t:"HSM",d:"Hardware Security Module — tamper-resistant hardware for cryptographic key storage",dm:1},
  {t:"Kerberos",d:"Ticket-based auth using KDC — authenticates once, accesses multiple internal services",dm:1},
  {t:"SAML",d:"XML-based SSO standard for enterprise federation between different organizations",dm:1},
  {t:"OAuth 2.0",d:"Delegated authorization protocol — enables 'Login with Google' type flows",dm:1},
  {t:"SSO",d:"Single Sign-On — authenticate once, access many applications without re-entering credentials",dm:1},
  {t:"RADIUS",d:"Centralized auth for VPN and Wi-Fi — uses UDP",dm:1},
  {t:"TACACS+",d:"Cisco AAA protocol separating authn/authz/accounting into three functions — uses TCP",dm:1},
  {t:"LDAP",d:"Directory protocol for storing/querying credentials — NOT authentication itself",dm:1},
  {t:"DAC",d:"Discretionary Access Control — resource OWNER decides who gets access (NTFS)",dm:1},
  {t:"MAC",d:"Mandatory Access Control — labels and clearances enforced by the SYSTEM (military)",dm:1},
  {t:"RBAC",d:"Role-Based Access Control — access based on job role",dm:1},
  {t:"ABAC",d:"Attribute-Based Access Control — access based on multiple attributes (location, dept, time)",dm:1},
  // D2
  {t:"Phishing",d:"Mass email impersonating trusted entity — generic, untargeted ('Dear Customer')",dm:2},
  {t:"Spear Phishing",d:"Targeted phishing at a specific individual using personal details (name, role, project)",dm:2},
  {t:"Whaling",d:"Spear phishing targeting executives — CEO, CFO, board members",dm:2},
  {t:"Vishing",d:"Voice/phone phishing — caller impersonates IT helpdesk, bank, or IRS",dm:2},
  {t:"Smishing",d:"SMS-based phishing — text messages containing malicious links",dm:2},
  {t:"Pretexting",d:"Fabricated scenario to manipulate victim into revealing information",dm:2},
  {t:"Typosquatting",d:"Registering misspelled domain names to intercept mistyped URLs (arnazon.com)",dm:2},
  {t:"Watering Hole",d:"Compromising a website frequently visited by the target group",dm:2},
  {t:"Ransomware",d:"Encrypts victim files and demands payment — restore from clean verified backup",dm:2},
  {t:"Rootkit",d:"Installs at kernel level, hides from OS and AV tools — requires reimaging",dm:2},
  {t:"Cryptojacking",d:"Secretly uses victim CPU to mine cryptocurrency — 100% CPU + mining pool connections",dm:2},
  {t:"Logic Bomb",d:"Triggers malicious action on a condition or date — often planted by insiders",dm:2},
  {t:"APT",d:"Advanced Persistent Threat — sophisticated, long-term stealthy attack (nation-state)",dm:2},
  {t:"Zero-Day",d:"Vulnerability exploited before vendor has released a patch — no defense available",dm:2},
  {t:"IOC",d:"Indicator of Compromise — evidence a system is compromised (unusual traffic, new admin accounts)",dm:2},
  {t:"SYN Flood",d:"DoS sending millions of half-open TCP connections — exhausts server connection table",dm:2},
  {t:"Smurf Attack",d:"ICMP broadcast amplification with spoofed victim IP — victim flooded with replies",dm:2},
  {t:"Evil Twin",d:"Rogue AP mimicking a legitimate Wi-Fi SSID — intercepts connecting users credentials",dm:2},
  {t:"Rogue Access Point",d:"Unauthorized AP physically plugged into internal network — creates backdoor",dm:2},
  {t:"MitM",d:"Man-in-the-Middle — intercepts, reads, re-encrypts, forwards live communication",dm:2},
  {t:"Replay Attack",d:"Captures valid auth token and retransmits it LATER — not a live session",dm:2},
  {t:"Session Hijacking",d:"Steals active session cookie to take over a LIVE authenticated session in real time",dm:2},
  {t:"SQL Injection",d:"Malicious SQL in input fields — look for single quote or OR 1=1 patterns",dm:2},
  {t:"Stored XSS",d:"Malicious script saved in database — executes for every user who loads the page",dm:2},
  {t:"Reflected XSS",d:"Malicious script in URL — reflected off server and executed in the victims browser",dm:2},
  {t:"CSRF",d:"Tricks authenticated user into unknowingly submitting malicious requests",dm:2},
  {t:"Pass-the-Hash",d:"Reuses stolen NTLM hash to authenticate without cracking the password",dm:2},
  {t:"Kerberoasting",d:"Requests service tickets and cracks them offline — targets service accounts",dm:2},
  {t:"Credential Stuffing",d:"Automating login attempts using breached username/password pairs from other sites",dm:2},
  // D3
  {t:"DMZ",d:"Demilitarized Zone — buffer network hosting public-facing servers between internet and LAN",dm:3},
  {t:"Network Segmentation",d:"Dividing network into isolated zones to limit lateral movement after breach",dm:3},
  {t:"VLAN",d:"Virtual LAN — logical Layer 2 segment without physical separation",dm:3},
  {t:"Air Gap",d:"Physically isolated network with zero external connections — critical/classified systems",dm:3},
  {t:"Zero Trust Architecture",d:"Every access request verified regardless of origin — assumes breach",dm:3},
  {t:"IDS",d:"Intrusion Detection System — monitors and ALERTS only, does NOT block (passive)",dm:3},
  {t:"IPS",d:"Intrusion Prevention System — monitors and ACTIVELY BLOCKS malicious traffic (inline)",dm:3},
  {t:"WAF",d:"Web Application Firewall — filters HTTP/HTTPS, protects against SQLi, XSS, CSRF at Layer 7",dm:3},
  {t:"NGFW",d:"Next-Generation Firewall — deep packet inspection, app awareness, built-in IPS",dm:3},
  {t:"Honeypot",d:"Decoy system designed to attract, detect, and study attacker behavior",dm:3},
  {t:"RTO",d:"Recovery Time Objective — maximum acceptable system downtime after an incident",dm:3},
  {t:"RPO",d:"Recovery Point Objective — maximum acceptable data loss measured in time",dm:3},
  {t:"MTTR",d:"Mean Time To Repair — average time to restore a failed system",dm:3},
  {t:"MTBF",d:"Mean Time Between Failures — average time between system failures",dm:3},
  {t:"Hot Site",d:"Fully operational backup site with real-time sync — fastest recovery (minutes-hours), highest cost",dm:3},
  {t:"Warm Site",d:"Partially equipped — restore from backup needed (hours-days), medium cost",dm:3},
  {t:"Cold Site",d:"Empty facility, install equipment first — cheapest but slowest (days-weeks)",dm:3},
  {t:"Full Backup",d:"Copies ALL data — slowest to create, fastest to restore",dm:3},
  {t:"Incremental Backup",d:"Changes since last backup of ANY type — fastest to create, slowest restore (need full chain)",dm:3},
  {t:"Differential Backup",d:"Changes since last FULL backup — only need latest + last full to restore",dm:3},
  {t:"IaaS",d:"Infrastructure as a Service — provider: hardware. Customer: OS, patching, apps, data",dm:3},
  {t:"PaaS",d:"Platform as a Service — provider: OS + runtime. Customer: apps and data only",dm:3},
  {t:"SaaS",d:"Software as a Service — provider: everything. Customer: data and access management",dm:3},
  {t:"CASB",d:"Cloud Access Security Broker — monitors and controls cloud app usage",dm:3},
  {t:"VM Escape",d:"Vulnerability allowing attacker to break out of VM to access host or other VMs",dm:3},
  // D4
  {t:"IR Phases",d:"Preparation → Detection → Containment → Eradication → Recovery → Lessons Learned",dm:4},
  {t:"Order of Volatility",d:"CPU cache → RAM → Swap/Temp → Hard drive → Archived logs (most to least volatile)",dm:4},
  {t:"Chain of Custody",d:"Documented record of who handled evidence and when — maintains forensic integrity",dm:4},
  {t:"Legal Hold",d:"Preservation order — relevant data must NOT be deleted during investigation",dm:4},
  {t:"Write Blocker",d:"Prevents writes to storage media during forensic imaging",dm:4},
  {t:"SIEM",d:"Security Information and Event Management — aggregates and correlates logs centrally",dm:4},
  {t:"SOAR",d:"Security Orchestration, Automation & Response — automates IR playbooks",dm:4},
  {t:"UEBA",d:"User Entity Behavior Analytics — baselines normal behavior, flags anomalies",dm:4},
  {t:"EDR",d:"Endpoint Detection and Response — monitors, detects, investigates endpoint threats",dm:4},
  {t:"SOC",d:"Security Operations Center — team monitoring security events 24/7",dm:4},
  {t:"Privilege Creep",d:"Accumulation of permissions over time beyond current role — fixed by access reviews",dm:4},
  {t:"JIT Access",d:"Just-in-Time — temporary elevated access granted only when needed, auto-revoked after",dm:4},
  {t:"PAM",d:"Privileged Access Management — controls and monitors admin/privileged accounts",dm:4},
  {t:"Tabletop Exercise",d:"Discussion-based IR simulation — walks through scenarios without touching real systems",dm:4},
  {t:"Red Team",d:"Full adversarial simulation using all attack vectors over extended time — stealth focused",dm:4},
  {t:"Threat Hunting",d:"Proactive search for threats already inside the network before any alert fires",dm:4},
  {t:"FDE",d:"Full Disk Encryption — encrypts entire drive (BitLocker for Windows, FileVault for Mac)",dm:4},
  // D5
  {t:"Risk = Likelihood × Impact",d:"Fundamental risk formula — both factors considered to prioritize responses",dm:5},
  {t:"SLE",d:"Single Loss Expectancy = Asset Value × Exposure Factor — loss from ONE incident",dm:5},
  {t:"ARO",d:"Annual Rate of Occurrence — expected number of incidents per year",dm:5},
  {t:"ALE",d:"Annual Loss Expectancy = SLE × ARO — expected yearly financial impact",dm:5},
  {t:"Risk Avoidance",d:"Eliminate the risky activity entirely — don't collect data you don't need",dm:5},
  {t:"Risk Transference",d:"Shift risk to a third party — cyber insurance is the classic example",dm:5},
  {t:"Risk Mitigation",d:"Reduce likelihood or impact — patch systems, implement MFA",dm:5},
  {t:"Risk Acceptance",d:"Acknowledge and tolerate the risk — low-likelihood, low-impact scenarios",dm:5},
  {t:"NIST CSF",d:"Cybersecurity Framework — Identify, Protect, Detect, Respond, Recover",dm:5},
  {t:"ISO 27001",d:"International standard for Information Security Management System (ISMS)",dm:5},
  {t:"PCI DSS",d:"Payment Card Industry standard — mandatory for organizations handling credit card data",dm:5},
  {t:"HIPAA",d:"US law protecting healthcare patient data — PHI (Protected Health Information)",dm:5},
  {t:"GDPR",d:"EU regulation — data access, rectification, erasure (right to be forgotten), portability",dm:5},
  {t:"Supply Chain Attack",d:"Compromising a vendor/software update to attack downstream targets (SolarWinds)",dm:5},
  {t:"BIA",d:"Business Impact Analysis — identifies critical processes and impact of their disruption",dm:5},

  {q:"A search bar reflects input onto the page. An attacker emails a URL containing malicious JavaScript. Which attack?",o:["Stored XSS","CSRF","Reflected XSS","SQL Injection"],a:2,d:2,e:"Reflected XSS — the script is in the URL, reflected in the server response, executed in the victim's browser. Not stored in the database."},

  {q:"An employee changes roles but keeps permissions from their old position over 3 years. Which term BEST describes this?",o:["Insider Threat","Separation of Duties violation","Privilege Creep","Over-provisioning"],a:2,d:4,e:"Privilege creep = gradual accumulation of access rights beyond current role needs as users change roles without old access being revoked."},

  {q:"A company purchases cyber liability insurance to cover financial losses from a data breach. Which risk response?",o:["Avoidance","Mitigation","Acceptance","Transference"],a:3,d:5,e:"Risk Transference shifts the financial burden to a third party — cyber insurance is the classic example."},

function getCards(){
  const s = state.cards;
  return s.domain === 0 ? FC : FC.filter(c=>c.dm===s.domain);
}

              return `<button class="match-btn ${isM?'matched':isSel?'selected':isW?'wrong':''}" style="font-size:11px" onclick="matchSelM('${m.replace(/'/g,"\\'")}')">

function renderMatchDone(){
  const s=state.match;
  return `
    <div class="card" style="text-align:center;padding:40px">

      <div style="display:flex;gap:10px">
        <button class="btn-primary" style="flex:1" onclick="resetMatch()">Play Again</button>
        ${s.page+1<Math.ceil(MATCH.length/MATCH_PAGE)?`<button class="btn-primary" style="flex:1;background:linear-gradient(135deg,#a855f7,#7c3aed)" onclick="setMatchPage(${s.page+1})">Next Set →</button>`:''}
      </div>
    </div>`;
}

function setMatchPage(i){
  const pairs=MATCH.slice(i*MATCH_PAGE,(i+1)*MATCH_PAGE);
  Object.assign(state.match,{page:i,selT:null,selM:null,matched:[],wrong:false,moves:0,done:false,shuffled:shuffle(pairs.map(p=>p.m))});
  renderMatch();
}
function resetMatch(){ setMatchPage(state.match.page); }

function matchSelT(t){
  const s=state.match;
  if(s.matched.includes(t)) return;
  s.selT = s.selT===t ? null : t;
  checkMatchPair();
}
function matchSelM(m){
  const s=state.match;
  if(s.matched.some(t=>getMatchPage().find(p=>p.t===t)?.m===m)) return;
  s.selM = s.selM===m ? null : m;
  checkMatchPair();
}
function checkMatchPair(){
  const s=state.match;
  if(!s.selT||!s.selM) { renderMatch(); return; }
  s.moves++;
  const pair=getMatchPage().find(p=>p.t===s.selT&&p.m===s.selM);
  if(pair){
    s.matched.push(s.selT);
    s.selT=null; s.selM=null;
    if(s.matched.length===getMatchPage().length) s.done=true;
  } else {
    s.wrong=true;
    renderMatch();
    setTimeout(()=>{ s.wrong=false; s.selT=null; s.selM=null; renderMatch(); },700);
    return;
  }
  renderMatch();
}

const NET_ZONES=[

  {id:"dmz",label:"🟡 DMZ",color:"#f9c74f",desc:"Public-facing services",accepts:["Web Server","WAF","Honeypot"]},

const NET_DEVICES=["Firewall","WAF","IDS","Web Server","Database","VPN Gateway","NGFW","Honeypot"];

function renderNet(){
  const s=state.net;
  const placed=s.placed||{};
  const getZoneDevs=(zid)=>Object.entries(placed).filter(([k])=>k.startsWith(zid+'-')).map(([,v])=>v);
  const placedAll=Object.values(placed);
  const unplaced=NET_DEVICES.filter(d=>!placedAll.includes(d));

  const totalCorrect=Object.entries(placed).filter(([k,v])=>{
    const zid=k.split('-')[0];
    return NET_ZONES.find(z=>z.id===zid)?.accepts.includes(v);
  }).length;

  return `
    <div style="background:rgba(10,16,32,.8);border:1px solid #1e3a5f;border-radius:12px;padding:14px;margin-bottom:20px;font-size:13px;color:#94a3b8;line-height:1.7">

    </div>

    <div style="display:flex;flex-wrap:wrap;gap:8px;min-height:44px;background:#080f1a;border-radius:12px;padding:10px;border:1px solid #1e293b;margin-bottom:20px">
      ${unplaced.length===0?'<div style="font-size:12px;color:#334155;align-self:center">All devices placed ✓</div>':
      unplaced.map(d=>`<button onclick="netSelect('${d}')" style="background:${s.dragging===d?'#0d2d40':'#0a1525'};border:1px solid ${s.dragging===d?'#00d4ff':'#1e293b'};border-radius:8px;padding:7px 12px;color:${s.dragging===d?'#00d4ff':'#94a3b8'};font-size:12px;font-family:inherit;font-weight:600;cursor:pointer">${s.dragging===d?'📌 ':''}${d}</button>`).join('')}
    </div>
    ${NET_ZONES.map(z=>{
      const zd=getZoneDevs(z.id);
      return `<div class="zone ${s.dragging&&z.id!=='internet'?'droptarget':''}" style="border-color:${s.dragging&&z.id!=='internet'?z.color+'44':'#1e293b'}" onclick="netDrop('${z.id}')">
        <div style="display:flex;justify-content:space-between;margin-bottom:8px">
          <span style="font-size:13px;font-weight:700;color:${z.color}">${z.label}</span>
          <span style="font-size:11px;color:#334155">${z.desc}</span>
        </div>
        <div style="display:flex;flex-wrap:wrap;gap:4px;min-height:30px">
          ${zd.length===0?`<span style="font-size:11px;color:#1e293b">${s.dragging&&z.id!=='internet'?'Drop here →':'Empty'}</span>`:
          zd.map(d=>{
            const ok=s.checked?NET_ZONES.find(zz=>zz.id===z.id)?.accepts.includes(d):null;
            return `<span class="zone-device" onclick="event.stopPropagation();netRemove('${z.id}','${d}')" style="background:${ok===null?z.color+'18':ok?'#052e16':'#2d0a0a'};border-color:${ok===null?z.color:ok?'#22c55e':'#ef4444'};color:${ok===null?z.color:ok?'#86efac':'#fca5a5'}">${s.checked?(ok?'✓':'✗'):''} ${d}</span>`;
          }).join('')}
        </div>
      </div>`;
    }).join('')}
    ${s.checked?`
      <div class="card" style="margin-bottom:12px">
        <div style="font-size:14px;font-weight:700;color:${totalCorrect>=6?'#22c55e':'#f9c74f'};margin-bottom:12px;font-family:'Syne',sans-serif">Score: ${totalCorrect}/${NET_DEVICES.length-1} correct</div>

          <div style="margin-bottom:4px;color:#94a3b8">Correct placements:</div>
          <div>🟡 DMZ: Web Server, WAF, Honeypot</div>
          <div>🔵 Perimeter: Firewall or NGFW</div>
          <div>🟢 Internal: IDS, VPN Gateway</div>
          <div>🟣 Secure Zone: Database only</div>

      </div>`:''}
    ${!s.checked?`<button class="btn-primary" style="opacity:${unplaced.length>0?.5:1};margin-bottom:10px" onclick="checkNet()">Check Placement</button>`:
    `<button class="btn-primary" onclick="resetNet()">Try Again</button>`}
  `;
}

function netSelect(d){ state.net.dragging = state.net.dragging===d?null:d; renderPBQ(); }
function netDrop(zid){
  if(!state.net.dragging||zid==='internet') return;
  const d=state.net.dragging;
  const placed=state.net.placed;
  Object.keys(placed).forEach(k=>{ if(placed[k]===d) delete placed[k]; });
  placed[`${zid}-${d}`]=d;
  state.net.dragging=null;
  renderPBQ();
}
function netRemove(zid,d){
  if(state.net.checked) return;
  delete state.net.placed[`${zid}-${d}`];
  renderPBQ();
}
function checkNet(){ state.net.checked=true; renderPBQ(); }
function resetNet(){ state.net={placed:{},dragging:null,checked:false}; renderPBQ(); }

// ─── PBQ: PORTS ───────────────────────────────────────────────────────────────
function renderPorts(){
  const s=state.ports;
  const PAGE=8;
  const pagePairs=PORTS_ALL.slice(s.page*PAGE,(s.page+1)*PAGE);
  const totalPages=Math.ceil(PORTS_ALL.length/PAGE);
  const isProtoMatched=p=>s.matched.some(m=>m.p===p);
  const isPortMatched=port=>s.matched.some(m=>m.port===port);

  if(s.done) return `
    <div class="card" style="text-align:center;padding:32px">
      <div style="font-size:48px;margin-bottom:12px">🎉</div>
      <div style="font-family:'Syne',sans-serif;font-size:20px;color:#f1f5f9;margin-bottom:8px">Set ${s.page+1} Complete!</div>
      <div style="font-size:14px;color:#64748b;margin-bottom:24px">${s.moves} moves</div>
      <div style="display:flex;gap:10px">
        <button class="btn-primary" style="flex:1" onclick="resetPorts()">Again</button>
        ${s.page+1<totalPages?`<button class="btn-primary" style="flex:1;background:linear-gradient(135deg,#06d6a0,#059669);color:#000" onclick="setPortsPage(${s.page+1})">Next Set →</button>`:''}
      </div>
    </div>`;

  return `
    <div class="chips" style="margin-bottom:14px">
      ${Array.from({length:totalPages},(_,i)=>`<button class="chip ${s.page===i?'active':''}" style="${s.page===i?'color:#06d6a0;border-color:#06d6a0;background:#06d6a018':''};" onclick="setPortsPage(${i})">Set ${i+1}</button>`).join('')}
    </div>
    <p style="font-size:12px;color:#475569;margin-bottom:14px">Tap a protocol then its matching port · ${s.matched.length}/${pagePairs.length} matched · ${s.moves} moves</p>
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px">
      <div style="display:flex;flex-direction:column;gap:6px">
        <div style="font-size:10px;color:#475569;letter-spacing:1px;text-transform:uppercase;margin-bottom:2px">Protocols</div>
        ${pagePairs.map(({p})=>{
          const isM=isProtoMatched(p), isSel=s.selP===p, isW=s.wrong&&isSel;
          return `<button class="match-btn ${isM?'matched':isW?'wrong':isSel?'selected':''}" onclick="portSelP('${p}')">${isM?'✓ ':''}${p}</button>`;
        }).join('')}
      </div>
      <div style="display:flex;flex-direction:column;gap:6px">
        <div style="font-size:10px;color:#475569;letter-spacing:1px;text-transform:uppercase;margin-bottom:2px">Ports</div>
        ${s.shuffled.map(port=>{
          const isM=isPortMatched(port), isSel=s.selPort===port, isW=s.wrong&&isSel;
          return `<button class="match-btn ${isM?'matched':isW?'wrong':isSel?'selected':''}" style="font-family:'Courier New',monospace;font-size:16px;font-weight:700" onclick="portSelPort('${port}')">${isM?'✓ ':''}${port}</button>`;
        }).join('')}
      </div>
    </div>
  `;
}

function setPortsPage(i){
  const PAGE=8; const pp=PORTS_ALL.slice(i*PAGE,(i+1)*PAGE);
  Object.assign(state.ports,{page:i,selP:null,selPort:null,matched:[],wrong:false,moves:0,done:false,shuffled:shuffle(pp.map(p=>p.port))});
  renderPBQ();
}
function resetPorts(){ setPortsPage(state.ports.page); }
function portSelP(p){
  if(state.ports.matched.some(m=>m.p===p)) return;
  state.ports.selP = state.ports.selP===p?null:p;
  checkPortPair();
}
function portSelPort(port){
  if(state.ports.matched.some(m=>m.port===port)) return;
  state.ports.selPort = state.ports.selPort===port?null:port;
  checkPortPair();
}
function checkPortPair(){
  const s=state.ports;
  if(!s.selP||!s.selPort){ renderPBQ(); return; }
  s.moves++;
  const PAGE=8; const pagePairs=PORTS_ALL.slice(s.page*PAGE,(s.page+1)*PAGE);
  const pair=pagePairs.find(p=>p.p===s.selP&&p.port===s.selPort);
  if(pair){
    s.matched.push(pair);
    s.selP=null; s.selPort=null;
    if(s.matched.length===pagePairs.length) s.done=true;
  } else {
    s.wrong=true;
    renderPBQ();
    setTimeout(()=>{ s.wrong=false; s.selP=null; s.selPort=null; renderPBQ(); },700);
    return;
  }
  renderPBQ();
}

function triagePick(id){

  const p=state.triage.priority;

  else if(p.length<TRIAGE_ALERTS.length) p.push(id);
  renderPBQ();
}
function checkTriage(){ state.triage.checked=true; renderPBQ(); }
function triageUp(i){ if(i===0)return; const a=state.triage.actionOrder; [a[i-1],a[i]]=[a[i],a[i-1]]; renderPBQ(); }
function triageDn(i){ const a=state.triage.actionOrder; if(i>=a.length-1)return; [a[i],a[i+1]]=[a[i+1],a[i]]; renderPBQ(); }
function checkTriageActions(){ state.triage.actChecked=true; renderPBQ(); }
function resetTriage(){ state.triage={priority:[],checked:false,actionOrder:shuffle(TRIAGE_ACTIONS),actChecked:false}; renderPBQ(); }

  else if(id==='pbq') renderPBQ();
}

// ─── NAV ─────────────────────────────────────────────────────────────────────
document.querySelectorAll('#nav .tab').forEach(btn=>{
  btn.addEventListener('click',()=>setTab(btn.dataset.tab));
});

// ─── INIT ─────────────────────────────────────────────────────────────────────
renderHome();
</script>
</body>
</html>
