<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"/>
<meta name="theme-color" content="#07080f"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"/>
<meta name="apple-mobile-web-app-title" content="Sec+ Study"/>
<title>Security+ Study Hub | secplus.kulaninstitute.org</title>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@700;800&family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet"/>
<style>
:root{
  --bg:#07080f;--bg2:#0d0e1a;--bg3:#111320;--bg4:#161828;
  --border:#1e2238;--border2:#2a2e4a;
  --text:#f0f2ff;--text2:#8b93c4;--text3:#4a5180;--text4:#2a2f55;
  --cyan:#00e5ff;--pink:#ff3d9a;--green:#00ffa3;--yellow:#ffe144;--purple:#b44dff;--orange:#ff7733;
  --cyan-glow:rgba(0,229,255,.3);--pink-glow:rgba(255,61,154,.3);--green-glow:rgba(0,255,163,.3);
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{background:var(--bg);font-family:'DM Sans',sans-serif;color:var(--text);overflow-x:hidden;min-height:100%}
::-webkit-scrollbar{display:none}
button{cursor:pointer;font-family:inherit;transition:all .18s ease}
button:active{transform:scale(.95)}
input,select{font-family:inherit;outline:none}
input:focus,select:focus{border-color:var(--cyan)!important;box-shadow:0 0 0 2px var(--cyan-glow)!important}
#app{max-width:480px;margin:0 auto;min-height:100vh;position:relative;background:var(--bg)}
#content{padding-bottom:90px}
/* NAV */
#nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:480px;background:rgba(7,8,15,.96);border-top:1px solid rgba(255,255,255,.05);backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px);z-index:100;padding-bottom:env(safe-area-inset-bottom,8px)}
#nav .tabs{display:flex}
#nav .tab{flex:1;background:transparent;border:none;padding:10px 2px 8px;display:flex;flex-direction:column;align-items:center;gap:3px;color:var(--text4);font-size:8px;letter-spacing:.5px;text-transform:uppercase;font-weight:600;position:relative;transition:all .2s}
#nav .tab.active{color:var(--cyan)}
#nav .tab.active::before{content:"";position:absolute;top:0;left:50%;transform:translateX(-50%);width:50%;height:2px;border-radius:0 0 4px 4px;background:var(--cyan);box-shadow:0 0 8px var(--cyan)}
#nav .tab .icon{font-size:18px;line-height:1;transition:filter .2s}
#nav .tab.active .icon{filter:drop-shadow(0 0 8px var(--cyan))}
/* CARDS */
.card{background:linear-gradient(145deg,rgba(17,19,32,.95),rgba(13,14,26,.98));border:1px solid var(--border);border-radius:18px;padding:18px 16px;box-shadow:0 8px 32px rgba(0,0,0,.5)}
.card-glow{background:linear-gradient(145deg,rgba(17,19,32,.95),rgba(13,14,26,.98));border-radius:18px;padding:18px 16px;box-shadow:0 8px 32px rgba(0,0,0,.5)}
.btn-primary{background:linear-gradient(135deg,#00e5ff,#0099bb);color:#000;border:none;border-radius:14px;padding:15px 20px;font-weight:800;font-size:15px;width:100%;min-height:52px;cursor:pointer;box-shadow:0 4px 20px var(--cyan-glow);letter-spacing:.3px;font-family:inherit;transition:all .2s}
.btn-primary:active{transform:scale(.97);box-shadow:0 2px 10px var(--cyan-glow)}
.btn-secondary{background:rgba(255,255,255,.04);border:1px solid var(--border2);border-radius:14px;padding:13px 20px;font-weight:600;font-size:14px;width:100%;cursor:pointer;color:var(--text3);font-family:inherit;transition:all .2s}
.btn-back{background:transparent;border:none;color:var(--text3);font-size:13px;cursor:pointer;padding:0 0 16px;display:flex;align-items:center;gap:6px}
/* CHIPS */
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:10px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex-shrink:0;border:1px solid var(--border2);background:rgba(255,255,255,.03);border-radius:20px;padding:7px 16px;font-size:12px;font-weight:600;cursor:pointer;white-space:nowrap;transition:all .2s;color:var(--text3)}
.chip.active{background:rgba(0,229,255,.1);border-color:var(--cyan);color:var(--cyan);box-shadow:0 0 12px var(--cyan-glow)}
/* PROGRESS */
.progress{height:6px;background:rgba(255,255,255,.05);border-radius:3px;overflow:hidden;margin-bottom:20px}
.progress-fill{height:100%;border-radius:3px;transition:width .5s cubic-bezier(.4,0,.2,1);background:linear-gradient(90deg,var(--cyan),#7b2fff)}
/* FLIP CARD */
.flip-card{min-height:230px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;cursor:pointer;user-select:none;border-radius:18px;border:1.5px solid var(--cyan);padding:28px 22px;background:linear-gradient(145deg,rgba(0,229,255,.04),rgba(123,47,255,.04));transition:all .3s;box-shadow:0 0 24px rgba(0,229,255,.08),0 8px 32px rgba(0,0,0,.5)}
.flip-card:active{transform:scale(.98)}
.flip-card.flipped{border-color:var(--green);background:linear-gradient(145deg,rgba(0,255,163,.04),rgba(0,100,60,.04));box-shadow:0 0 24px rgba(0,255,163,.1),0 8px 32px rgba(0,0,0,.5)}
/* ANSWER BTN */
.answer-btn{background:rgba(255,255,255,.02);border:1px solid var(--border);border-radius:14px;padding:14px 16px;text-align:left;cursor:pointer;color:var(--text2);font-size:14px;font-family:inherit;display:flex;align-items:center;gap:12px;min-height:54px;transition:all .2s;width:100%}
.answer-btn:hover{border-color:var(--border2);background:rgba(255,255,255,.04)}
.answer-btn .letter{width:28px;height:28px;border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:800;flex-shrink:0;background:rgba(255,255,255,.05);color:var(--text3);border:1px solid var(--border)}
.answer-btn.correct{background:rgba(0,255,163,.06);border-color:#00ffa3;color:#00ffa3}
.answer-btn.correct .letter{background:rgba(0,255,163,.15);color:#00ffa3;border-color:#00ffa3}
.answer-btn.wrong{background:rgba(255,61,154,.06);border-color:#ff3d9a;color:#ff3d9a}
.answer-btn.wrong .letter{background:rgba(255,61,154,.15);color:#ff3d9a;border-color:#ff3d9a}
.answer-btn.selected{background:rgba(0,229,255,.06);border-color:var(--cyan);color:var(--cyan)}
.answer-btn.selected .letter{background:rgba(0,229,255,.15);color:var(--cyan);border-color:var(--cyan)}
/* MATCH BTN */
.match-btn{border-radius:12px;padding:11px 10px;text-align:left;cursor:pointer;font-family:inherit;min-height:46px;line-height:1.4;transition:all .15s;width:100%;border:1px solid var(--border);background:rgba(255,255,255,.02);color:var(--text2)}
.match-btn:hover{border-color:var(--border2)}
.match-btn.matched{background:rgba(0,255,163,.06);border-color:#00ffa3;color:#00ffa3}
.match-btn.selected{background:rgba(0,229,255,.07);border-color:var(--cyan);color:var(--cyan)}
.match-btn.wrong{background:rgba(255,61,154,.07);border-color:#ff3d9a;color:#ff3d9a;animation:shake .4s ease}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
/* ORDER */
.order-item{background:rgba(255,255,255,.02);border:1px solid var(--border);border-radius:14px;padding:12px 14px;display:flex;align-items:center;gap:10px;margin-bottom:8px;transition:all .2s}
.order-item.correct{background:rgba(0,255,163,.05);border-color:#00ffa3}
.order-item.wrong{background:rgba(255,61,154,.05);border-color:#ff3d9a}
.order-num{width:30px;height:30px;border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:800;flex-shrink:0}
/* ANIMATIONS */
@keyframes fadeUp{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}
@keyframes pulse{0%,100%{opacity:.7}50%{opacity:1}}
@keyframes pop{0%{transform:scale(.85);opacity:0}60%{transform:scale(1.08)}100%{transform:scale(1);opacity:1}}
@keyframes floatUp{0%{transform:translateY(0);opacity:1}100%{transform:translateY(-40px);opacity:0}}
@keyframes timerPulse{0%,100%{box-shadow:0 0 10px rgba(255,61,154,.3)}50%{box-shadow:0 0 24px rgba(255,61,154,.7)}}
.fu{animation:fadeUp .35s ease both}
.fu1{animation:fadeUp .35s .07s ease both}
.fu2{animation:fadeUp .35s .14s ease both}
.fu3{animation:fadeUp .35s .21s ease both}
/* HERO */
.hero{position:relative;padding:36px 20px 24px;overflow:hidden}
.hero-bg{position:absolute;inset:0;background:linear-gradient(160deg,rgba(0,229,255,.06) 0%,rgba(123,47,255,.04) 50%,transparent 100%);pointer-events:none}
.hero-orb1{position:absolute;top:-80px;right:-60px;width:220px;height:220px;border-radius:50%;background:radial-gradient(circle,rgba(0,229,255,.12) 0%,transparent 70%);pointer-events:none}
.hero-orb2{position:absolute;bottom:-40px;left:-80px;width:180px;height:180px;border-radius:50%;background:radial-gradient(circle,rgba(180,77,255,.1) 0%,transparent 70%);pointer-events:none}
/* EXPLAIN BOX */
.explain{background:rgba(0,255,163,.03);border:1px solid rgba(0,255,163,.2);border-left:3px solid #00ffa3;border-radius:12px;padding:14px;margin-top:14px}
/* LOG BOX */
.logbox{background:#010408;border:1px solid rgba(0,255,163,.12);border-radius:12px;padding:14px;font-family:'Courier New',monospace;font-size:11px;color:#00ffa3;line-height:1.9;overflow-x:auto;white-space:pre;margin-bottom:16px;box-shadow:inset 0 0 20px rgba(0,255,163,.03)}
/* FIREWALL TABLE */
.fw-table{width:100%;border-collapse:collapse;font-size:12px}
.fw-table th{padding:8px 6px;text-align:left;color:var(--text3);font-weight:700;border-bottom:1px solid var(--border);background:rgba(255,255,255,.03);letter-spacing:.5px;font-size:11px}
.fw-table td{padding:7px 5px;border-bottom:1px solid rgba(255,255,255,.03)}
.fw-input{background:rgba(255,255,255,.04);border:1px solid var(--border2);border-radius:8px;padding:6px 8px;color:var(--text);font-size:11px;font-family:inherit;width:100%}
.fw-select{background:rgba(255,255,255,.04);border:1px solid var(--border2);border-radius:8px;padding:6px 4px;font-size:11px;font-family:inherit;cursor:pointer;color:var(--text)}
/* ZONE */
.zone{background:rgba(255,255,255,.02);border:2px solid var(--border);border-radius:14px;padding:14px;margin-bottom:10px;transition:all .15s}
.zone.droptarget{border-color:rgba(0,229,255,.4);background:rgba(0,229,255,.03);box-shadow:0 0 16px rgba(0,229,255,.1)}
.zone-device{display:inline-flex;align-items:center;gap:4px;border-radius:8px;padding:5px 10px;font-size:11px;font-weight:600;cursor:pointer;margin:3px;border:1px solid;transition:all .15s}
/* GRID */
.mode-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;padding:0 16px;margin-bottom:16px}
.mode-card{background:linear-gradient(145deg,rgba(17,19,32,.95),rgba(13,14,26,.98));border:1px solid var(--border);border-radius:18px;padding:18px 14px;cursor:pointer;display:flex;flex-direction:column;gap:10px;position:relative;overflow:hidden;transition:all .22s}
.mode-card:active{transform:scale(.96)}
.mode-card:hover{border-color:var(--border2)}
/* BLITZ GAME */
.blitz-timer{width:80px;height:80px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-family:'Syne',sans-serif;font-size:28px;font-weight:800;margin:0 auto;position:relative}
.blitz-timer::before{content:"";position:absolute;inset:-3px;border-radius:50%;background:conic-gradient(var(--cyan) var(--prog,100%),rgba(255,255,255,.05) 0);z-index:-1}
.blitz-lives{display:flex;gap:6px;justify-content:center;font-size:20px}
.blitz-score{font-family:'Syne',sans-serif;font-size:42px;font-weight:800;text-align:center}
.blitz-streak{font-size:13px;font-weight:700;color:var(--yellow);text-align:center;min-height:20px}
.blitz-q{font-family:'Syne',sans-serif;font-size:16px;font-weight:700;color:var(--text);line-height:1.55;text-align:center;padding:0 4px}
.blitz-opt{width:100%;border-radius:14px;padding:14px 16px;text-align:left;font-size:14px;font-family:inherit;font-weight:500;cursor:pointer;transition:all .15s;display:flex;align-items:center;gap:10px;border:1.5px solid var(--border);background:rgba(255,255,255,.02);color:var(--text2)}
.blitz-opt.hit{background:rgba(0,255,163,.08);border-color:#00ffa3;color:#00ffa3;animation:pop .3s ease}
.blitz-opt.miss{background:rgba(255,61,154,.08);border-color:#ff3d9a;color:#ff3d9a}
.blitz-opt.reveal{background:rgba(0,255,163,.04);border-color:rgba(0,255,163,.4);color:rgba(0,255,163,.6)}
.float-score{position:fixed;font-family:'Syne',sans-serif;font-size:22px;font-weight:800;color:#ffe144;pointer-events:none;z-index:999;animation:floatUp .8s ease forwards}
/* LESSON */
.lesson-card{background:linear-gradient(145deg,rgba(17,19,32,.95),rgba(13,14,26,.98));border-radius:18px;overflow:hidden;margin-bottom:14px;border:1px solid var(--border)}
.lesson-header{padding:16px 18px;display:flex;align-items:center;gap:14px;cursor:pointer}
.lesson-body{padding:0 18px 18px;display:none}
.lesson-body.open{display:block}
.lesson-tip{background:rgba(255,225,68,.04);border:1px solid rgba(255,225,68,.2);border-left:3px solid var(--yellow);border-radius:10px;padding:12px 14px;margin-top:12px;font-size:13px;color:#ffe880;line-height:1.65}
.lesson-concept{background:rgba(255,255,255,.02);border:1px solid var(--border);border-radius:10px;padding:12px 14px;margin-bottom:8px}
</style>
</head>
<body>
<div id="app">
  <div id="content"></div>
  <nav id="nav">
    <div class="tabs">
      <button class="tab active" data-tab="home"><span class="icon">🏠</span>Home</button>
      <button class="tab" data-tab="learn"><span class="icon">📖</span>Learn</button>
      <button class="tab" data-tab="quiz"><span class="icon">🎯</span>Quiz</button>
      <button class="tab" data-tab="game"><span class="icon">🎮</span>Game</button>
      <button class="tab" data-tab="pbq"><span class="icon">🧪</span>PBQ</button>
    </div>
  </nav>
</div>

<script>
// ─── DATA ───────────────────────────────────────────────────────────────────

const DOMAINS=[
  {id:1,name:"General Security Concepts",weight:12,color:"#00d4ff"},
  {id:2,name:"Threats, Vulnerabilities & Mitigations",weight:22,color:"#ff4d6d"},
  {id:3,name:"Security Architecture",weight:18,color:"#06d6a0"},
  {id:4,name:"Security Operations",weight:28,color:"#f9c74f"},
  {id:5,name:"Security Program Management",weight:20,color:"#a855f7"},
];

const FC=[
  // D1
  {t:"CIA Triad",d:"Confidentiality, Integrity, Availability — the three core security principles",dm:1},
  {t:"Confidentiality",d:"Data accessible only to authorized parties — protected by encryption and access controls",dm:1},
  {t:"Integrity",d:"Data is accurate and unaltered — verified by hashing, checksums, digital signatures",dm:1},
  {t:"Availability",d:"Systems accessible when needed — supported by redundancy, backups, uptime SLAs",dm:1},
  {t:"Least Privilege",d:"Users receive only the minimum access required to perform their specific job duties",dm:1},
  {t:"Separation of Duties",d:"Critical tasks split across multiple people so no single person can commit fraud alone",dm:1},
  {t:"Dual Control",d:"Two authorized people must be SIMULTANEOUSLY PRESENT to perform a sensitive action",dm:1},
  {t:"Job Rotation",d:"Employees rotate roles — reduces insider threat and exposes concealed misconduct",dm:1},
  {t:"Need to Know",d:"Access granted only when required for a specific task — even if user has clearance",dm:1},
  {t:"Zero Trust",d:"Never trust, always verify — every access request authenticated regardless of location",dm:1},
  {t:"Defense in Depth",d:"Multiple layered security controls — if one fails, others still protect",dm:1},
  {t:"Non-repudiation",d:"Sender cannot deny sending — achieved by digital signatures using the private key",dm:1},
  {t:"MFA",d:"Multi-Factor Authentication — requires 2+ DIFFERENT factor types to authenticate",dm:1},
  {t:"Something You Know",d:"Knowledge factor — passwords, PINs, security questions",dm:1},
  {t:"Something You Have",d:"Possession factor — smart card, hardware token, OTP app, phone",dm:1},
  {t:"Something You Are",d:"Inherence factor — biometrics: fingerprint, retina scan, facial recognition",dm:1},
  {t:"Symmetric Encryption",d:"One shared key encrypts AND decrypts — fast, bulk data (AES, 3DES, RC4)",dm:1},
  {t:"Asymmetric Encryption",d:"Public/private key pair — slow, used for key exchange and digital signatures (RSA, ECC)",dm:1},
  {t:"AES",d:"Advanced Encryption Standard — symmetric, strongest common cipher (128/192/256-bit keys)",dm:1},
  {t:"RSA",d:"Asymmetric algorithm using large prime factorization — key exchange and signatures",dm:1},
  {t:"Hashing",d:"One-way transformation producing a fixed-length digest — cannot be reversed",dm:1},
  {t:"MD5",d:"128-bit hash — BROKEN, vulnerable to collisions. Do NOT use for security",dm:1},
  {t:"SHA-256",d:"256-bit hash from SHA-2 family — current standard, collision resistant",dm:1},
  {t:"Salting",d:"Unique random value added before hashing each password — defeats rainbow table attacks",dm:1},
  {t:"Digital Signature",d:"Hash of message encrypted with senders PRIVATE key — proves authenticity and integrity",dm:1},
  {t:"PKI",d:"Public Key Infrastructure — system of CAs and certificates managing asymmetric keys",dm:1},
  {t:"Perfect Forward Secrecy",d:"Unique session keys per session — past sessions stay secure if server key is later stolen",dm:1},
  {t:"HSM",d:"Hardware Security Module — tamper-resistant hardware for cryptographic key storage",dm:1},
  {t:"Kerberos",d:"Ticket-based auth using KDC — authenticates once, accesses multiple internal services",dm:1},
  {t:"SAML",d:"XML-based SSO standard for enterprise federation between different organizations",dm:1},
  {t:"OAuth 2.0",d:"Delegated authorization protocol — enables 'Login with Google' type flows",dm:1},
  {t:"SSO",d:"Single Sign-On — authenticate once, access many applications without re-entering credentials",dm:1},
  {t:"RADIUS",d:"Centralized auth for VPN and Wi-Fi — uses UDP",dm:1},
  {t:"TACACS+",d:"Cisco AAA protocol separating authn/authz/accounting into three functions — uses TCP",dm:1},
  {t:"LDAP",d:"Directory protocol for storing/querying credentials — NOT authentication itself",dm:1},
  {t:"DAC",d:"Discretionary Access Control — resource OWNER decides who gets access (NTFS)",dm:1},
  {t:"MAC",d:"Mandatory Access Control — labels and clearances enforced by the SYSTEM (military)",dm:1},
  {t:"RBAC",d:"Role-Based Access Control — access based on job role",dm:1},
  {t:"ABAC",d:"Attribute-Based Access Control — access based on multiple attributes (location, dept, time)",dm:1},
  // D2
  {t:"Phishing",d:"Mass email impersonating trusted entity — generic, untargeted ('Dear Customer')",dm:2},
  {t:"Spear Phishing",d:"Targeted phishing at a specific individual using personal details (name, role, project)",dm:2},
  {t:"Whaling",d:"Spear phishing targeting executives — CEO, CFO, board members",dm:2},
  {t:"Vishing",d:"Voice/phone phishing — caller impersonates IT helpdesk, bank, or IRS",dm:2},
  {t:"Smishing",d:"SMS-based phishing — text messages containing malicious links",dm:2},
  {t:"Pretexting",d:"Fabricated scenario to manipulate victim into revealing information",dm:2},
  {t:"Typosquatting",d:"Registering misspelled domain names to intercept mistyped URLs (arnazon.com)",dm:2},
  {t:"Watering Hole",d:"Compromising a website frequently visited by the target group",dm:2},
  {t:"Ransomware",d:"Encrypts victim files and demands payment — restore from clean verified backup",dm:2},
  {t:"Rootkit",d:"Installs at kernel level, hides from OS and AV tools — requires reimaging",dm:2},
  {t:"Cryptojacking",d:"Secretly uses victim CPU to mine cryptocurrency — 100% CPU + mining pool connections",dm:2},
  {t:"Logic Bomb",d:"Triggers malicious action on a condition or date — often planted by insiders",dm:2},
  {t:"APT",d:"Advanced Persistent Threat — sophisticated, long-term stealthy attack (nation-state)",dm:2},
  {t:"Zero-Day",d:"Vulnerability exploited before vendor has released a patch — no defense available",dm:2},
  {t:"IOC",d:"Indicator of Compromise — evidence a system is compromised (unusual traffic, new admin accounts)",dm:2},
  {t:"SYN Flood",d:"DoS sending millions of half-open TCP connections — exhausts server connection table",dm:2},
  {t:"Smurf Attack",d:"ICMP broadcast amplification with spoofed victim IP — victim flooded with replies",dm:2},
  {t:"Evil Twin",d:"Rogue AP mimicking a legitimate Wi-Fi SSID — intercepts connecting users credentials",dm:2},
  {t:"Rogue Access Point",d:"Unauthorized AP physically plugged into internal network — creates backdoor",dm:2},
  {t:"MitM",d:"Man-in-the-Middle — intercepts, reads, re-encrypts, forwards live communication",dm:2},
  {t:"Replay Attack",d:"Captures valid auth token and retransmits it LATER — not a live session",dm:2},
  {t:"Session Hijacking",d:"Steals active session cookie to take over a LIVE authenticated session in real time",dm:2},
  {t:"SQL Injection",d:"Malicious SQL in input fields — look for single quote or OR 1=1 patterns",dm:2},
  {t:"Stored XSS",d:"Malicious script saved in database — executes for every user who loads the page",dm:2},
  {t:"Reflected XSS",d:"Malicious script in URL — reflected off server and executed in the victims browser",dm:2},
  {t:"CSRF",d:"Tricks authenticated user into unknowingly submitting malicious requests",dm:2},
  {t:"Pass-the-Hash",d:"Reuses stolen NTLM hash to authenticate without cracking the password",dm:2},
  {t:"Kerberoasting",d:"Requests service tickets and cracks them offline — targets service accounts",dm:2},
  {t:"Credential Stuffing",d:"Automating login attempts using breached username/password pairs from other sites",dm:2},
  // D3
  {t:"DMZ",d:"Demilitarized Zone — buffer network hosting public-facing servers between internet and LAN",dm:3},
  {t:"Network Segmentation",d:"Dividing network into isolated zones to limit lateral movement after breach",dm:3},
  {t:"VLAN",d:"Virtual LAN — logical Layer 2 segment without physical separation",dm:3},
  {t:"Air Gap",d:"Physically isolated network with zero external connections — critical/classified systems",dm:3},
  {t:"Zero Trust Architecture",d:"Every access request verified regardless of origin — assumes breach",dm:3},
  {t:"IDS",d:"Intrusion Detection System — monitors and ALERTS only, does NOT block (passive)",dm:3},
  {t:"IPS",d:"Intrusion Prevention System — monitors and ACTIVELY BLOCKS malicious traffic (inline)",dm:3},
  {t:"WAF",d:"Web Application Firewall — filters HTTP/HTTPS, protects against SQLi, XSS, CSRF at Layer 7",dm:3},
  {t:"NGFW",d:"Next-Generation Firewall — deep packet inspection, app awareness, built-in IPS",dm:3},
  {t:"Honeypot",d:"Decoy system designed to attract, detect, and study attacker behavior",dm:3},
  {t:"RTO",d:"Recovery Time Objective — maximum acceptable system downtime after an incident",dm:3},
  {t:"RPO",d:"Recovery Point Objective — maximum acceptable data loss measured in time",dm:3},
  {t:"MTTR",d:"Mean Time To Repair — average time to restore a failed system",dm:3},
  {t:"MTBF",d:"Mean Time Between Failures — average time between system failures",dm:3},
  {t:"Hot Site",d:"Fully operational backup site with real-time sync — fastest recovery (minutes-hours), highest cost",dm:3},
  {t:"Warm Site",d:"Partially equipped — restore from backup needed (hours-days), medium cost",dm:3},
  {t:"Cold Site",d:"Empty facility, install equipment first — cheapest but slowest (days-weeks)",dm:3},
  {t:"Full Backup",d:"Copies ALL data — slowest to create, fastest to restore",dm:3},
  {t:"Incremental Backup",d:"Changes since last backup of ANY type — fastest to create, slowest restore (need full chain)",dm:3},
  {t:"Differential Backup",d:"Changes since last FULL backup — only need latest + last full to restore",dm:3},
  {t:"IaaS",d:"Infrastructure as a Service — provider: hardware. Customer: OS, patching, apps, data",dm:3},
  {t:"PaaS",d:"Platform as a Service — provider: OS + runtime. Customer: apps and data only",dm:3},
  {t:"SaaS",d:"Software as a Service — provider: everything. Customer: data and access management",dm:3},
  {t:"CASB",d:"Cloud Access Security Broker — monitors and controls cloud app usage",dm:3},
  {t:"VM Escape",d:"Vulnerability allowing attacker to break out of VM to access host or other VMs",dm:3},
  // D4
  {t:"IR Phases",d:"Preparation → Detection → Containment → Eradication → Recovery → Lessons Learned",dm:4},
  {t:"Order of Volatility",d:"CPU cache → RAM → Swap/Temp → Hard drive → Archived logs (most to least volatile)",dm:4},
  {t:"Chain of Custody",d:"Documented record of who handled evidence and when — maintains forensic integrity",dm:4},
  {t:"Legal Hold",d:"Preservation order — relevant data must NOT be deleted during investigation",dm:4},
  {t:"Write Blocker",d:"Prevents writes to storage media during forensic imaging",dm:4},
  {t:"SIEM",d:"Security Information and Event Management — aggregates and correlates logs centrally",dm:4},
  {t:"SOAR",d:"Security Orchestration, Automation & Response — automates IR playbooks",dm:4},
  {t:"UEBA",d:"User Entity Behavior Analytics — baselines normal behavior, flags anomalies",dm:4},
  {t:"EDR",d:"Endpoint Detection and Response — monitors, detects, investigates endpoint threats",dm:4},
  {t:"SOC",d:"Security Operations Center — team monitoring security events 24/7",dm:4},
  {t:"Privilege Creep",d:"Accumulation of permissions over time beyond current role — fixed by access reviews",dm:4},
  {t:"JIT Access",d:"Just-in-Time — temporary elevated access granted only when needed, auto-revoked after",dm:4},
  {t:"PAM",d:"Privileged Access Management — controls and monitors admin/privileged accounts",dm:4},
  {t:"Tabletop Exercise",d:"Discussion-based IR simulation — walks through scenarios without touching real systems",dm:4},
  {t:"Red Team",d:"Full adversarial simulation using all attack vectors over extended time — stealth focused",dm:4},
  {t:"Threat Hunting",d:"Proactive search for threats already inside the network before any alert fires",dm:4},
  {t:"FDE",d:"Full Disk Encryption — encrypts entire drive (BitLocker for Windows, FileVault for Mac)",dm:4},
  // D5
  {t:"Risk = Likelihood × Impact",d:"Fundamental risk formula — both factors considered to prioritize responses",dm:5},
  {t:"SLE",d:"Single Loss Expectancy = Asset Value × Exposure Factor — loss from ONE incident",dm:5},
  {t:"ARO",d:"Annual Rate of Occurrence — expected number of incidents per year",dm:5},
  {t:"ALE",d:"Annual Loss Expectancy = SLE × ARO — expected yearly financial impact",dm:5},
  {t:"Risk Avoidance",d:"Eliminate the risky activity entirely — don't collect data you don't need",dm:5},
  {t:"Risk Transference",d:"Shift risk to a third party — cyber insurance is the classic example",dm:5},
  {t:"Risk Mitigation",d:"Reduce likelihood or impact — patch systems, implement MFA",dm:5},
  {t:"Risk Acceptance",d:"Acknowledge and tolerate the risk — low-likelihood, low-impact scenarios",dm:5},
  {t:"NIST CSF",d:"Cybersecurity Framework — Identify, Protect, Detect, Respond, Recover",dm:5},
  {t:"ISO 27001",d:"International standard for Information Security Management System (ISMS)",dm:5},
  {t:"PCI DSS",d:"Payment Card Industry standard — mandatory for organizations handling credit card data",dm:5},
  {t:"HIPAA",d:"US law protecting healthcare patient data — PHI (Protected Health Information)",dm:5},
  {t:"GDPR",d:"EU regulation — data access, rectification, erasure (right to be forgotten), portability",dm:5},
  {t:"Supply Chain Attack",d:"Compromising a vendor/software update to attack downstream targets (SolarWinds)",dm:5},
  {t:"BIA",d:"Business Impact Analysis — identifies critical processes and impact of their disruption",dm:5},
  {t:"Due Diligence",d:"Investigation and research BEFORE entering a business relationship",dm:5},
];

const QZ=[
  {q:"A company policy states finance employees cannot both ENTER and APPROVE payment transactions. Which principle is this?",o:["Least Privilege","Dual Control","Separation of Duties","Job Rotation"],a:2,d:1,e:"Separation of Duties splits a critical transaction across two people — preventing any one person from committing fraud alone."},
  {q:"An admin needs to grant a contractor temporary access to one server for 4 hours. Which BEST minimizes risk?",o:["Create a permanent least-privilege account","Just-in-Time access with automatic expiration","Add contractor to existing RBAC group","Share admin credentials temporarily"],a:1,d:1,e:"JIT access grants temporary, time-bound access that auto-revokes after the task — no lingering accounts or excess permissions."},
  {q:"A user enters their password then receives a push notification to their phone to approve login. Which BEST describes this?",o:["Single Sign-On","Multi-Factor Authentication","Federated Identity","Biometric Authentication"],a:1,d:1,e:"MFA combines something you know (password) with something you have (phone) — two different factor types."},
  {q:"Which hashing algorithm is MOST resistant to collision attacks for new implementations?",o:["MD5","SHA-1","SHA-256","RC4"],a:2,d:1,e:"SHA-256 is from the SHA-2 family and is currently collision resistant. MD5 and SHA-1 are both broken. RC4 is a stream cipher not a hash."},
  {q:"A developer stores passwords as SHA-256 hashes. An attacker uses a precomputed lookup table to crack them. Which control would BEST prevent this?",o:["Use AES encryption instead","Add a unique salt before hashing","Use SHA-512 instead","Store passwords in an HSM"],a:1,d:1,e:"Salting adds a unique random value to each password before hashing, making every hash unique and rendering precomputed tables useless."},
  {q:"Which access control model uses sensitivity labels enforced by the SYSTEM — not the user?",o:["DAC","RBAC","ABAC","MAC"],a:3,d:1,e:"MAC (Mandatory Access Control) uses classification labels and clearances enforced by the system — standard for military and government environments."},
  {q:"Users must log into a portal then automatically access Salesforce, Office 365, and Workday without re-entering credentials. Which technology enables this?",o:["MFA","LDAP","SSO with SAML","RADIUS"],a:2,d:1,e:"SSO with SAML enables users to authenticate once and access multiple applications — SAML handles enterprise federation."},
  {q:"Which BEST describes the difference between asymmetric and symmetric encryption?",o:["Asymmetric uses one key; symmetric uses two","Asymmetric uses public/private pair; symmetric uses one shared key","Asymmetric is faster; symmetric is slower","Asymmetric is used for bulk data; symmetric for key exchange"],a:1,d:1,e:"Symmetric = one shared key (fast, bulk data). Asymmetric = public/private pair (slow, key exchange and signatures)."},
  {q:"An attacker obtains a valid session token from a capture and submits it 12 hours later. Which attack is this?",o:["Session Hijacking","Pass-the-Hash","Replay Attack","CSRF"],a:2,d:1,e:"Replay Attack captures a valid token and retransmits it at a LATER time. Session hijacking takes over an ACTIVE live session in real time."},
  {q:"Which BEST provides non-repudiation?",o:["AES-256 encryption","SHA-256 hash","Digital signature with senders private key","TLS 1.3 in transit"],a:2,d:1,e:"A digital signature — hash encrypted with the senders PRIVATE key — proves authenticity and the sender cannot deny sending the message."},
  {q:"A targeted email to a CFO uses her name, references a board meeting, and asks her to urgently wire funds. Which attack is this?",o:["Phishing","Whaling","Vishing","Pretexting"],a:1,d:2,e:"Whaling is spear phishing targeting executives. The personalization and executive target confirm whaling over generic phishing."},
  {q:"Entering malicious SQL like OR 1=1 into a login form deletes the user database. Which vulnerability?",o:["Cross-Site Scripting","Buffer Overflow","SQL Injection","Directory Traversal"],a:2,d:2,e:"SQL injection uses malicious SQL in input fields. The ; and -- characters breaking out of the query are the key indicators."},
  {q:"A search bar reflects input onto the page. An attacker emails a URL containing malicious JavaScript. Which attack?",o:["Stored XSS","CSRF","Reflected XSS","SQL Injection"],a:2,d:2,e:"Reflected XSS — the script is in the URL, reflected in the server response, executed in the victim's browser. Not stored in the database."},
  {q:"A workstation makes outbound connections to 185.210.142.33 on port 443 every 5 minutes with no user logged in. Which threat?",o:["Ransomware encrypting files","C2 beaconing","Misconfigured scheduled task","SSL certificate renewal"],a:1,d:2,e:"Regular interval outbound connections to an external IP from an unmanned system = C2 beaconing — malware checking in with its command-and-control server."},
  {q:"An employee PC shows 97% CPU usage by svchost32.exe with connections to cryptocurrency mining pools. No files encrypted. Which malware?",o:["Ransomware","Spyware","Rootkit","Cryptojacker"],a:3,d:2,e:"Cryptojacking uses victim CPU to mine cryptocurrency. Indicators: extreme CPU usage, no encryption, connections to mining pools."},
  {q:"Malware installs into the Windows kernel, modifies system calls, and causes AV to report no threats. Which malware type?",o:["Trojan","Worm","Rootkit","Logic Bomb"],a:2,d:2,e:"Rootkits operate at kernel level intercepting system calls to hide from OS and AV — AV reporting clean while system misbehaves is the telltale sign."},
  {q:"Employees near the lobby are disconnected from corporate Wi-Fi then reconnected. A second AP with identical SSID is found in a vehicle outside. Which attack?",o:["Rogue Access Point","Deauthentication Attack","Evil Twin","War Driving"],a:2,d:2,e:"Evil Twin mimics the legitimate SSID. The deauthentication pushes clients off the real AP onto the fake one to intercept credentials."},
  {q:"An attacker captures the NTLM hash of an admin password and uses it to authenticate to a file server without cracking it. Which attack?",o:["Rainbow Table","Golden Ticket","Pass-the-Hash","Credential Stuffing"],a:2,d:2,e:"Pass-the-Hash reuses the captured NTLM hash directly for authentication — the actual password never needs to be recovered."},
  {q:"An attacker registers 'micros0ft.com' hoping users who mistype the domain will enter their credentials. Which attack?",o:["Pharming","DNS Poisoning","Typosquatting","Watering Hole"],a:2,d:2,e:"Typosquatting registers deliberately misspelled domain names to catch URL typos."},
  {q:"A threat intelligence report describes an attacker maintaining access to a bank for 14 months, exfiltrating small amounts of data weekly. Which threat actor?",o:["Hacktivist","Script Kiddie","Insider Threat","Nation-State APT"],a:3,d:2,e:"APT indicators: long dwell time, stealthy, slow exfiltration, high sophistication — consistent with nation-state sponsored attackers."},
  {q:"A company migrates web servers to AWS and assumes AWS patches the operating systems. Under IaaS, who is ACTUALLY responsible for OS patching?",o:["Cloud provider","Shared equally","Customer","Third-party managed service"],a:2,d:3,e:"In IaaS, the provider manages hardware and hypervisor. The customer is responsible for OS, middleware, applications, data, and identity."},
  {q:"An organization needs to recover critical systems within 2 hours of a disaster. Which DR term defines this requirement?",o:["RPO","MTBF","MTD","RTO"],a:3,d:3,e:"RTO (Recovery Time Objective) is the maximum acceptable downtime. RPO measures acceptable data loss, not downtime."},
  {q:"A company stores PII using the cloud providers default encryption. The provider is breached and encryption keys stolen. Which control would BEST have prevented this?",o:["TLS for all API calls","CASB monitoring","Client-side encryption with customer-managed keys","Multi-region replication"],a:2,d:3,e:"Client-side encryption with customer-managed keys means the provider never has the keys — a compromised provider cannot decrypt what they never held."},
  {q:"A security team wants to monitor network traffic for compromise and receive alerts, WITHOUT risking blocking legitimate traffic. Which device?",o:["IPS","NGFW","WAF","IDS"],a:3,d:3,e:"IDS is passive — it monitors and alerts but NEVER blocks traffic. IPS would block, which the company specifically wants to avoid."},
  {q:"Daily incremental backups, full backup every Sunday. System fails Saturday at 3 PM. How many backup files needed to restore Fridays end-of-day state?",o:["Sunday full + all 5 incrementals","Sunday full only","Sunday full + Friday incremental only","Friday incremental only"],a:0,d:3,e:"Incremental backups each contain only changes since the PREVIOUS backup — you need the full backup plus every incremental in the chain (Mon-Fri = 5)."},
  {q:"A forensic analyst arrives at a powered-on compromised workstation. What should be collected FIRST?",o:["Forensic image of the hard drive","RAM contents","Windows Event Log","Disconnect from network first"],a:1,d:4,e:"RAM is lost the moment the system powers off — collect volatile memory (CPU cache, then RAM) before anything else including disk imaging."},
  {q:"After confirming malware on a server, what comes AFTER containment?",o:["Restore from last nights backup","Eradicate malware and patch the vulnerability","Conduct lessons-learned meeting","Notify management"],a:1,d:4,e:"Eradication (remove threat + patch) must happen after containment and BEFORE recovery — restoring into a vulnerable system causes immediate reinfection."},
  {q:"An organization wants to automatically quarantine phishing emails, block senders, and create tickets — without human intervention. Which technology?",o:["SIEM","IDS","SOAR","UEBA"],a:2,d:4,e:"SOAR automates repetitive security tasks and IR playbooks. SIEM detects and alerts, but SOAR takes automated action."},
  {q:"Logs show 342 failed logins then one success on the admin account from an IP in a country where the org has no employees. Which attack?",o:["Password Spraying","Credential Stuffing","Brute Force","Replay Attack"],a:2,d:4,e:"Many failed attempts against one account from an unusual location indicates brute force. The foreign IP with eventual success is the pattern."},
  {q:"A SIEM alert shows 47 failed logins to the same account then one successful login from a foreign IP. What is the FIRST action?",o:["Email the owner to ask","Isolate the workstation immediately","Create a ticket for morning shift","Run a vulnerability scan"],a:1,d:4,e:"Immediate containment — isolate the compromised account/workstation before the attacker can move laterally or cause further damage."},
  {q:"An employee changes roles but keeps permissions from their old position over 3 years. Which term BEST describes this?",o:["Insider Threat","Separation of Duties violation","Privilege Creep","Over-provisioning"],a:2,d:4,e:"Privilege creep = gradual accumulation of access rights beyond current role needs as users change roles without old access being revoked."},
  {q:"A developer accidentally pushes production database credentials to a public GitHub repo. What should happen FIRST?",o:["Delete the repository","Remove credentials from commit history","Revoke and rotate the exposed credentials immediately","Notify the team lead"],a:2,d:4,e:"Bots scan GitHub within seconds. Revoke credentials immediately (containment) — deletion cannot unexpose already-scraped credentials."},
  {q:"A company purchases cyber liability insurance to cover financial losses from a data breach. Which risk response?",o:["Avoidance","Mitigation","Acceptance","Transference"],a:3,d:5,e:"Risk Transference shifts the financial burden to a third party — cyber insurance is the classic example."},
  {q:"SLE = $200,000, ARO = 0.25. What is the ALE?",o:["$200,000","$50,000","$800,000","$100,000"],a:1,d:5,e:"ALE = SLE × ARO = $200,000 × 0.25 = $50,000. ALE is the expected yearly financial impact."},
  {q:"A compliance officer reviews HIPAA for a new EHR system. HIPAA requires protection of:",o:["All personal data of US citizens","Protected Health Information (PHI) of patients","Financial records of healthcare organizations","Research data in medical journals"],a:1,d:5,e:"HIPAA protects PHI (Protected Health Information) — individually identifiable health information maintained by covered healthcare entities."},
  {q:"A company stops storing customer credit card numbers after determining storage risk outweighs benefit. Which risk response?",o:["Mitigation","Transference","Acceptance","Avoidance"],a:3,d:5,e:"Risk Avoidance eliminates the risky activity entirely — by not storing card numbers, the organization removes the risk completely."},
  {q:"A vendor contract requires breach notification within 24 hours, annual security audits, and SOC 2 Type II certification. This BEST describes:",o:["SLA terms","Supply chain risk management controls","NDA obligations","GDPR compliance"],a:1,d:5,e:"Requiring security notifications, audit rights, and certifications in vendor contracts is supply chain risk management."},
  {q:"An employee emails themselves a spreadsheet with 2,000 customer records to work from home. Which policy is violated?",o:["Change Management Policy","Acceptable Use Policy","Clean Desk Policy","Data Retention Policy"],a:1,d:5,e:"The Acceptable Use Policy governs how employees may use organizational systems and data — emailing sensitive data to personal accounts violates AUP."},
  {q:"An organizations legal team issues a hold for all emails of a specific executive for 3 years. The standard retention policy is 90 days. What takes precedence?",o:["Retention policy — policies override legal holds","Legal hold — legal obligations override internal policies","Whichever was created first","Depends on data classification"],a:1,d:5,e:"Legal holds ALWAYS take precedence over internal retention policies — deleting records under a legal hold could constitute evidence tampering."},
  // Domain 1 — 9 more
  {q:"Which of the following BEST describes the purpose of a Certificate Authority (CA)?",o:["Stores user passwords securely","Issues and signs digital certificates binding public keys to identities","Generates symmetric encryption keys for TLS sessions","Monitors network traffic for certificate abuse"],a:1,d:1,e:"A CA is a trusted entity that issues and digitally signs certificates — it is the root of trust in a PKI infrastructure."},
  {q:"A company wants users to access internal resources remotely. All traffic must be inspected before reaching internal systems. Which VPN type BEST meets this?",o:["Split Tunnel VPN","Full Tunnel VPN","Site-to-Site VPN","Clientless VPN"],a:1,d:1,e:"Full Tunnel VPN routes ALL traffic through the corporate network — enabling inspection of all traffic including internet browsing. Split Tunnel only routes corporate traffic."},
  {q:"An admin account on a server was accessed at 2AM, no user was scheduled to work. Logs show a successful login from an internal IP. Which principle would MOST have limited the damage?",o:["Defense in Depth","Least Privilege","Job Rotation","Due Care"],a:1,d:1,e:"Least Privilege limits what any account can access. If the admin account had only the minimum necessary permissions, the damage from its compromise is contained."},
  {q:"Which of the following BEST describes the difference between identification and authentication?",o:["Identification proves identity; authentication claims it","Identification claims an identity; authentication proves it","They are the same process","Identification uses biometrics; authentication uses passwords"],a:1,d:1,e:"Identification = claiming an identity (entering a username). Authentication = PROVING that identity (password, biometric, token)."},
  {q:"A security engineer wants to protect stored passwords so precomputed lookup tables cannot crack them. Which BEST achieves this?",o:["Encrypt passwords with AES-256","Hash with MD5","Hash with SHA-256 plus a unique salt per user","Store passwords in an HSM"],a:2,d:1,e:"A unique salt per user makes every hash unique even if passwords are identical — precomputed rainbow tables are completely useless against salted hashes."},
  {q:"Which authentication protocol uses UDP and is commonly deployed for Wi-Fi and VPN authentication?",o:["Kerberos","TACACS+","LDAP","RADIUS"],a:3,d:1,e:"RADIUS uses UDP and is the standard for centralized authentication of VPN and Wi-Fi users. TACACS+ uses TCP and is Cisco proprietary."},
  {q:"A new employee is given access to every file share, application, and system on their first day just in case they need it. Which principle is MOST violated?",o:["Separation of Duties","Dual Control","Non-repudiation","Least Privilege"],a:3,d:1,e:"Least Privilege — users should receive only the minimum access required for their specific role. Granting everything upfront is a direct violation."},
  {q:"Which of the following provides BOTH authentication and non-repudiation?",o:["Symmetric encryption with AES","HTTPS/TLS encryption","Digital signature using sender private key","Password hashing with bcrypt"],a:2,d:1,e:"A digital signature proves WHO sent a message (authentication) and ensures they cannot deny it (non-repudiation) — signed with the sender PRIVATE key."},
  {q:"An organization requires employees who manage cryptographic keys to never do so alone. Which principle does this BEST represent?",o:["Least Privilege","Separation of Duties","Dual Control","Need to Know"],a:2,d:1,e:"Dual Control requires two authorized individuals to be physically present simultaneously — specifically designed for high-value operations like key management."},
  // Domain 2 — 14 more
  {q:"A user receives a text message claiming their bank account is locked and must verify credentials at a provided link. Which attack type?",o:["Phishing","Vishing","Smishing","Pretexting"],a:2,d:2,e:"Smishing is SMS-based phishing — using text messages to deliver malicious links or manipulate victims into revealing credentials."},
  {q:"An attacker calls an employee claiming to be from IT support and asks them to read out their password for a system upgrade. Which technique?",o:["Whaling","Vishing","Spear Phishing","Baiting"],a:1,d:2,e:"Vishing (voice phishing) — using phone calls to impersonate trusted entities (IT support, bank, IRS) to extract sensitive information."},
  {q:"Which of the following BEST describes a logic bomb?",o:["Malware that encrypts files for ransom","Code that triggers malicious actions when a specific condition is met","A virus that spreads through email attachments","Spyware that monitors keystrokes"],a:1,d:2,e:"A logic bomb executes when a trigger condition is met (a date, a login event, a file deletion). Often planted by disgruntled insiders with delayed activation."},
  {q:"Which of the following attacks specifically targets the TCP three-way handshake to exhaust server resources?",o:["Smurf Attack","Ping of Death","SYN Flood","DNS Amplification"],a:2,d:2,e:"SYN Flood sends millions of SYN packets but never completes the handshake — the server holds half-open connections until its connection table is exhausted."},
  {q:"An attacker sends ICMP requests to a broadcast address with the victim IP as the spoofed source. The victim is flooded with replies. Which attack?",o:["SYN Flood","Smurf Attack","Ping of Death","Teardrop Attack"],a:1,d:2,e:"Smurf Attack uses ICMP broadcast amplification — the network acts as an unwitting reflector, multiplying traffic directed at the spoofed victim IP."},
  {q:"Which of the following BEST describes a watering hole attack?",o:["Sending phishing emails to all employees","Leaving infected USB drives in a parking lot","Compromising a website frequently visited by the target group","Calling victims pretending to be IT support"],a:2,d:2,e:"Watering hole attacks compromise websites that the target group is known to visit — waiting for victims to come to the attacker rather than actively targeting them."},
  {q:"An attacker uses legitimate built-in OS tools like PowerShell, WMI, and PsExec to move through a network without dropping any malicious files. Which threat type?",o:["Rootkit","Fileless Malware","Advanced Persistent Threat","Logic Bomb"],a:1,d:2,e:"Fileless malware / living-off-the-land attacks use legitimate built-in tools — no malicious files written to disk means signature-based AV cannot detect them."},
  {q:"A web application stores user-submitted comments in a database. An attacker posts a comment with malicious JavaScript that executes in every visitor browser. Which attack?",o:["Reflected XSS","CSRF","Stored XSS","SQL Injection"],a:2,d:2,e:"Stored XSS — the script is saved in the database and executed for EVERY user who loads the comments page. Reflected XSS only affects the user clicking the malicious link."},
  {q:"An attacker forges a request that causes a logged-in user to unknowingly transfer $5,000 to the attacker account by clicking a malicious link. Which attack?",o:["Stored XSS","CSRF","Reflected XSS","Session Hijacking"],a:1,d:2,e:"CSRF (Cross-Site Request Forgery) tricks an authenticated user into unknowingly submitting malicious requests — the browser sends the request with the user existing session cookies."},
  {q:"Logs show thousands of login attempts against multiple accounts, each account tried only once or twice, all from the same IP. Which attack?",o:["Brute Force","Credential Stuffing","Password Spraying","Dictionary Attack"],a:2,d:2,e:"Password Spraying tries a few common passwords against MANY accounts — avoids lockout by staying under the threshold per account. Brute force tries many passwords against ONE account."},
  {q:"Which of the following BEST describes a zero-day vulnerability?",o:["A vulnerability that has been patched but not yet deployed","A vulnerability exploited before the vendor has released a patch","A misconfiguration in a default installation","A vulnerability rated 0.0 on the CVSS scale"],a:1,d:2,e:"Zero-day means the vendor has zero days to fix it — the vulnerability is being exploited in the wild before any patch exists."},
  {q:"An attacker gains access to a low-privilege web server account and then exploits a kernel vulnerability to gain root access. Which technique?",o:["Lateral Movement","Credential Stuffing","Privilege Escalation","Pass-the-Hash"],a:2,d:2,e:"Privilege escalation is gaining higher permissions than originally authorized — moving from a low-privilege process to root is vertical privilege escalation."},
  {q:"Which attack involves using the ../ sequence in a URL to access files outside the intended web directory?",o:["SQL Injection","Buffer Overflow","Directory Traversal","Command Injection"],a:2,d:2,e:"Directory traversal uses ../ sequences to navigate outside the web root — commonly used to read sensitive system files like /etc/passwd."},
  {q:"A threat actor compromises a software update server and embeds malware in a legitimate update pushed to thousands of customers. Which attack?",o:["Watering Hole","Fileless Malware","Supply Chain Attack","Trojan"],a:2,d:2,e:"Supply chain attack — the attacker compromises a trusted vendor distribution mechanism to reach downstream targets. The SolarWinds breach is the textbook example."},
  // Domain 3 — 10 more
  {q:"Which of the following cloud service models gives the customer the LEAST security responsibility?",o:["IaaS","PaaS","SaaS","On-premises"],a:2,d:3,e:"In SaaS the provider manages everything from hardware to the application. The customer is only responsible for data and user access management."},
  {q:"A VM on a shared hypervisor exploits a kernel bug to read memory from another VM on the same physical host. Which attack?",o:["Container Breakout","Side-Channel Attack","VM Escape","Hypervisor DoS"],a:2,d:3,e:"VM Escape is when an attacker breaks out of a VM to access the host hypervisor or other VMs running on the same hardware."},
  {q:"Which of the following BEST describes the purpose of a WAF compared to a standard firewall?",o:["WAF operates at Layer 3; standard firewall at Layer 7","WAF inspects HTTP/HTTPS at Layer 7; standard firewall filters at Layer 3-4","WAF is faster than a standard firewall","WAF replaces the need for a standard firewall"],a:1,d:3,e:"WAF specifically understands web application traffic at Layer 7 — it can detect SQLi, XSS, CSRF. Standard firewalls work at Layers 3-4 and cannot inspect application-layer content."},
  {q:"An organization needs their backup site activated within 4 hours but has a medium budget. Which site type BEST fits?",o:["Hot Site","Warm Site","Cold Site","Mobile Site"],a:1,d:3,e:"Warm Site balances cost and recovery time — partially equipped, data restored from backup, recoverable in hours to days. Hot site is faster but most expensive."},
  {q:"Which of the following BEST describes the shared responsibility model in IaaS?",o:["Provider responsible for everything","Customer responsible for everything","Provider manages physical/hypervisor; customer manages OS through data","Provider manages OS; customer manages applications only"],a:2,d:3,e:"In IaaS the provider manages physical hardware, network, and hypervisor. The customer owns the OS, patching, middleware, applications, and data."},
  {q:"A Type 1 hypervisor has a security advantage over a Type 2 because:",o:["It supports more VMs","It runs directly on hardware with no underlying OS to exploit","It supports hardware encryption","It is cheaper to license"],a:1,d:3,e:"Type 1 (bare-metal) runs directly on hardware — there is no host OS layer that could be compromised. Type 2 runs on a host OS, adding an attack surface."},
  {q:"Which network architecture principle explicitly states that no user, device, or application should be trusted by default regardless of network location?",o:["Defense in Depth","DMZ Architecture","Zero Trust","Network Access Control"],a:2,d:3,e:"Zero Trust architecture rejects the old perimeter model — every access request is verified regardless of whether it comes from inside or outside the network."},
  {q:"A differential backup was taken Sunday and daily differential backups run Monday through Saturday. The system fails Saturday at noon. How many restore operations are needed?",o:["Seven — Sunday full plus all six differentials","Two — Sunday full plus Friday differential","Three — Sunday full, Thursday and Friday differentials","One — only Saturday differential"],a:1,d:3,e:"Differential contains ALL changes since the last full — Sunday full plus Friday differential (which includes Mon-Fri changes) = only 2 restores needed."},
  {q:"Which of the following BEST describes the purpose of a CASB?",o:["Blocks SQL injection on web apps","Monitors and controls employee use of cloud applications","Encrypts endpoint hard drives","Detects malware on laptops"],a:1,d:3,e:"CASB (Cloud Access Security Broker) specifically monitors, controls, and enforces policy on cloud application usage — including detecting shadow IT and unsanctioned apps."},
  {q:"An organization suffers a major disaster. Their RTO is 2 hours. Which backup site type can BEST meet this requirement?",o:["Cold Site","Warm Site","Hot Site","Offsite Tape Backup"],a:2,d:3,e:"Hot Site is fully operational with real-time sync — it can be activated in minutes to hours. Cold and Warm sites cannot reliably meet a 2-hour RTO."},
  // Domain 4 — 11 more
  {q:"A SOC analyst sees: failed logins, new admin account created, AV disabled, scheduled task created in Temp — all within 2 minutes at midnight. First action?",o:["Email the workstation owner","Isolate the workstation immediately","Open a ticket for morning shift","Run a vulnerability scan"],a:1,d:4,e:"The sequence — new admin account, AV disabled, scheduled task in Temp — are classic ransomware/malware staging steps. Immediate isolation (containment) prevents spread."},
  {q:"During forensics, an analyst creates a SHA-256 hash of a drive image immediately after collection. What is the PURPOSE?",o:["Compress the evidence for storage","Prove the evidence was not altered after collection","Encrypt the evidence for chain of custody","Verify the drive image is bootable"],a:1,d:4,e:"Hashing evidence immediately creates a fingerprint — any later alteration produces a different hash, mathematically proving tampering occurred."},
  {q:"An access system grants access based on user department, current physical location, time of day, AND resource sensitivity combined. Which model?",o:["RBAC","DAC","MAC","ABAC"],a:3,d:4,e:"ABAC grants access based on MULTIPLE attributes simultaneously — department + location + time + sensitivity all evaluated together."},
  {q:"A company implements a policy requiring developers to have elevated privileges only during deployments, automatically revoked after 2 hours. Which principle?",o:["Separation of Duties","Least Privilege with JIT Access","Dual Control","MAC"],a:1,d:4,e:"JIT (Just-in-Time) Access with Least Privilege — temporary, time-bound elevation only when needed with automatic revocation minimizes the window of excess privilege."},
  {q:"Which of the following BEST describes the difference between a Red Team and a Tabletop Exercise?",o:["Red Team is cheaper; Tabletop is more comprehensive","Red Team simulates real attacks with all vectors; Tabletop is discussion-based with no system interaction","Red Team tests physical security only; Tabletop tests network security","They are equivalent but use different terminology"],a:1,d:4,e:"Red Team engagements simulate sophisticated adversaries using real attack techniques. Tabletop exercises are purely discussion-based — no systems are touched."},
  {q:"A help desk account has had Read, Write, Execute, and Admin access to every folder for 3 years across three role changes. Which term describes this?",o:["Insider Threat","Separation of Duties violation","Privilege Creep","Over-provisioning"],a:2,d:4,e:"Privilege creep = gradual accumulation of access rights as users change roles without old permissions being revoked. Fixed by periodic user access reviews."},
  {q:"Which tool would MOST effectively detect an employee accessing 800 patient records at 3AM when they normally access 12 records during business hours?",o:["Antivirus","Full Disk Encryption","UEBA","Password Policy"],a:2,d:4,e:"UEBA baselines normal behavior patterns and flags statistical deviations — 800 records at 3AM vs average 12 during business hours is a massive behavioral anomaly."},
  {q:"An organization tests its IR procedures by having the team discuss a ransomware scenario in a conference room without touching any systems. Which exercise?",o:["Penetration Test","Red Team Engagement","Tabletop Exercise","Vulnerability Assessment"],a:2,d:4,e:"Tabletop exercises are discussion-based simulations — teams walk through scenarios verbally to test procedures, communication, and decision-making without system interaction."},
  {q:"A legal team issues a preservation order for all emails related to ongoing litigation. The IT team must retain this data even past the 90-day policy. Which term?",o:["Chain of Custody","eDiscovery","Legal Hold","Data Classification"],a:2,d:4,e:"A Legal Hold is a preservation order requiring organizations to retain relevant data beyond normal retention periods — deletion could constitute evidence tampering."},
  {q:"Which of the following actions occurs during the CONTAINMENT phase of incident response?",o:["Remove malware and patch the vulnerability","Restore systems from a clean backup","Isolate compromised systems to stop the spread","Conduct a post-incident review meeting"],a:2,d:4,e:"Containment = STOP the spread. Isolating systems, blocking IPs, and disabling accounts happen in Containment. Removing malware is Eradication. Restoring is Recovery."},
  {q:"A penetration tester discovers RCE but rules of engagement prohibit exploiting production systems. The tester has working exploit code. What to do NEXT?",o:["Test exploit in lab to confirm","Exploit production to demonstrate impact","Document with evidence and report per rules of engagement","Wait until full assessment is complete"],a:2,d:4,e:"Rules of engagement are binding — stay within authorized scope. Document with sufficient evidence (version, CVE, PoC code) and immediately escalate without exploiting production."},
  // Domain 5 — 7 more
  {q:"A CISO classifies a database containing employee salaries, medical leave, and performance reviews. Which classification level?",o:["Public","Internal","Confidential","Restricted"],a:2,d:5,e:"Confidential data includes sensitive employee and business information — disclosure causes significant harm. Restricted is for the most sensitive data like trade secrets or classified government info."},
  {q:"An organization identifies a risk and decides the cost to mitigate exceeds the potential loss. They document it and move on. Which risk response?",o:["Avoidance","Transference","Mitigation","Acceptance"],a:3,d:5,e:"Risk Acceptance — when the cost to mitigate exceeds the potential impact, organizations formally acknowledge and accept the risk within their risk appetite."},
  {q:"Which NIST CSF function includes identifying critical assets, understanding business context, and establishing risk tolerance?",o:["Protect","Detect","Identify","Respond"],a:2,d:5,e:"The Identify function establishes the foundation — understanding the organization, assets, risks, and governance needed to manage cybersecurity risk."},
  {q:"A company processes payments for EU citizens. Under GDPR, a data breach must be reported to the supervisory authority within how many hours?",o:["24 hours","48 hours","72 hours","7 days"],a:2,d:5,e:"GDPR Article 33 requires breach notification to the supervisory authority within 72 hours of becoming aware — unless the breach is unlikely to result in risk to individuals."},
  {q:"An organization wants to verify a vendor handles data securely before signing a contract. Which activity does this BEST describe?",o:["Due Care","Due Diligence","Risk Transference","SLA Review"],a:1,d:5,e:"Due Diligence is the investigation and research performed BEFORE entering a business relationship. Due Care is the ongoing effort to maintain security AFTER the relationship begins."},
  {q:"A vendor SLA guarantees 99.9% uptime. Which DR concept does this percentage MOST directly relate to?",o:["RPO","RTO","MTBF","Availability"],a:3,d:5,e:"99.9% uptime directly measures Availability — the percentage of time systems are operational. This translates to approximately 8.7 hours of downtime per year."},
  {q:"An auditor finds that a database admin can create accounts, assign permissions, AND access all data without any oversight. Which control is MISSING?",o:["Least Privilege","Dual Control","Separation of Duties","Need to Know"],a:2,d:5,e:"Separation of Duties — the admin should not be able to create accounts, assign permissions, AND access data all alone. These tasks should be split across different roles."},

  // ── DOMAIN 1 ADDITIONAL (need 21 more to reach 40) ──────────────────────────
  {q:"Which encryption algorithm provides the STRONGEST security for encrypting data at rest?",o:["3DES","DES","RC4","AES-256"],a:3,d:1,e:"AES-256 is the current gold standard for symmetric encryption — 256-bit key length, no known practical attacks, used by the US government for TOP SECRET data."},
  {q:"A company wants to verify software has not been tampered with since it was published. Which cryptographic mechanism BEST achieves this?",o:["Encrypting the software with AES","Comparing a published hash against a locally computed hash","Signing the software with a symmetric key","Storing the software in an HSM"],a:1,d:1,e:"Hashing verifies integrity — compute the hash of the downloaded software and compare against the publisher published hash. Any modification produces a different hash."},
  {q:"Which of the following BEST describes the purpose of key escrow?",o:["Backs up encryption keys with a trusted third party for lawful recovery","Stores public keys in a directory for distribution","Splits encryption keys across multiple administrators","Encrypts keys using asymmetric cryptography before storage"],a:0,d:1,e:"Key escrow holds copies of encryption keys with a trusted third party — allows lawful recovery of encrypted data if the primary key is lost or for law enforcement purposes."},
  {q:"An organization implements MFA requiring a password AND a fingerprint scan. Which factor types are being combined?",o:["Something you know and something you have","Something you have and something you are","Something you know and something you are","Two instances of something you know"],a:2,d:1,e:"Password = something you know. Fingerprint = something you are (biometric). True MFA combines DIFFERENT factor types — two passwords would not qualify as MFA."},
  {q:"Which of the following protocols provides federated authentication allowing users to log into third-party apps using their corporate credentials WITHOUT sharing passwords?",o:["LDAP","RADIUS","SAML","Kerberos"],a:2,d:1,e:"SAML enables federated SSO between organizations — the identity provider authenticates the user and sends assertions to the service provider without the SP ever seeing the password."},
  {q:"A company discovers employees are reusing passwords from personal accounts on corporate systems. Which control BEST reduces this risk?",o:["Password history policy preventing reuse of last 24 passwords","Requiring passwords to expire every 90 days","Implementing SSO for all corporate applications","Requiring passwords to be at least 8 characters"],a:0,d:1,e:"Password history policy prevents reuse of recent passwords — combined with a strong minimum length requirement, this directly addresses password reuse behavior."},
  {q:"Which of the following BEST describes the difference between DAC and MAC?",o:["DAC uses labels; MAC uses owner permissions","DAC lets the owner decide access; MAC has access enforced by the system using labels","DAC is used in military settings; MAC is used in commercial settings","DAC requires two-person authorization; MAC does not"],a:1,d:1,e:"DAC = Discretionary — the data owner discretionarily decides who gets access. MAC = Mandatory — the system enforces access based on classification labels and user clearances."},
  {q:"An employee leaves the company. Which action is MOST critical from a security perspective?",o:["Return of company equipment","Immediate deprovisioning of all system access","Exit interview completion","Return of access badges"],a:1,d:1,e:"Immediate deprovisioning removes all system access — a former employee with active accounts is a significant insider threat risk. Equipment return is important but access revocation is the security priority."},
  {q:"Which of the following BEST describes perfect forward secrecy in TLS?",o:["Each TLS session uses the same long-term key","Each TLS session generates a unique ephemeral key pair","The session key is stored in an HSM","The private key is never transmitted"],a:1,d:1,e:"PFS generates unique ephemeral (temporary) key pairs for each session — even if the server long-term private key is later compromised, past recorded sessions cannot be decrypted."},
  {q:"A security team wants to ensure users can only access resources appropriate to their current role at this moment. Which access model is MOST flexible for this?",o:["DAC","MAC","RBAC","ABAC"],a:3,d:1,e:"ABAC evaluates multiple dynamic attributes simultaneously — current role, location, time, resource sensitivity — making it the most flexible for context-aware access decisions."},
  {q:"Which hashing algorithm should be used when storing user passwords in a database?",o:["MD5","SHA-1","SHA-256","bcrypt"],a:3,d:1,e:"bcrypt is specifically designed for password storage — it includes salting and a configurable work factor that makes brute force attacks extremely slow even with modern hardware."},
  {q:"An organization requires that system changes can only be applied after approval from both the developer AND the security team. Which principle does this BEST represent?",o:["Least Privilege","Dual Control","Separation of Duties","Defense in Depth"],a:2,d:1,e:"Separation of Duties — the developer and security team each control different parts of the process. Neither can deploy changes alone, preventing unauthorized or untested modifications."},
  {q:"Which of the following BEST describes the role of a Registration Authority (RA) in a PKI?",o:["Issues and signs digital certificates","Verifies identity of certificate requestors on behalf of the CA","Stores revoked certificate information","Manages the certificate revocation list"],a:1,d:1,e:"An RA verifies the identity of certificate applicants before the CA issues the certificate — it is the identity verification front-end that offloads this work from the CA."},
  {q:"What is the PRIMARY security benefit of using certificate pinning?",o:["Speeds up TLS handshake performance","Prevents accepting fraudulent certificates even from trusted CAs","Allows certificates to be self-signed","Eliminates need for certificate renewal"],a:1,d:1,e:"Certificate pinning hardcodes expected certificate or public key values — even if an attacker compromises a CA and issues a fraudulent cert, pinning will reject it."},
  {q:"A user logs into their workstation and can then access email, file shares, and HR systems without entering credentials again. Which technology enables this?",o:["MFA","LDAP directory","Kerberos SSO","PKI certificates"],a:2,d:1,e:"Kerberos provides SSO within an Active Directory environment — the user authenticates once to the KDC and receives tickets used to access internal services transparently."},
  {q:"Which of the following BEST describes OpenID Connect?",o:["A protocol for enterprise SSO using XML assertions","A delegated authorization framework for API access","An authentication layer built on top of OAuth 2.0","A directory protocol for storing user credentials"],a:2,d:1,e:"OpenID Connect adds an authentication (identity) layer on top of OAuth 2.0 — OAuth handles authorization, OpenID Connect adds the WHO (identity) component."},
  {q:"An organization stores sensitive encryption keys in a device that generates keys internally and never exports them in plaintext. Which device is this?",o:["LDAP directory","HSM","TPM chip","Smart card"],a:1,d:1,e:"An HSM (Hardware Security Module) is specifically designed to generate, store, and manage cryptographic keys in tamper-resistant hardware — keys never leave in plaintext."},
  {q:"Which of the following describes a collision attack against a hash function?",o:["Reversing a hash to find the original plaintext","Finding two different inputs that produce the same hash output","Stealing the hash from a database","Brute forcing a hash using GPUs"],a:1,d:1,e:"A collision attack finds two DIFFERENT inputs that produce the same hash value — this breaks integrity verification because a malicious file could have the same hash as a legitimate one."},
  {q:"A company policy requires logging every action performed using privileged accounts. Which component of AAA does this BEST represent?",o:["Authentication","Authorization","Accounting","Auditing"],a:2,d:1,e:"Accounting (the third A in AAA) involves logging and tracking what authenticated, authorized users actually do — creating an audit trail of all privileged actions."},
  {q:"An attacker intercepts network traffic and uses the captured data to determine a user session token. The attacker then uses this token successfully at a later time. What is the BEST defense against this?",o:["Longer passwords","Session tokens with short expiration times and TLS encryption","RADIUS authentication","IP-based access controls"],a:1,d:1,e:"Short-lived session tokens limit the window of opportunity for replay attacks. TLS encryption prevents token interception in the first place. Both together are the best defense."},
  {q:"Which of the following BEST describes the principle of defense in depth?",o:["Having the most powerful firewall available","Using multiple overlapping security controls so failure of one does not compromise everything","Encrypting all data at rest and in transit","Requiring MFA for all user accounts"],a:1,d:1,e:"Defense in depth layers multiple security controls — technical, operational, and physical — so an attacker must defeat multiple independent controls to succeed."},
  // ── DOMAIN 2 ADDITIONAL (need 49 more to reach 73) ───────────────────────────
  {q:"An attacker sends an email to a CEO appearing to come from the CFO, requesting an urgent wire transfer to a new vendor account. Which attack?",o:["Phishing","Business Email Compromise","Vishing","Pretexting"],a:1,d:2,e:"Business Email Compromise (BEC) impersonates executives or trusted contacts via email to authorize fraudulent financial transfers — one of the costliest cybercrimes."},
  {q:"Malware on a workstation creates a hidden channel by encoding data within normal DNS queries to communicate with an attacker server. Which technique?",o:["ARP Poisoning","DNS Amplification","DNS Tunneling","SSL Stripping"],a:2,d:2,e:"DNS Tunneling encodes data within DNS query and response packets to create a covert communication channel — often used for C2 communication or data exfiltration bypassing firewalls."},
  {q:"An attacker gains access to a company Slack and reads messages for three weeks without taking any action. Which threat actor behavior does this demonstrate?",o:["Smash-and-grab","Reconnaissance only","Dwell time / APT behavior","Script kiddie activity"],a:2,d:2,e:"Extended dwell time with passive reconnaissance is characteristic of APT behavior — sophisticated attackers observe environments for weeks before acting to maximize impact and avoid detection."},
  {q:"Which of the following BEST describes a Trojan horse malware?",o:["Spreads automatically across networks without user action","Disguises itself as legitimate software to trick users into installing it","Encrypts all files and demands ransom","Installs at kernel level to hide from antivirus"],a:1,d:2,e:"A Trojan disguises itself as legitimate software (game, utility, PDF) to deceive users into running it — unlike worms it does not self-replicate and relies entirely on user deception."},
  {q:"An employee plugs in a USB drive found in the company parking lot labeled PAYROLL 2025. Which attack technique was used?",o:["Smishing","Baiting","Pretexting","Tailgating"],a:1,d:2,e:"Baiting uses enticing physical media (USB drives with tempting labels) left in public spaces — relying on curiosity to get victims to plug in malware-infected devices."},
  {q:"A security researcher finds a vulnerability in production software and reports it directly to the vendor, allowing 90 days to patch before public disclosure. Which process?",o:["Bug Bounty","Full Disclosure","Coordinated/Responsible Disclosure","OSINT"],a:2,d:2,e:"Responsible (coordinated) disclosure gives vendors time to patch before public disclosure — balancing researcher transparency with vendor ability to protect users."},
  {q:"Which of the following is the PRIMARY indicator that distinguishes spear phishing from generic phishing?",o:["Spear phishing uses phone calls","Spear phishing targets executives only","Spear phishing uses personalized details about the specific victim","Spear phishing is always delivered via SMS"],a:2,d:2,e:"Personalization is the defining characteristic of spear phishing — using the victim name, employer, role, colleagues, or recent activities to make the attack convincing."},
  {q:"An attacker intercepts a valid authentication cookie using a network sniffer while the victim is actively browsing. They immediately inject it into their browser. Which attack?",o:["Replay Attack","Pass-the-Hash","Session Hijacking","CSRF"],a:2,d:2,e:"Session Hijacking takes over an ACTIVE authenticated session in real time. Replay Attack captures tokens and uses them LATER at a different time."},
  {q:"A financial services company notices small test transactions of $0.01 sent to hundreds of accounts. Which type of attack does this indicate?",o:["Salami Attack","Ransomware","Credential Stuffing","SQL Injection"],a:0,d:2,e:"Salami attacks steal small amounts from many accounts — each individual theft is too small to notice but aggregate to significant fraud. The test transactions confirm the accounts are active."},
  {q:"Which of the following BEST describes SSL stripping?",o:["Removing SSL certificates from a web server","Downgrading an HTTPS connection to HTTP without the user knowing","Stealing SSL private keys from a server","Brute forcing SSL session keys"],a:1,d:2,e:"SSL stripping intercepts the initial HTTP request before it is upgraded to HTTPS — the attacker communicates with the server via HTTPS but serves HTTP to the victim, who believes the connection is secure."},
  {q:"An attacker sends a packet larger than 65,535 bytes (maximum IP packet size) to a target system, causing it to crash. Which attack?",o:["SYN Flood","Smurf Attack","Ping of Death","Teardrop Attack"],a:2,d:2,e:"Ping of Death sends oversized or malformed ICMP packets exceeding the maximum IP packet size — older systems could not handle reassembling the malformed packet, causing crashes."},
  {q:"An attacker intercepts network traffic between a user and their bank, decrypts it, reads account details, re-encrypts it, and forwards it. Which attack?",o:["Replay Attack","Session Hijacking","Man-in-the-Middle","ARP Poisoning"],a:2,d:2,e:"MitM (Man-in-the-Middle) involves actively intercepting, reading, potentially modifying, and forwarding communications between two parties who believe they are communicating directly."},
  {q:"A web application allows file uploads. An attacker uploads a file named shell.php disguised as an image. The server executes it and grants remote access. Which vulnerability?",o:["Directory Traversal","Privilege Escalation","Unrestricted File Upload / Improper Input Validation","Buffer Overflow"],a:2,d:2,e:"Unrestricted file upload with improper input validation — the server failed to validate that the uploaded file was actually an image before executing it."},
  {q:"Which of the following BEST describes credential stuffing?",o:["Trying every possible password against one account","Using breached username/password pairs from other sites on new targets","Trying a few common passwords against many accounts","Intercepting credentials during transmission"],a:1,d:2,e:"Credential stuffing uses actual compromised credentials from one breach to attack other services — exploiting password reuse across different sites."},
  {q:"An attacker compromises a supplier website visited regularly by employees of a target company, embedding malware that infects only systems from the target company IP range. Which attack?",o:["Spear Phishing","Watering Hole Attack","Supply Chain Attack","Drive-by Download"],a:1,d:2,e:"Watering Hole attack compromises a website the target group frequents — waiting for victims to come to the attacker. The IP-range filtering shows sophisticated targeting."},
  {q:"Which of the following BEST describes the purpose of a botnet?",o:["A network of honeypots designed to trap attackers","A collection of compromised machines controlled by a C2 server for coordinated attacks","A legitimate distributed computing network","A network monitoring system"],a:1,d:2,e:"A botnet is a network of compromised machines (bots) remotely controlled via C2 infrastructure — used for DDoS attacks, spam campaigns, credential stuffing, and cryptomining."},
  {q:"A threat actor sends millions of small UDP packets to random ports on a target, overwhelming its network stack. Which attack category?",o:["Application Layer DDoS","Volumetric DDoS","Protocol Attack","Reflection Attack"],a:1,d:2,e:"Volumetric DDoS floods the target with massive traffic volume to consume bandwidth and network resources — UDP floods are a common volumetric attack technique."},
  {q:"Which of the following BEST describes a rootkit that installs into the Master Boot Record?",o:["Application rootkit","Library rootkit","Bootkit / Firmware rootkit","Kernel rootkit"],a:2,d:2,e:"A bootkit (MBR rootkit) executes before the OS loads — it persists across OS reinstallation and is extremely difficult to remove since it controls the boot process."},
