  {q:"Which of the following BEST describes the purpose of a jump server (bastion host)?",o:["Provides redundancy for web servers","Acts as a hardened single point of entry for admin access to sensitive network zones","Filters web application traffic","Stores encryption keys for database access"],a:1,d:3,e:"A jump server is a hardened intermediary host — admins connect TO the jump server first, then FROM the jump server to internal systems. Centralizes and logs all privileged access."},
  {q:"A company wants to ensure that if their primary internet connection fails, traffic automatically routes through a secondary ISP. Which capability does this describe?",o:["Load Balancing","High Availability / Redundant Internet Connections","Content Delivery Network","SD-WAN failover"],a:3,d:3,e:"SD-WAN or BGP-based failover automatically routes traffic through a backup ISP connection when the primary fails — providing high availability for internet connectivity."},
  {q:"Which of the following backup methods has the FASTEST restoration time but requires the MOST storage space?",o:["Incremental","Differential","Full backup","Synthetic full"],a:2,d:3,e:"Full backup copies ALL data each time — requires the most storage but restoration requires only ONE backup file making it the fastest to restore."},
  {q:"An organization deploys sensors throughout their network that do not directly inspect traffic but instead analyze traffic flow metadata to detect anomalies. Which technology?",o:["IPS","WAF","NetFlow analysis / Flow-based detection","Full Packet Capture"],a:2,d:3,e:"Flow-based (NetFlow) analysis examines traffic metadata without inspecting packet contents — detecting anomalies in connection patterns, volume, timing without the storage overhead of full packet capture."},
  {q:"A company implements a policy that all changes to network firewall rules must be requested, approved, tested, and deployed through a formal process. Which control?",o:["Vulnerability Management","Change Management","Configuration Management","Patch Management"],a:1,d:3,e:"Change Management is the formal process controlling modifications to IT systems — requiring documented requests, risk assessment, approval, testing, and rollback planning before implementation."},
  {q:"An organization uses containers for all application deployments. A developer discovers a vulnerability allowing escape from the container to the host OS. Which threat?",o:["VM Escape","Container Breakout","Hypervisor Attack","Privilege Escalation within the container"],a:1,d:3,e:"Container Breakout allows escape from the container isolation to the underlying host OS — more dangerous than VM escape in some ways because containers share the host kernel."},
  {q:"A security architect recommends placing a WAF in front of the web application, a network firewall at the perimeter, host-based IDS on each server, and endpoint protection on workstations. Which security principle?",o:["Zero Trust","Least Privilege","Defense in Depth","Network Segmentation"],a:2,d:3,e:"Defense in Depth layers multiple independent security controls — WAF at application layer, network firewall at perimeter, HIDS on servers, endpoint protection on workstations. Each layer provides protection if others fail."},
  {q:"A company maintains an exact real-time replica of their production database at a separate facility with automatic failover in case of primary site failure. Which DR capability?",o:["Cold Standby","Warm Standby","Hot Standby / Active-Passive Replication","Load Balancing"],a:2,d:3,e:"Real-time database replication with automatic failover is Hot Standby — the secondary is fully synchronized and can take over immediately with minimal data loss and downtime."},
  {q:"Which of the following BEST describes why cloud providers offer regions and availability zones?",o:["To provide different pricing tiers for services","To enable geographic redundancy and fault tolerance against localized failures","To satisfy different regulatory data residency requirements only","To improve network performance for nearby users only"],a:1,d:3,e:"Regions and availability zones provide geographic distribution and fault isolation — applications deployed across multiple AZs or regions can survive failures of individual data centers or even entire geographic regions."},
  {q:"A network engineer wants to prevent devices from one VLAN from communicating with devices in another VLAN without going through a firewall. What must be configured?",o:["Access Control Lists on switches only","Inter-VLAN routing through a firewall or Layer 3 device with security policy","Spanning Tree Protocol","802.1X port authentication"],a:1,d:3,e:"By default VLANs are Layer 2 isolated — to communicate, inter-VLAN routing is required. Routing all inter-VLAN traffic through a firewall allows security inspection and policy enforcement."},
  {q:"A company stores encryption keys in the same system as the encrypted data. Why is this a security concern?",o:["It increases storage costs","Compromising the system gives an attacker both the encrypted data AND the keys to decrypt it","Keys and data must always be stored separately by regulation","It violates PCI DSS automatically"],a:1,d:3,e:"Co-locating keys and encrypted data eliminates the security benefit of encryption — an attacker who compromises the system gets both ciphertext and the key to decrypt it. Keys must be stored separately."},
  {q:"Which of the following is the PRIMARY security advantage of using Platform as a Service (PaaS) over Infrastructure as a Service (IaaS)?",o:["PaaS is less expensive than IaaS","The cloud provider manages OS patching and runtime security reducing the customer attack surface","PaaS provides better performance than IaaS","PaaS allows more customization of the environment"],a:1,d:3,e:"In PaaS, the provider manages the OS and runtime environment — the customer does not need to manage OS patching, reducing the attack surface the customer must secure compared to IaaS."},
  {q:"An organization discovers their backup restoration process takes 72 hours but their RPO requirement is 4 hours. What must they address?",o:["Their RTO — 72 hours exceeds their recovery time objective","Their RPO — they need backups taken every 4 hours not restoration capability","Both RTO and RPO are violated","Only the backup frequency needs adjustment"],a:0,d:3,e:"The 72-hour restoration time violates their RTO (how long they can be down) — regardless of backup frequency, they cannot meet their recovery time requirement. Faster restoration methods (hot standby, automated recovery) are needed."},
  {q:"A company wants to implement a network architecture where traffic between all internal systems is treated as untrusted and requires authentication and authorization. Which architecture?",o:["Traditional perimeter-based network","DMZ with internal segmentation","Zero Trust Network Architecture","Air-gapped network"],a:2,d:3,e:"Zero Trust Network Architecture eliminates the concept of a trusted internal network — every connection, even between internal systems, requires authentication, authorization, and continuous verification."},
  // D4 — 24 more to reach 93
  {q:"A SOC team receives 500 phishing reports per day. Which SOAR capability would MOST efficiently handle the initial triage?",o:["Manual analyst review of each report","Automated playbook that extracts IOCs, checks threat intelligence, and closes confirmed false positives","SIEM correlation rule","Vulnerability scanner"],a:1,d:4,e:"SOAR playbooks automate repetitive tasks — extracting IOCs from phishing reports, checking them against threat intelligence feeds, quarantining emails, and closing false positives without analyst involvement."},
  {q:"An analyst discovers an attacker has been exfiltrating data using HTTPS to a legitimate cloud storage service. Which detection challenge does this present?",o:["The data is unencrypted and easy to detect","Legitimate cloud services are typically whitelisted making anomaly detection necessary","The firewall automatically blocks all cloud storage","HTTPS traffic cannot be exfiltrated"],a:1,d:4,e:"Exfiltration via legitimate cloud services (Dropbox, OneDrive, Google Drive) is difficult to detect because these services are typically whitelisted. Behavioral analytics detecting unusual upload volumes are required."},
  {q:"Which of the following correctly describes the purpose of a Purple Team exercise?",o:["Red Team attacks Blue Team defends with no communication","Red and Blue teams collaborate sharing attack techniques and defensive improvements in real time","Purple Team only tests physical security","Purple Team assesses regulatory compliance"],a:1,d:4,e:"Purple Team exercises have Red (attackers) and Blue (defenders) teams working together — Red shares techniques, Blue improves detections, creating a feedback loop that dramatically improves security posture."},
  {q:"A forensic examiner needs to analyze a smartphone seized as evidence. What is the FIRST step?",o:["Extract all data immediately","Place the device in a Faraday bag to prevent remote wipe and document the chain of custody","Power off the device to preserve battery","Connect the device to the forensic workstation"],a:1,d:4,e:"Mobile forensics first priority: Faraday bag blocks network signals preventing remote wipe commands. Document chain of custody. Then decide whether to image live (powered on) or after isolation."},
  {q:"During IR a team discovers the attacker used a compromised domain admin account. Which action is MOST critical during containment?",o:["Reimage all workstations","Disable the compromised admin account and reset all domain admin passwords","Isolate only the initially compromised workstation","Notify all employees via email"],a:1,d:4,e:"Domain admin account compromise gives attacker full control of the entire Active Directory environment. Disabling the compromised account and resetting all privileged account passwords is the critical containment step."},
  {q:"An organization wants to measure their security team effectiveness. They track the average time from alert generation to threat containment. Which metric?",o:["MTBF","Mean Time to Respond (MTTR)","MTTD","RTO"],a:1,d:4,e:"Mean Time to Respond (MTTR) — in IR context this measures average time from alert to containment. Lower MTTR indicates more efficient detection and response processes."},
  {q:"A pen tester is performing a black box assessment and wants to gather information without directly probing the target. Which technique?",o:["Nmap port scanning","Metasploit exploitation","OSINT — LinkedIn, job postings, DNS records, WHOIS","Password spraying"],a:2,d:4,e:"OSINT is passive reconnaissance — gathering intelligence from public sources (LinkedIn, job postings revealing tech stack, DNS records, WHOIS, GitHub) without directly touching target systems."},
  {q:"An analyst wants to understand the sequence of events during an intrusion by correlating timestamps from multiple log sources. Which challenge must be addressed first?",o:["Encryption of log files","Log volume exceeding SIEM capacity","Time synchronization — ensuring all systems use the same NTP source","Log format standardization"],a:2,d:4,e:"Time synchronization is critical for forensic timeline reconstruction — logs from systems with unsynchronized clocks cannot be reliably correlated, as timestamps may be minutes or hours off from each other."},
  {q:"Which of the following BEST describes the purpose of sandboxing a suspicious file before deployment?",o:["Compresses the file for efficient storage","Executes the file in an isolated environment to observe behavior without risking production systems","Encrypts the file to prevent unauthorized access","Scans the file with multiple antivirus engines"],a:1,d:4,e:"Sandboxing executes suspicious code in an isolated environment — observing its behavior (file system changes, network connections, registry modifications) safely without risk to production systems."},
  {q:"A security team discovers malware that modifies the bootloader to load before the OS, persisting even after OS reinstallation. Which type of malware?",o:["Rootkit","Bootkit","Logic Bomb","Fileless Malware"],a:1,d:4,e:"A Bootkit infects the Master Boot Record or EFI boot process — it executes before the OS loads and persists across OS reinstallation. Removal requires specialized boot-level remediation tools."},
  {q:"An organization performs monthly vulnerability scans and patches critical findings within 30 days. Which metric tracks whether patching keeps pace with newly discovered vulnerabilities?",o:["Mean Time to Detect","Patch Compliance Rate","Mean Time Between Failures","Vulnerability Remediation Rate / Mean Time to Patch"],a:3,d:4,e:"Vulnerability Remediation Rate or Mean Time to Patch tracks how quickly discovered vulnerabilities are remediated — ensuring patching velocity exceeds the rate at which new vulnerabilities are introduced."},
  {q:"During incident response an analyst finds the attacker added a scheduled task that runs a PowerShell script encoded in Base64 every hour. Which IR action addresses this?",o:["Containment — isolate the system","Eradication — delete the scheduled task and investigate the PowerShell command","Recovery — restore from backup","Detection — add SIEM rule for scheduled task creation"],a:1,d:4,e:"Deleting the scheduled task and decoding/investigating the PowerShell command is Eradication — removing the attacker persistence mechanism and understanding what it was doing."},
  {q:"A company implements a control where critical database backups can only be restored with simultaneous approval from both the CISO and the Database Administrator. Which principle?",o:["Separation of Duties","Least Privilege","Dual Control","Defense in Depth"],a:2,d:4,e:"Dual Control requires TWO authorized individuals physically present and approving simultaneously — neither the CISO nor DBA can restore the backup alone, preventing single-person fraud."},
  {q:"An analyst runs a Nessus scan and finds 847 vulnerabilities. How should remediation be prioritized?",o:["Fix all vulnerabilities in alphabetical order","Prioritize by CVSS score combined with asset criticality and exploitability","Fix the newest vulnerabilities first","Fix only the vulnerabilities on internet-facing systems"],a:1,d:4,e:"Risk-based prioritization combines technical severity (CVSS), asset criticality (impact if compromised), and exploitability (is there active exploitation in the wild) — addressing the highest actual risk first."},
  {q:"A new SOC analyst accidentally deletes a critical SIEM correlation rule. Which control would BEST prevent this?",o:["Better training for new analysts","Role-based access control limiting rule modification to senior analysts","Daily backup of SIEM configuration","MFA for SIEM access"],a:1,d:4,e:"RBAC controls who can modify or delete critical security configurations — new analysts should have read-only access to detection rules, with modification rights reserved for senior analysts."},
  {q:"An organization wants to test whether employees fall for phishing attacks by sending simulated phishing emails. Which activity is this?",o:["Penetration Testing","Social Engineering Assessment / Phishing Simulation","Red Team Exercise","Tabletop Exercise"],a:1,d:4,e:"Phishing simulations test employee security awareness by sending controlled fake phishing emails — measuring click rates, credential submission, and reporting rates to identify training needs."},
  {q:"A threat actor uses the same command and control infrastructure for multiple attacks. An analyst identifies the infrastructure fingerprint. Which intelligence type is this?",o:["Tactical Intelligence","Operational Intelligence","Strategic Intelligence","Technical Intelligence / IOCs"],a:3,d:4,e:"Technical intelligence consists of specific technical indicators (IOCs) like C2 IP addresses, domain patterns, malware hashes — actionable for immediate detection rule creation and blocking."},
  {q:"During a penetration test, the tester finds a web server exposing directory listings showing a file called database_backup_2024.sql. Which vulnerability type?",o:["SQL Injection","Information Disclosure","Command Injection","Privilege Escalation"],a:1,d:4,e:"Directory listing exposure is an information disclosure vulnerability — exposing internal file structures, backup files, and configuration files that provide attackers with valuable reconnaissance information."},
  {q:"An organization implements a SIEM rule that correlates: failed VPN login + success from different country + large download within 30 minutes. Which attack pattern does this detect?",o:["Brute Force followed by exfiltration","Credential stuffing with data theft","Account takeover followed by data exfiltration","Insider threat behavior"],a:2,d:4,e:"This correlation detects account takeover and data exfiltration — failed logins suggest credential attempts, success from unusual location suggests compromised credentials, large download indicates data theft."},
  {q:"Which of the following BEST describes the role of threat intelligence in incident response?",o:["Replaces the need for SIEM","Provides context about attacker TTPs to improve detection speed and response quality","Only useful during the Preparation phase","Automates all incident response actions"],a:1,d:4,e:"Threat intelligence provides context — knowing attacker TTPs, IOCs, and malware families helps analysts interpret alerts faster, understand scope, predict next attacker steps, and prioritize containment."},
  {q:"A security team wants to ensure that if an attacker compromises one endpoint they cannot easily pivot to other systems. Which control BEST limits lateral movement?",o:["Full disk encryption on endpoints","Host-based firewall with default-deny rules between endpoints","Strong password policy","Antivirus software"],a:1,d:4,e:"Host-based firewalls with default-deny between endpoints prevent direct peer-to-peer communication — an attacker on one workstation cannot directly connect to other workstations, forcing traffic through monitored chokepoints."},
  {q:"An analyst receives a malware sample and wants to understand its behavior without executing it. Which analysis technique?",o:["Dynamic Analysis","Static Analysis","Sandboxing","Memory Forensics"],a:1,d:4,e:"Static analysis examines malware without executing it — disassembling code, examining strings, reviewing file headers and imports — revealing functionality and IOCs without risk of detonation."},
  {q:"A company wants to implement a Zero Trust approach to privileged access. Which combination of controls BEST achieves this?",o:["Strong passwords and VPN","PAM with JIT access, MFA, session recording, and continuous verification","Antivirus and firewall","SIEM and IDS"],a:1,d:4,e:"Zero Trust privileged access requires: PAM for controlled access, JIT for temporary time-limited elevation, MFA for strong authentication, session recording for accountability, continuous verification throughout the session."},
  {q:"During an IR engagement the team identifies that the attacker achieved persistence via a malicious DLL loaded by a legitimate Windows service. Which eradication step is required?",o:["Disable the Windows service","Remove the malicious DLL, restore the legitimate DLL, and verify service integrity","Reinstall Windows","Change all user passwords"],a:1,d:4,e:"DLL hijacking eradication requires removing the malicious DLL, restoring/verifying the legitimate DLL, confirming service integrity, and checking for other hijacked services — not just disabling the affected service."},
  // D5 — 4 more to reach 67
  {q:"An organization wants to reduce the risk from third-party vendors accessing their systems. Which control specifically addresses this?",o:["Requiring vendors to use the same antivirus","Implementing vendor risk assessments, contractual security requirements, and privileged access management for vendor accounts","Providing vendors with admin credentials for convenience","Allowing vendors unrestricted network access during business hours"],a:1,d:5,e:"Third-party risk management requires comprehensive controls: vetting vendors before engagement, contractual security obligations, and technical controls (PAM, least privilege, time-limited access) for vendor system access."},
  {q:"A company is preparing for ISO 27001 certification. They must demonstrate an Information Security Management System (ISMS). Which document is foundational?",o:["A list of all vulnerabilities","Information Security Policy approved by top management","Results of the latest penetration test","Employee acceptable use agreements"],a:1,d:5,e:"ISO 27001 requires an Information Security Policy as the foundational document — demonstrating management commitment and establishing the framework for all other security controls and processes."},
  {q:"An organization collects customer email addresses for order confirmations but then uses them for marketing campaigns without customer consent. Which GDPR principle is violated?",o:["Data Minimization","Storage Limitation","Purpose Limitation","Data Integrity"],a:2,d:5,e:"Purpose Limitation requires that personal data is only used for the specific purpose for which it was collected — using order confirmation email addresses for marketing without consent violates this principle."},
  {q:"A CISO wants to demonstrate security program value to the board. Which metrics are MOST relevant?",o:["Number of firewall rules configured","Mean Time to Detect, Mean Time to Respond, patch compliance rate, and risk reduction over time","Total number of security tools deployed","Number of security training courses completed"],a:1,d:5,e:"Business-relevant security metrics demonstrate program effectiveness: MTTD/MTTR show detection and response capability, patch compliance shows vulnerability management, risk reduction demonstrates ROI on security investment."},
];

}

      </div>

              return `<button class="match-btn ${isM?'matched':isSel?'selected':isW?'wrong':''}" onclick="matchSelT('${t.replace(/'/g,"\\'")}')">
                ${isM?'✓ ':''}${t}
              </button>`;
            }).join('')}
          </div>
          <div style="display:flex;flex-direction:column;gap:6px">
            <div style="font-size:10px;color:#475569;letter-spacing:1px;text-transform:uppercase;margin-bottom:2px">Definitions</div>
            ${s.shuffled.map(m=>{
              const isM=s.matched.some(t=>pairs.find(p=>p.t===t)?.m===m), isSel=s.selM===m, isW=s.wrong&&isSel;
              return `<button class="match-btn ${isM?'matched':isSel?'selected':isW?'wrong':''}" style="font-size:11px" onclick="matchSelM('${m.replace(/'/g,"\\'")}')">
                ${isM?'✓ ':''}${m}
              </button>`;
            }).join('')}

        </div>
      `}

}

function renderMatchDone(){
  const s=state.match;
  return `
    <div class="card" style="text-align:center;padding:40px">
      <div style="font-size:48px;margin-bottom:12px">🎉</div>
      <div style="font-family:'Syne',sans-serif;font-size:22px;color:#f1f5f9;margin-bottom:8px">Set ${s.page+1} Complete!</div>
      <div style="font-size:14px;color:#64748b;margin-bottom:24px">Done in ${s.moves} moves</div>
      <div style="display:flex;gap:10px">
        <button class="btn-primary" style="flex:1" onclick="resetMatch()">Play Again</button>
        ${s.page+1<Math.ceil(MATCH.length/MATCH_PAGE)?`<button class="btn-primary" style="flex:1;background:linear-gradient(135deg,#a855f7,#7c3aed)" onclick="setMatchPage(${s.page+1})">Next Set →</button>`:''}
      </div>
    </div>`;
}

function setMatchPage(i){
  const pairs=MATCH.slice(i*MATCH_PAGE,(i+1)*MATCH_PAGE);
  Object.assign(state.match,{page:i,selT:null,selM:null,matched:[],wrong:false,moves:0,done:false,shuffled:shuffle(pairs.map(p=>p.m))});
  renderMatch();
}
function resetMatch(){ setMatchPage(state.match.page); }

function matchSelT(t){
  const s=state.match;
  if(s.matched.includes(t)) return;
  s.selT = s.selT===t ? null : t;
  checkMatchPair();
}
function matchSelM(m){
  const s=state.match;
  if(s.matched.some(t=>getMatchPage().find(p=>p.t===t)?.m===m)) return;
  s.selM = s.selM===m ? null : m;
  checkMatchPair();
}
function checkMatchPair(){
  const s=state.match;
  if(!s.selT||!s.selM) { renderMatch(); return; }
  s.moves++;
  const pair=getMatchPage().find(p=>p.t===s.selT&&p.m===s.selM);
  if(pair){
    s.matched.push(s.selT);
    s.selT=null; s.selM=null;
    if(s.matched.length===getMatchPage().length) s.done=true;
  } else {
    s.wrong=true;
    renderMatch();
    setTimeout(()=>{ s.wrong=false; s.selT=null; s.selM=null; renderMatch(); },700);
    return;
  }
  renderMatch();
}

    const aOk=r.a===c.a;
    return {ok:sOk&&dOk&&pOk&&aOk};
  });
  state.fw.checked=true; renderPBQ();
}

function netSelect(d){ state.net.dragging = state.net.dragging===d?null:d; renderPBQ(); }
function netDrop(zid){
  if(!state.net.dragging||zid==='internet') return;
  const d=state.net.dragging;
  const placed=state.net.placed;
  Object.keys(placed).forEach(k=>{ if(placed[k]===d) delete placed[k]; });
  placed[`${zid}-${d}`]=d;
  state.net.dragging=null;
  renderPBQ();
}
function netRemove(zid,d){
  if(state.net.checked) return;
  delete state.net.placed[`${zid}-${d}`];
  renderPBQ();
}

function renderPorts(){
  const s=state.ports;
  const PAGE=8;
  const pagePairs=PORTS_ALL.slice(s.page*PAGE,(s.page+1)*PAGE);
  const totalPages=Math.ceil(PORTS_ALL.length/PAGE);
  const isProtoMatched=p=>s.matched.some(m=>m.p===p);
  const isPortMatched=port=>s.matched.some(m=>m.port===port);

  if(s.done) return `
    <div class="card" style="text-align:center;padding:32px">
      <div style="font-size:48px;margin-bottom:12px">🎉</div>
      <div style="font-family:'Syne',sans-serif;font-size:20px;color:#f1f5f9;margin-bottom:8px">Set ${s.page+1} Complete!</div>
      <div style="font-size:14px;color:#64748b;margin-bottom:24px">${s.moves} moves</div>
      <div style="display:flex;gap:10px">
        <button class="btn-primary" style="flex:1" onclick="resetPorts()">Again</button>
        ${s.page+1<totalPages?`<button class="btn-primary" style="flex:1;background:linear-gradient(135deg,#06d6a0,#059669);color:#000" onclick="setPortsPage(${s.page+1})">Next Set →</button>`:''}
      </div>
    </div>`;

  return `
    <div class="chips" style="margin-bottom:14px">
      ${Array.from({length:totalPages},(_,i)=>`<button class="chip ${s.page===i?'active':''}" style="${s.page===i?'color:#06d6a0;border-color:#06d6a0;background:#06d6a018':''};" onclick="setPortsPage(${i})">Set ${i+1}</button>`).join('')}
    </div>
    <p style="font-size:12px;color:#475569;margin-bottom:14px">Tap a protocol then its matching port · ${s.matched.length}/${pagePairs.length} matched · ${s.moves} moves</p>
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px">
      <div style="display:flex;flex-direction:column;gap:6px">
        <div style="font-size:10px;color:#475569;letter-spacing:1px;text-transform:uppercase;margin-bottom:2px">Protocols</div>
        ${pagePairs.map(({p})=>{
          const isM=isProtoMatched(p), isSel=s.selP===p, isW=s.wrong&&isSel;
          return `<button class="match-btn ${isM?'matched':isW?'wrong':isSel?'selected':''}" onclick="portSelP('${p}')">${isM?'✓ ':''}${p}</button>`;
        }).join('')}
      </div>
      <div style="display:flex;flex-direction:column;gap:6px">
        <div style="font-size:10px;color:#475569;letter-spacing:1px;text-transform:uppercase;margin-bottom:2px">Ports</div>
        ${s.shuffled.map(port=>{
          const isM=isPortMatched(port), isSel=s.selPort===port, isW=s.wrong&&isSel;
          return `<button class="match-btn ${isM?'matched':isW?'wrong':isSel?'selected':''}" style="font-family:'Courier New',monospace;font-size:16px;font-weight:700" onclick="portSelPort('${port}')">${isM?'✓ ':''}${port}</button>`;
        }).join('')}
      </div>
    </div>
  `;
}

function setPortsPage(i){
  const PAGE=8; const pp=PORTS_ALL.slice(i*PAGE,(i+1)*PAGE);
  Object.assign(state.ports,{page:i,selP:null,selPort:null,matched:[],wrong:false,moves:0,done:false,shuffled:shuffle(pp.map(p=>p.port))});
  renderPBQ();
}
function resetPorts(){ setPortsPage(state.ports.page); }
function portSelP(p){
  if(state.ports.matched.some(m=>m.p===p)) return;
  state.ports.selP = state.ports.selP===p?null:p;
  checkPortPair();
}
function portSelPort(port){
  if(state.ports.matched.some(m=>m.port===port)) return;
  state.ports.selPort = state.ports.selPort===port?null:port;
  checkPortPair();
}
function checkPortPair(){
  const s=state.ports;
  if(!s.selP||!s.selPort){ renderPBQ(); return; }
  s.moves++;
  const PAGE=8; const pagePairs=PORTS_ALL.slice(s.page*PAGE,(s.page+1)*PAGE);
  const pair=pagePairs.find(p=>p.p===s.selP&&p.port===s.selPort);
  if(pair){
    s.matched.push(pair);
    s.selP=null; s.selPort=null;
    if(s.matched.length===pagePairs.length) s.done=true;
  } else {
    s.wrong=true;
    renderPBQ();
    setTimeout(()=>{ s.wrong=false; s.selP=null; s.selPort=null; renderPBQ(); },700);
    return;
  }
  renderPBQ();
}

    ${s.actionOrder.map((action,i)=>{
      const isC=s.actChecked&&i===TRIAGE_ACTIONS.indexOf(action);
      const isW=s.actChecked&&i!==TRIAGE_ACTIONS.indexOf(action);
      return `<div class="order-item ${isC?'correct':isW?'wrong':''}" style="margin-bottom:8px">
        <span class="order-num" style="background:${isC?'rgba(34,197,94,.2)':isW?'rgba(239,68,68,.2)':'#1e293b'};color:${isC?'#22c55e':isW?'#ef4444':'#64748b'}">${i+1}</span>
        <span style="font-size:12px;color:${isC?'#86efac':isW?'#fca5a5':'#94a3b8'};flex:1;line-height:1.4">${action}</span>
        ${s.actChecked?`<span style="font-size:14px">${isC?'✓':'✗'}</span>`:`
          <div style="display:flex;flex-direction:column;gap:2px">
            <button onclick="triageUp(${i})" ${i===0?'disabled':''} style="background:transparent;border:none;color:${i===0?'#1e293b':'#475569'};cursor:${i===0?'default':'pointer'};font-size:14px;padding:1px 6px">▲</button>
            <button onclick="triageDn(${i})" ${i===s.actionOrder.length-1?'disabled':''} style="background:transparent;border:none;color:${i===s.actionOrder.length-1?'#1e293b':'#475569'};cursor:${i===s.actionOrder.length-1?'default':'pointer'};font-size:14px;padding:1px 6px">▼</button>
          </div>`}
      </div>`;
    }).join('')}
    ${!s.actChecked?`<button class="btn-primary" style="margin-bottom:10px" onclick="checkTriageActions()">Check Actions</button>`:''}
    <button class="btn-secondary" onclick="resetTriage()">Reset All</button>
  `;
}

function triagePick(id){
  if(state.triage.checked) return;
  const p=state.triage.priority;
  if(p.includes(id)) state.triage.priority=p.filter(x=>x!==id);
  else if(p.length<TRIAGE_ALERTS.length) p.push(id);
  renderPBQ();
}
function checkTriage(){ state.triage.checked=true; renderPBQ(); }
function triageUp(i){ if(i===0)return; const a=state.triage.actionOrder; [a[i-1],a[i]]=[a[i],a[i-1]]; renderPBQ(); }
function triageDn(i){ const a=state.triage.actionOrder; if(i>=a.length-1)return; [a[i],a[i+1]]=[a[i+1],a[i]]; renderPBQ(); }
function checkTriageActions(){ state.triage.actChecked=true; renderPBQ(); }
function resetTriage(){ state.triage={priority:[],checked:false,actionOrder:shuffle(TRIAGE_ACTIONS),actChecked:false}; renderPBQ(); }

// ─── GAME STATE ───────────────────────────────────────────────────────────────
let gameState = {
  active:false, score:0, lives:3, streak:0, bestStreak:0,
  timer:60, timerInterval:null, cur:null, sel:null,
  domainFilter:0, qs:[], qIdx:0, revealed:false,
  highScore: parseInt(localStorage.getItem('blitz_hs')||'0'),
};

function blitzGetQs(d){
  const pool = d===0 ? [...QZ] : QZ.filter(q=>q.d===d);
  return shuffle(pool);
}

function blitzStart(d){
  clearInterval(gameState.timerInterval);
  gameState = {
    active:true, score:0, lives:3, streak:0, bestStreak:0,
    timer:60, timerInterval:null, cur:null, sel:null,
    domainFilter:d, qs:blitzGetQs(d), qIdx:0, revealed:false,
    highScore:parseInt(localStorage.getItem('blitz_hs')||'0'),
  };
  gameState.cur = gameState.qs[0];
  gameState.timerInterval = setInterval(()=>{
    gameState.timer--;
    if(gameState.timer<=0){ blitzEnd(); return; }
    // update timer display only
    const tb = document.getElementById('blitz-timer-val');
    const tp = document.getElementById('blitz-timer-prog');
    if(tb) tb.textContent = gameState.timer;
    if(tp) tp.style.setProperty('--prog', (gameState.timer/60*100)+'%');
    if(gameState.timer<=10){
      const td = document.getElementById('blitz-timer-div');
      if(td) td.style.animation='timerPulse .5s infinite';
    }
  },1000);
  renderGame();
}

function blitzPick(i){
  const g = gameState;
  if(!g.active || g.sel!==null) return;
  g.sel = i;
  g.revealed = true;
  const correct = i === g.cur.a;
  if(correct){
    g.streak++;
    g.bestStreak = Math.max(g.bestStreak, g.streak);
    const bonus = g.streak >= 5 ? 3 : g.streak >= 3 ? 2 : 1;
    const pts = 100 * bonus;
    g.score += pts;
    // float score
    showFloat('+'+pts+(bonus>1?' x'+bonus+'!':''));
  } else {
    g.lives--;
    g.streak = 0;
    if(g.lives<=0){ setTimeout(()=>blitzEnd(),900); }
  }
  renderGame();
  if(correct && g.lives > 0){
    setTimeout(()=>blitzNext(), 800);
  }
}

function blitzNext(){
  const g = gameState;
  g.qIdx++;
  if(g.qIdx >= g.qs.length) g.qs = [...g.qs, ...blitzGetQs(g.domainFilter)];
  g.cur = g.qs[g.qIdx];
  g.sel = null;
  g.revealed = false;
  renderGame();
}

function blitzEnd(){
  const g = gameState;
  clearInterval(g.timerInterval);
  g.active = false;
  if(g.score > g.highScore){
    g.highScore = g.score;
    localStorage.setItem('blitz_hs', g.score);
  }
  renderGame();
}

function showFloat(txt){
  const el = document.createElement('div');
  el.className = 'float-score';
  el.textContent = txt;
  el.style.cssText = `top:${40+Math.random()*20}%;left:${30+Math.random()*40}%;`;
  document.body.appendChild(el);
  setTimeout(()=>el.remove(), 900);
}

// ─── RENDER GAME ──────────────────────────────────────────────────────────────
function renderGame(){
  const g = gameState;

  if(!g.active && g.score===0 && g.lives===3){
    // Start screen
    render(`
      <div style="padding:24px 20px 100px">
        <div class="hero">
          <div class="hero-bg"></div><div class="hero-orb1"></div><div class="hero-orb2"></div>
          <div class="fu" style="text-align:center">
            <div style="font-size:56px;margin-bottom:12px;filter:drop-shadow(0 0 20px rgba(255,225,68,.5))">🎮</div>
            <h1 style="font-family:'Syne',sans-serif;font-size:28px;font-weight:800;color:#ffe144;margin-bottom:6px;text-shadow:0 0 20px rgba(255,225,68,.4)">Cyber Blitz</h1>
            <p style="font-size:13px;color:var(--text2);margin-bottom:6px">60 seconds · 3 lives · streak multipliers</p>
            <p style="font-size:12px;color:var(--text3)">Answer fast, build streaks, beat your high score</p>
          </div>
        </div>
        <div style="padding:0 4px">
          <div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;margin-bottom:24px">
            <div class="card" style="text-align:center;padding:14px 8px">
              <div style="font-size:22px;margin-bottom:4px">💥</div>
              <div style="font-size:11px;color:var(--text3);margin-bottom:2px">x1 Streak</div>
              <div style="font-size:13px;color:var(--cyan);font-weight:700">100pts</div>
            </div>
            <div class="card" style="text-align:center;padding:14px 8px">
              <div style="font-size:22px;margin-bottom:4px">🔥</div>
              <div style="font-size:11px;color:var(--text3);margin-bottom:2px">3+ Streak</div>
              <div style="font-size:13px;color:var(--yellow);font-weight:700">200pts</div>
            </div>
            <div class="card" style="text-align:center;padding:14px 8px">
              <div style="font-size:22px;margin-bottom:4px">⚡</div>
              <div style="font-size:11px;color:var(--text3);margin-bottom:2px">5+ Streak</div>
              <div style="font-size:13px;color:var(--pink);font-weight:700">300pts</div>
            </div>
          </div>
          <div style="font-size:11px;color:var(--text3);letter-spacing:1.5px;text-transform:uppercase;margin-bottom:12px">Select Domain</div>
          <div class="chips" style="margin-bottom:20px">
            ${[{id:0,name:'All',color:'#00e5ff'},...DOMAINS.map(d=>({id:d.id,name:'D'+d.id,color:d.color}))].map(d=>`
              <button class="chip ${g.domainFilter===d.id?'active':''}" style="${g.domainFilter===d.id?`color:${d.color};border-color:${d.color};background:${d.color}15`:''}" onclick="gameState.domainFilter=${d.id};renderGame()">${d.name}</button>`).join('')}
          </div>
          ${g.highScore>0?`<div class="card" style="text-align:center;padding:12px;margin-bottom:16px;border-color:rgba(255,225,68,.2)"><span style="font-size:12px;color:var(--text3)">🏆 High Score: </span><span style="font-family:'Syne',sans-serif;font-size:18px;font-weight:800;color:var(--yellow)">${g.highScore.toLocaleString()}</span></div>`:''}
          <button class="btn-primary" style="background:linear-gradient(135deg,#ffe144,#ff9500);color:#000;box-shadow:0 4px 20px rgba(255,225,68,.35);font-size:16px" onclick="blitzStart(${g.domainFilter})">
            ⚡ Start Blitz!
          </button>
        </div>
      </div>
    `);
    return;
  }

  if(!g.active){
    // Game over screen
    const isHigh = g.score >= g.highScore && g.score > 0;
    render(`
      <div style="padding:24px 20px 100px">
        <div style="text-align:center;padding:32px 16px 24px">
          <div style="font-size:52px;margin-bottom:8px">${g.lives<=0?'💀':'⏰'}</div>
          <div style="font-family:'Syne',sans-serif;font-size:14px;color:var(--text3);margin-bottom:4px">${g.lives<=0?'No lives left!':'Time up!'}</div>
          ${isHigh?`<div style="font-size:12px;color:var(--yellow);font-weight:700;letter-spacing:1px;text-transform:uppercase;margin-bottom:8px">🏆 New High Score!</div>`:''}
          <div class="blitz-score" style="color:${g.score>1500?'#ffe144':g.score>800?'#00ffa3':'#00e5ff'}">${g.score.toLocaleString()}</div>
          <div style="font-size:13px;color:var(--text3);margin-bottom:24px">points</div>
        </div>
        <div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;margin-bottom:24px">
          <div class="card" style="text-align:center;padding:14px 8px">
            <div style="font-size:20px;margin-bottom:4px">🎯</div>
            <div style="font-size:11px;color:var(--text3);margin-bottom:2px">Answered</div>
            <div style="font-family:'Syne',sans-serif;font-size:18px;font-weight:800;color:var(--cyan)">${g.qIdx}</div>
          </div>
          <div class="card" style="text-align:center;padding:14px 8px">
            <div style="font-size:20px;margin-bottom:4px">🔥</div>
            <div style="font-size:11px;color:var(--text3);margin-bottom:2px">Best Streak</div>
            <div style="font-family:'Syne',sans-serif;font-size:18px;font-weight:800;color:var(--yellow)">${g.bestStreak}x</div>
          </div>
          <div class="card" style="text-align:center;padding:14px 8px">
            <div style="font-size:20px;margin-bottom:4px">🏆</div>
            <div style="font-size:11px;color:var(--text3);margin-bottom:2px">High Score</div>
            <div style="font-family:'Syne',sans-serif;font-size:18px;font-weight:800;color:var(--purple)">${g.highScore.toLocaleString()}</div>
          </div>
        </div>
        <button class="btn-primary" style="background:linear-gradient(135deg,#ffe144,#ff9500);color:#000;box-shadow:0 4px 20px rgba(255,225,68,.35);margin-bottom:10px" onclick="blitzStart(${g.domainFilter})">
          ⚡ Play Again
        </button>
        <button class="btn-secondary" onclick="gameState={active:false,score:0,lives:3,streak:0,bestStreak:0,timer:60,timerInterval:null,cur:null,sel:null,domainFilter:0,qs:[],qIdx:0,revealed:false,highScore:parseInt(localStorage.getItem('blitz_hs')||'0')};renderGame()">
          Back to Menu
        </button>
      </div>
    `);
    return;
  }

  // Active game
  const q = g.cur;
  const timerColor = g.timer<=10?'#ff3d9a':g.timer<=20?'#ffe144':'#00e5ff';
  const prog = (g.timer/60*100)+'%';

  render(`
    <div style="padding:16px 16px 100px">
      <!-- HUD -->
      <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:16px">
        <div class="blitz-lives">${'❤️'.repeat(g.lives)}${'🖤'.repeat(3-g.lives)}</div>
        <div id="blitz-timer-div" class="blitz-timer" style="--prog:${prog};color:${timerColor};border:2px solid ${timerColor}33;box-shadow:0 0 16px ${timerColor}22">
          <span id="blitz-timer-val">${g.timer}</span>
        </div>
        <div style="text-align:right">
          <div style="font-family:'Syne',sans-serif;font-size:20px;font-weight:800;color:var(--yellow)">${g.score.toLocaleString()}</div>
          <div style="font-size:10px;color:var(--text3)">score</div>
        </div>
      </div>
      <!-- Streak -->
      <div class="blitz-streak" style="margin-bottom:14px;min-height:18px">
        ${g.streak>=5?`⚡ ${g.streak} STREAK — 3x POINTS!`:g.streak>=3?`🔥 ${g.streak} streak — 2x points!`:g.streak>=1?`✨ ${g.streak} streak`:''}
      </div>
      <!-- Question -->
      <div class="card" style="margin-bottom:14px;border-color:rgba(255,255,255,.06)">
        <div style="font-size:10px;color:${DOMAINS[q.d-1].color};letter-spacing:1px;text-transform:uppercase;margin-bottom:10px;font-weight:700">Domain ${q.d}</div>
        <div class="blitz-q">${q.q}</div>
      </div>
      <!-- Options -->
      <div style="display:flex;flex-direction:column;gap:8px">
        ${q.o.map((opt,i)=>{
          let cls='';
          if(g.sel!==null){
            if(i===q.a) cls='hit';
            else if(i===g.sel&&i!==q.a) cls='miss';
            else if(g.revealed) cls='reveal';
          }
          return `<button class="blitz-opt ${cls}" onclick="blitzPick(${i})">
            <span style="width:26px;height:26px;border-radius:7px;background:rgba(255,255,255,.05);display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:800;flex-shrink:0;border:1px solid rgba(255,255,255,.08)">${['A','B','C','D'][i]}</span>
            <span style="line-height:1.4">${opt}</span>
            ${g.sel!==null&&i===q.a?'<span style="margin-left:auto;font-size:16px">✓</span>':''}
            ${g.sel!==null&&i===g.sel&&i!==q.a?'<span style="margin-left:auto;font-size:16px">✗</span>':''}
          </button>`;
        }).join('')}
      </div>
    </div>
  `);
}

// ─── RENDER LEARN ─────────────────────────────────────────────────────────────
let learnState = { domain:0, openSub:null };

function renderLearn(){
  const dom = learnState.domain;
  const lesson = dom>0 ? LESSONS[dom-1] : null;

  if(!lesson){
    // Domain picker
    render(`
      <div style="padding:16px 16px 100px">
        <div class="hero">
          <div class="hero-bg"></div><div class="hero-orb1"></div><div class="hero-orb2"></div>
          <div class="fu">
            <div style="font-size:10px;color:var(--cyan);letter-spacing:3px;text-transform:uppercase;margin-bottom:10px">Study Mode</div>
            <h1 style="font-family:'Syne',sans-serif;font-size:28px;font-weight:800;color:var(--text);margin-bottom:6px">Lessons</h1>
            <p style="font-size:13px;color:var(--text3)">Every SY0-701 sub-objective · concept breakdowns · exam tips</p>
          </div>
        </div>
        <div style="padding:0 4px">
          ${LESSONS.map((l,i)=>`
            <button onclick="learnState.domain=${l.domain};learnState.openSub=null;renderLearn()" style="width:100%;background:linear-gradient(145deg,rgba(17,19,32,.95),rgba(13,14,26,.98));border:1px solid var(--border);border-radius:18px;padding:18px 16px;text-align:left;cursor:pointer;margin-bottom:12px;display:flex;align-items:center;gap:14px;transition:all .2s;font-family:inherit">
              <div style="width:44px;height:44px;border-radius:12px;background:${l.color}15;border:1px solid ${l.color}33;display:flex;align-items:center;justify-content:center;font-family:'Syne',sans-serif;font-size:16px;font-weight:800;color:${l.color};flex-shrink:0">D${l.domain}</div>
              <div style="flex:1">
                <div style="font-family:'Syne',sans-serif;font-size:14px;font-weight:700;color:${l.color};margin-bottom:3px">${l.title.split(':')[1].trim()}</div>
                <div style="font-size:11px;color:var(--text3)">${l.subs.length} sub-objectives · ${DOMAINS[l.domain-1].weight}% of exam</div>
              </div>
              <div style="font-size:18px;color:var(--text4)">→</div>
            </button>`).join('')}
          <button onclick="setTab('cards')" style="width:100%;background:linear-gradient(145deg,rgba(0,229,255,.04),rgba(0,0,0,0));border:1px solid rgba(0,229,255,.2);border-radius:18px;padding:16px;text-align:center;cursor:pointer;font-family:inherit;color:var(--cyan);font-weight:700;font-size:14px;margin-top:4px">
            🃏 Quick Flashcards →
          </button>
        </div>
      </div>
    `);
    return;
  }

  // Lesson detail
  render(`
    <div style="padding:16px 16px 100px">
      <button class="btn-back" onclick="learnState.domain=0;renderLearn()">← All Domains</button>
      <div style="display:flex;align-items:center;gap:12px;margin-bottom:20px">
        <div style="width:40px;height:40px;border-radius:12px;background:${lesson.color}15;border:1px solid ${lesson.color}33;display:flex;align-items:center;justify-content:center;font-family:'Syne',sans-serif;font-size:15px;font-weight:800;color:${lesson.color}">D${lesson.domain}</div>
        <div>
          <h2 style="font-family:'Syne',sans-serif;font-size:18px;font-weight:800;color:var(--text)">${lesson.title.split(':')[1].trim()}</h2>
          <div style="font-size:11px;color:var(--text3)">${lesson.subs.length} objectives · ${DOMAINS[lesson.domain-1].weight}% of exam</div>
        </div>
      </div>
      ${lesson.subs.map((sub,si)=>{
        const isOpen = learnState.openSub===si;
        return `
          <div class="lesson-card">
            <div class="lesson-header" onclick="learnState.openSub=learnState.openSub===${si}?null:${si};renderLearn()">
              <div style="width:36px;height:36px;border-radius:10px;background:${lesson.color}12;border:1px solid ${lesson.color}25;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:800;color:${lesson.color};flex-shrink:0">${sub.id}</div>
              <div style="flex:1">
                <div style="font-weight:700;font-size:14px;color:var(--text)">${sub.title}</div>
                <div style="font-size:11px;color:var(--text3);margin-top:1px">${sub.concepts.length} concepts</div>
              </div>
              <div style="font-size:18px;color:var(--text3);transition:transform .2s;transform:${isOpen?'rotate(90deg)':'rotate(0deg)'}">›</div>
            </div>
            ${isOpen?`
            <div class="lesson-body open">
              ${sub.concepts.map(c=>`
                <div class="lesson-concept">
                  <div style="font-size:12px;font-weight:800;color:${lesson.color};margin-bottom:5px;letter-spacing:.3px">${c.h}</div>
                  <div style="font-size:13px;color:var(--text2);line-height:1.65">${c.b}</div>
                </div>`).join('')}
              <div class="lesson-tip">
                <div style="font-size:10px;font-weight:800;color:var(--yellow);letter-spacing:1.5px;text-transform:uppercase;margin-bottom:5px">⚡ Exam Tip</div>
                ${sub.tip}
              </div>
              <button class="btn-primary" style="margin-top:14px;font-size:13px;padding:12px" onclick="state.quiz.domain=${lesson.domain};resetQuiz();setTab('quiz')">
                Practice D${lesson.domain} Questions →
              </button>
            </div>`:''}
          </div>`;
      }).join('')}
    </div>
  `);
}


// ─── RENDER TAB ───────────────────────────────────────────────────────────────
function renderTab(id){
  window.scrollTo(0,0);
  if(id==='home') renderHome();
  else if(id==='learn') renderLearn();
  else if(id==='quiz') renderQuiz();
  else if(id==='game') renderGame();
  else if(id==='pbq') renderPBQ();
}

// ─── NAV ─────────────────────────────────────────────────────────────────────
document.querySelectorAll('#nav .tab').forEach(btn=>{
  btn.addEventListener('click',()=>setTab(btn.dataset.tab));
});

// ─── INIT ─────────────────────────────────────────────────────────────────────
renderHome();
</script>
</body>
</html>
