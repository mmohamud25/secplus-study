  {q:"An attacker steals a service account Kerberos ticket from memory and cracks it offline using a wordlist. Which attack?",o:["Pass-the-Hash","Golden Ticket","Kerberoasting","Silver Ticket"],a:2,d:2,e:"Kerberoasting requests service tickets for service accounts (which are encrypted with the service account password hash) and cracks them offline — targets weak service account passwords."},
  {q:"A company web application concatenates user input directly into an OS command: system('ping ' + user_input). An attacker enters 127.0.0.1; rm -rf /. Which vulnerability?",o:["SQL Injection","Command Injection","Path Traversal","LDAP Injection"],a:1,d:2,e:"Command Injection occurs when user input is passed unsanitized to a system command — the semicolon allows chaining additional OS commands with potentially destructive results."},
  {q:"Which of the following BEST describes the difference between a worm and a virus?",o:["Worms encrypt files; viruses do not","Worms self-replicate without user action; viruses require user interaction to spread","Viruses are more destructive than worms","Worms are only found on Windows systems"],a:1,d:2,e:"The key distinction: Worms self-replicate and spread autonomously across networks. Viruses attach to files and require a user to execute the infected file to spread."},
  {q:"An attacker sends a malformed TCP segment with both SYN and FIN flags set simultaneously. What is the likely purpose?",o:["Establishing a legitimate connection","Firewall evasion / OS fingerprinting","Denial of service against the target","Hijacking an existing session"],a:1,d:2,e:"Invalid flag combinations like SYN+FIN violate TCP RFC specifications — used for firewall evasion (some firewalls only check for standard packets) or OS fingerprinting by analyzing responses."},
  {q:"Which of the following BEST describes the term indicator of compromise (IOC)?",o:["A warning that an attack is about to happen","Evidence suggesting a system has already been compromised","A vulnerability score from CVSS","A list of known attacker IP addresses"],a:1,d:2,e:"An IOC is forensic evidence of a past or ongoing compromise — unusual outbound connections, new admin accounts, known malware hashes, unexpected registry changes."},
  {q:"A ransomware sample specifically deletes Volume Shadow Copies before encrypting files. What is the attacker preventing?",o:["Forensic analysis of the malware","System restore and easy recovery without paying","Detection by EDR solutions","Network communication analysis"],a:1,d:2,e:"Volume Shadow Copies are Windows built-in automatic backups. Deleting them forces victims to pay the ransom since easy local recovery is no longer possible."},
  {q:"Which threat actor type is MOST likely motivated by financial gain and operates like a business with RaaS (Ransomware as a Service) models?",o:["Nation-State APT","Hacktivist","Organized Crime","Script Kiddie"],a:2,d:2,e:"Organized cybercrime groups operate professionally for financial gain — RaaS models where criminals rent ransomware infrastructure to affiliates are a hallmark of organized crime."},
  {q:"An attacker sends a GET request to a web server: GET /../../../etc/passwd HTTP/1.1. Which attack is being attempted?",o:["SQL Injection","Command Injection","Directory Traversal","Buffer Overflow"],a:2,d:2,e:"Directory traversal using ../ sequences attempts to navigate outside the web root to access system files — /etc/passwd is a classic target on Linux/Unix systems."},
  {q:"Which of the following social engineering attacks relies MOST on creating a false sense of urgency?",o:["Baiting","Tailgating","Phishing","War Driving"],a:2,d:2,e:"Phishing attacks commonly use urgency (account suspended, password expires today, urgent wire transfer needed) to bypass rational thinking and prompt immediate action without verification."},
  {q:"Logs show an internal host scanning all 65,535 TCP ports on every IP in the network range at 3AM. Which activity does this indicate?",o:["Normal network monitoring","Vulnerability scanning by the security team","Lateral movement / internal reconnaissance","DDoS preparation"],a:2,d:2,e:"Full port scanning across all internal IPs at 3AM by a single host strongly indicates an attacker performing internal reconnaissance — mapping the network for lateral movement targets."},
  {q:"An attacker poisons the ARP cache of a switch to associate their MAC address with the default gateway IP. Which attack?",o:["DNS Poisoning","ARP Spoofing / Poisoning","MAC Flooding","VLAN Hopping"],a:1,d:2,e:"ARP Poisoning sends fake ARP replies associating the attacker MAC with the legitimate gateway IP — all traffic intended for the gateway is redirected through the attacker (MitM on LAN)."},
  {q:"A malware strain uses legitimate Windows processes like svchost.exe to hide its network communications. Which evasion technique?",o:["Process injection / Living-off-the-Land","Polymorphism","Rootkit installation","Logic bomb"],a:0,d:2,e:"Process injection hides malicious code inside legitimate OS processes — the network connections appear to come from trusted svchost.exe rather than malicious executables, evading basic detection."},
  {q:"Which of the following BEST describes the purpose of OSINT in a penetration test?",o:["Exploiting discovered vulnerabilities","Gathering publicly available information about the target before active testing","Scanning internal networks for open ports","Installing backdoors for persistent access"],a:1,d:2,e:"OSINT gathers intelligence from public sources (job postings, LinkedIn, DNS records, website metadata, GitHub) to understand the target before any active probing begins."},
  {q:"An attacker sends a phishing email to 50,000 random email addresses at once with a generic Dear Customer greeting. Which attack type?",o:["Spear Phishing","Whaling","Phishing","Vishing"],a:2,d:2,e:"Generic mass phishing casts the widest net — no personalization, sent to as many targets as possible hoping a percentage will fall for it."},
  {q:"A malware sample uses RC4 encryption with a key derived from the system hostname to encrypt its C2 communications. What defensive technique would MOST help detection?",o:["Antivirus signature scanning","Network traffic behavioral analysis / UEBA","Full disk encryption","Password complexity requirements"],a:1,d:2,e:"Behavioral analysis detects anomalous communication patterns (timing, volume, destination) regardless of encryption. Signature-based AV cannot detect novel encrypted C2 channels."},
  {q:"Which of the following BEST describes the difference between a vulnerability and an exploit?",o:["They are the same thing","A vulnerability is a weakness; an exploit is code that takes advantage of that weakness","An exploit is a theoretical risk; a vulnerability is a proven attack","Vulnerabilities affect software; exploits affect hardware"],a:1,d:2,e:"A vulnerability is a flaw or weakness in a system. An exploit is the actual code or technique that takes advantage of that vulnerability to cause harm."},
  {q:"A company discovers an attacker has installed a RAT (Remote Access Trojan) that persists across reboots via a registry run key. What phase of the attack lifecycle does this represent?",o:["Initial Access","Lateral Movement","Persistence","Exfiltration"],a:2,d:2,e:"Persistence techniques ensure the attacker maintains access across reboots — registry run keys, scheduled tasks, and service installation are common persistence mechanisms."},
  {q:"Which of the following BEST describes a pass-the-hash attack?",o:["Using a precomputed table to reverse a hash","Authenticating using a stolen password hash without knowing the plaintext","Intercepting password hashes during network transmission","Using GPU brute force to crack a hash"],a:1,d:2,e:"Pass-the-Hash authenticates directly using the stolen NTLM hash — Windows authentication protocols accept the hash directly, so the actual password never needs to be cracked."},
  {q:"An attacker discovers that a web application error page reveals the full server path, PHP version, and database type. Which vulnerability does this represent?",o:["SQL Injection","Information Disclosure / Verbose Error Messages","Cross-Site Scripting","Directory Traversal"],a:1,d:2,e:"Information disclosure through verbose error messages reveals details attackers use for reconnaissance — server paths, software versions, and database types help craft targeted attacks."},
  {q:"A user reports their screen occasionally shows strange activity when they are not touching the mouse. Logs show unexpected remote connections from an internal IP. Which malware type?",o:["Logic Bomb","Ransomware","Remote Access Trojan (RAT)","Adware"],a:2,d:2,e:"A RAT (Remote Access Trojan) provides attackers with covert remote control of a system — allowing them to observe screens, control the mouse/keyboard, and access files."},
  {q:"Which of the following BEST describes a man-in-the-browser (MitB) attack?",o:["Compromising the web server to intercept traffic","Installing malware in the browser to intercept and modify transactions after encryption","Poisoning DNS to redirect browser requests","Downgrading HTTPS to HTTP"],a:1,d:2,e:"MitB operates inside the browser AFTER TLS decryption — it can modify transactions in real time (changing account numbers in banking transfers) while displaying correct information to the user."},
  {q:"An attacker registers several domains similar to a target company (company-secure.com, companylogin.net) to intercept users. Which broader attack category?",o:["Pharming","Typosquatting","Domain Squatting / Combosquatting","DNS Hijacking"],a:2,d:2,e:"Combosquatting (domain squatting) registers variations of legitimate domains adding words like secure, login, or support — more sophisticated than pure typosquatting."},
  {q:"A security analyst finds malware that generates a new random encryption key for each victim and embeds the key delivery mechanism in the ransom note. Which malware characteristic makes recovery hardest?",o:["Network propagation capability","Unique per-victim encryption with attacker-controlled key delivery","Ability to disable antivirus","Persistence via registry keys"],a:1,d:2,e:"Unique per-victim encryption with centralized key management means decryption is impossible without paying — shared keys would allow one victim to share decryption capability."},
  {q:"Which of the following BEST describes the Mitre ATT&CK framework?",o:["A vulnerability scoring system for known CVEs","A knowledge base of real-world attacker tactics techniques and procedures","A compliance framework for healthcare organizations","A network segmentation architecture model"],a:1,d:2,e:"MITRE ATT&CK is a comprehensive knowledge base of adversary TTPs (Tactics, Techniques, Procedures) based on real-world observations — used for threat modeling and detection engineering."},
  {q:"An attacker floods a DNS resolver with queries for a non-existent domain, exhausting its cache and resources. Which attack?",o:["DNS Amplification","DNS Tunneling","DNS Cache Poisoning","DNS NXDOMAIN Flood"],a:3,d:2,e:"NXDOMAIN (Non-Existent Domain) flood overwhelms DNS resolvers with queries for non-existent domains — the resolver must look up each query and cache NXDOMAIN responses, exhausting resources."},
  // ── DOMAIN 3 ADDITIONAL (need 45 more to reach 60) ───────────────────────────
  {q:"A security architect designs a network where users connect through a cloud-delivered security stack that inspects all traffic regardless of user location. Which framework?",o:["Zero Trust","DMZ Architecture","SASE (Secure Access Service Edge)","VPN with split tunneling"],a:2,d:3,e:"SASE combines networking and security into a cloud-delivered service — inspecting all traffic from any location using a unified cloud-based security stack."},
  {q:"Which of the following BEST describes the purpose of network microsegmentation?",o:["Creating a DMZ for public-facing servers","Dividing workloads into granular isolated segments to limit blast radius","Installing firewalls between floors in a building","Creating VLANs based on switch ports"],a:1,d:3,e:"Microsegmentation creates fine-grained Zero Trust perimeters around individual workloads — even if an attacker compromises one workload, lateral movement to adjacent workloads requires re-authentication."},
  {q:"An organization implements a policy requiring all applications to reauthenticate users when accessing sensitive modules regardless of prior authentication. Which principle?",o:["Defense in Depth","Zero Trust","Least Privilege","Need to Know"],a:1,d:3,e:"Zero Trust requires continuous verification — authenticating once for the network does not grant implicit access to all applications. Every resource access request is separately verified."},
  {q:"Which of the following BEST explains why containers are considered less isolated than virtual machines?",o:["Containers cannot be encrypted","Containers share the host OS kernel; VMs have fully isolated kernels","Containers cannot communicate over networks","Containers cannot persist data"],a:1,d:3,e:"Containers share the host OS kernel — a kernel vulnerability could allow container breakout to the host or other containers. VMs have fully isolated kernels via the hypervisor."},
  {q:"An organization needs to encrypt all storage in their cloud environment but wants to ensure the cloud provider cannot access the decryption keys. Which approach?",o:["Provider-managed keys (SSE)","Customer-managed keys (CMEK) with client-side encryption","Provider HSM-backed keys","Default cloud storage encryption"],a:1,d:3,e:"Customer-managed keys (CMEK) with client-side encryption ensures the customer controls all keys — the provider stores only ciphertext and cannot decrypt it even with full access."},
  {q:"A company processes credit card transactions on a server that also hosts their public website. A security review flags this as a PCI DSS violation. What is the PRIMARY concern?",o:["The website may slow down payment processing","The public website and payment system share the same network segment","Insufficient memory for both applications","The website does not have an SSL certificate"],a:1,d:3,e:"PCI DSS requires cardholder data environments to be segmented from other systems — a compromised public website should not have network access to payment processing systems."},
  {q:"Which of the following BEST describes the purpose of a reverse proxy?",o:["Hides client IP addresses from web servers","Sits in front of servers to load balance, cache, and hide internal architecture","Inspects outbound user traffic for policy compliance","Provides VPN access for remote workers"],a:1,d:3,e:"A reverse proxy sits in front of backend servers — it load balances, caches content, applies WAF rules, and hides the real server IP addresses from external users."},
  {q:"An organization has an RTO of 4 hours and RPO of 1 hour. A disaster occurs at 2:00 PM. Systems must be back online by:",o:["3:00 PM with data from 2:00 PM","6:00 PM with data from 1:00 PM","6:00 PM with data from 2:00 PM","2:30 PM with data from 1:30 PM"],a:1,d:3,e:"RTO = 4 hours means back online by 6:00 PM. RPO = 1 hour means the backup used must be from no earlier than 1:00 PM (maximum 1 hour of data loss)."},
  {q:"A company wants to detect attackers who have successfully breached the perimeter by deploying fake credentials that generate alerts when used. Which technique?",o:["Honeypot","Canary Token / Honey Credentials","IDS with signature updates","SIEM correlation rule"],a:1,d:3,e:"Honey credentials (canary tokens) are fake credentials embedded in systems — any attempt to use them confirms unauthorized access, as legitimate users would never encounter or use them."},
  {q:"Which of the following BEST describes the difference between an IDS and an IPS?",o:["IDS is hardware-based; IPS is software-based","IDS monitors and alerts passively; IPS actively blocks malicious traffic inline","IDS is deployed in the cloud; IPS is on-premises","IDS examines Layer 7; IPS examines Layer 3-4 only"],a:1,d:3,e:"IDS is passive — it monitors and generates alerts but does NOT block traffic. IPS is active and inline — it can block, drop, or modify malicious traffic in real time."},
  {q:"An organization moves all servers to AWS. The security team discovers they can no longer apply physical controls like server room access restrictions. Which risk does this create?",o:["The organization has no security responsibilities","Physical security is the provider responsibility under the shared responsibility model","The organization should move back on-premises","The organization must purchase cyber insurance"],a:1,d:3,e:"Under the shared responsibility model, the cloud provider manages physical security of the data center. The customer accepts this transfer of physical control as part of the cloud model."},
  {q:"A company performs weekly full backups and daily incremental backups. The system fails Wednesday morning. What is the MAXIMUM number of backups needed to restore to Tuesday end-of-day?",o:["One — Tuesday incremental only","Two — Sunday full plus Tuesday incremental","Three — Sunday full plus Monday and Tuesday incrementals","Eight — Sunday full plus all seven daily incrementals"],a:2,d:3,e:"Incremental backups only contain changes since the PREVIOUS backup. Need: Sunday full + Monday incremental (changes since Sunday) + Tuesday incremental (changes since Monday) = 3 total."},
  {q:"Which type of firewall inspection tracks the state of network connections and allows return traffic automatically?",o:["Packet filtering firewall","Stateful inspection firewall","Application proxy firewall","Next-generation firewall"],a:1,d:3,e:"Stateful inspection firewalls track connection state — they remember that an outbound request was made and automatically allow the corresponding inbound response without an explicit rule."},
  {q:"An organization wants to monitor ALL user internet traffic for threats including encrypted HTTPS traffic. Which capability is required?",o:["Standard packet filtering","Deep packet inspection with SSL/TLS inspection","NetFlow analysis","DNS monitoring only"],a:1,d:3,e:"SSL/TLS inspection (SSL decryption) decrypts HTTPS traffic for inspection then re-encrypts it — required to inspect encrypted traffic for malware, data exfiltration, and policy violations."},
  {q:"A security engineer wants to ensure that even if one data center fails completely, the application remains available. Which design principle does this implement?",o:["Defense in Depth","Geographic Redundancy / Disaster Recovery","Microsegmentation","Zero Trust"],a:1,d:3,e:"Geographic redundancy distributes systems across multiple physically separate locations — a complete site failure does not take down the application as traffic fails over to the surviving site."},
  {q:"Which of the following cloud deployment models provides DEDICATED infrastructure for a single organization while being managed by a third-party provider?",o:["Public Cloud","Community Cloud","Hosted Private Cloud","Hybrid Cloud"],a:2,d:3,e:"Hosted Private Cloud provides dedicated infrastructure (not shared with other tenants) managed by a third-party provider — combining the control of private cloud with the management convenience of hosted services."},
  {q:"An organization configures its network so that the HR VLAN cannot directly communicate with the Finance VLAN without traversing a firewall. Which security control is this?",o:["Air gapping","VLAN hopping prevention","Inter-VLAN firewall / Network segmentation","MAC address filtering"],a:2,d:3,e:"Routing inter-VLAN traffic through a firewall enforces segmentation — the firewall inspects and controls all traffic between sensitive departments, limiting lateral movement."},
  {q:"Which of the following BEST describes a cold site disaster recovery option?",o:["A site with servers already running and data synced in real time","A site with servers installed but no data loaded","An empty facility with power and connectivity but no equipment","A mobile data center that can be shipped to any location"],a:2,d:3,e:"A cold site is an empty facility with basic infrastructure (power, cooling, connectivity) but no pre-installed equipment — the organization must ship and install hardware, taking days to weeks."},
  {q:"A security team wants to measure the average time their systems operate before experiencing a failure. Which metric are they tracking?",o:["MTTR","RPO","RTO","MTBF"],a:3,d:3,e:"MTBF (Mean Time Between Failures) measures average operational time between failures — higher MTBF indicates more reliable systems. MTTR measures repair time after failure."},
  {q:"Which of the following BEST explains why SaaS customers are NOT responsible for patching operating systems?",o:["SaaS vendors never release patches","Under the SaaS shared responsibility model the provider manages the entire stack","SaaS applications do not run on operating systems","Customers must still patch OS but the vendor handles applications"],a:1,d:3,e:"In SaaS, the provider manages everything including the OS, middleware, runtime, and application. The customer only manages their data and user access — OS patching is entirely the provider responsibility."},
  {q:"A network administrator configures a VLAN for IoT devices that prevents them from communicating with corporate workstations. Which security principle does this implement?",o:["Least Privilege","Network Segmentation","Zero Trust","Defense in Depth"],a:1,d:3,e:"Network segmentation isolates IoT devices (which typically have poor security) from corporate assets — a compromised IoT device cannot directly attack workstations or servers in other segments."},
  {q:"Which of the following BEST describes the purpose of a proxy server from a security perspective?",o:["Encrypts all outbound traffic automatically","Filters content, caches responses, hides internal IPs, and enforces acceptable use policies","Replaces the need for a firewall","Provides authentication for all network devices"],a:1,d:3,e:"Forward proxies intercept outbound user traffic — enforcing acceptable use policies, filtering malicious content, caching responses for performance, and hiding internal client IP addresses from external servers."},
  {q:"An organization wants to ensure that even if an attacker steals an encrypted backup, they cannot decrypt it without a key the organization controls. Which control achieves this?",o:["Storing backups in the cloud","Customer-managed encryption keys with offsite key storage","Incremental backup strategy","RAID 6 storage configuration"],a:1,d:3,e:"Customer-managed encryption keys ensure only the organization can decrypt backups — the key is stored separately from the encrypted data, so theft of the backup alone is insufficient."},
  {q:"A server in the DMZ is compromised. The attacker discovers the database server is on the same network segment. Which architectural flaw allowed this?",o:["The DMZ used VLANs instead of physical separation","The database server should be in a separate secure zone behind an additional firewall","The firewall rules were too restrictive","The DMZ did not have intrusion detection"],a:1,d:3,e:"The database server should be in a separate highly restricted secure zone — DMZ compromise should not provide direct network access to databases containing sensitive data."},
  {q:"Which of the following BEST describes the purpose of an NGFW compared to a traditional stateful firewall?",o:["NGFW operates at Layer 2; stateful at Layer 4","NGFW adds deep packet inspection, application identification, user identity awareness, and integrated IPS","NGFW is faster but less secure","NGFW cannot perform stateful inspection"],a:1,d:3,e:"NGFW adds application-layer awareness (identifying traffic by application not just port), user identity, SSL inspection, and integrated IPS capabilities beyond traditional stateful inspection."},
  {q:"A company is considering using serverless computing for their application. Which security responsibility is ELIMINATED compared to IaaS?",o:["Application code security","Data security","OS and infrastructure patching","User authentication"],a:2,d:3,e:"In serverless computing the provider manages everything including OS, runtime, and infrastructure patching. The customer only secures their application code and data."},
  {q:"Which backup strategy minimizes the time required to perform the backup operation while accepting a longer restoration time?",o:["Full backup","Differential backup","Incremental backup","Mirror backup"],a:2,d:3,e:"Incremental backup only saves changes since the LAST backup of any type — fastest to create but slowest to restore since you need the full backup plus every incremental in the chain."},
  {q:"An organization deploys a device that monitors all inbound HTTP traffic to their web application and blocks requests containing common web attack signatures. Which device?",o:["IDS","IPS","WAF","NGFW"],a:2,d:3,e:"WAF (Web Application Firewall) specifically understands HTTP/HTTPS and web application traffic — it detects and blocks web attacks like SQLi, XSS, and CSRF based on application-layer inspection."},
  {q:"A cloud provider suffers a physical hardware failure causing customer VMs to become unavailable. Under IaaS who is responsible for this outage?",o:["The customer — they manage the VMs","The customer — they should have redundancy","The cloud provider — they own the physical infrastructure","Shared equally between provider and customer"],a:2,d:3,e:"Under IaaS shared responsibility, the provider owns and is responsible for physical infrastructure reliability. Physical hardware failures are the provider responsibility. The customer is responsible for VM-level redundancy design."},
  {q:"Which of the following represents the CORRECT order of a TCP three-way handshake that an IDS would baseline as normal?",o:["SYN, ACK, FIN","SYN, SYN-ACK, ACK","SYN, RST, ACK","SYN-ACK, SYN, ACK"],a:1,d:3,e:"TCP three-way handshake: Client sends SYN → Server responds SYN-ACK → Client confirms ACK. Understanding this baseline helps IDS detect abnormal flag combinations used in attacks."},
  {q:"An organization uses SD-WAN to connect branch offices. Which security capability should be integrated into the SD-WAN solution?",o:["Physical cable management","Integrated firewall and traffic inspection at each branch","RAID storage at each site","Local DNS servers at each branch"],a:1,d:3,e:"Modern SD-WAN solutions include integrated security (firewall, IPS, content filtering) at each branch — eliminating the need to backhaul all traffic to a central security stack before inspection."},
  // ── DOMAIN 4 ADDITIONAL (need 75 more to reach 93) ───────────────────────────
  {q:"A security operations team receives 1,200 alerts per day. They implement automated triage that closes 80% of low-fidelity alerts. Which technology BEST enables this?",o:["SIEM","IDS","SOAR","EDR"],a:2,d:4,e:"SOAR automates alert triage, enrichment, and response — allowing analysts to focus on high-priority incidents while routine low-fidelity alerts are handled automatically."},
  {q:"An analyst observes that a compromised machine is sending DNS queries for algorithmically generated domain names (e.g., xjk3mz9.com, pqr7nt2.com). Which technique?",o:["DNS Amplification","Domain Generation Algorithm (DGA)","DNS Tunneling","NXDOMAIN Flood"],a:1,d:4,e:"Domain Generation Algorithms generate thousands of random domain names — only the attacker knows which ones are registered as C2 servers. Makes C2 infrastructure difficult to block."},
  {q:"During incident response, a security team wants to ensure that changes made to firewall rules are tracked and reversible. Which control BEST supports this?",o:["SIEM log collection","Configuration management and change control","Vulnerability scanning","Network segmentation"],a:1,d:4,e:"Change management with version control for firewall rules ensures all changes are tracked, approved, and reversible — critical during incidents where rapid changes may introduce new vulnerabilities."},
  {q:"An EDR solution detects malware executing on a workstation. It automatically terminates the process, quarantines the file, and creates an incident ticket. Which capability is demonstrated?",o:["Detection only","Detection and automated response","Manual incident response","Vulnerability management"],a:1,d:4,e:"EDR (Endpoint Detection and Response) combines detection with automated response capabilities — modern EDR solutions can contain threats without human intervention while alerting analysts."},
  {q:"A forensic analyst must analyze a live server that cannot be taken offline. Which approach BEST preserves evidence while maintaining availability?",o:["Immediately power off and image the drive","Create a forensic image of memory and running processes without powering off","Delete suspicious files and continue monitoring","Reinstall the OS to ensure a clean state"],a:1,d:4,e:"Live forensics collects volatile evidence (memory, running processes, network connections) from a running system — preserving critical evidence that would be lost on power off while keeping the system available."},
  {q:"Which of the following IR activities occurs during the Lessons Learned phase?",o:["Isolating compromised systems from the network","Restoring systems from clean backups","Conducting a post-incident review and updating playbooks","Removing malware and patching vulnerabilities"],a:2,d:4,e:"Lessons Learned involves post-incident analysis — reviewing what happened, what went well, what failed, and updating playbooks, training, and controls to improve future response."},
  {q:"A company wants to verify its security controls work as intended by simulating real attack scenarios against their production environment with full knowledge and authorization. Which activity?",o:["Vulnerability Scanning","Red Team Assessment","Penetration Testing","Threat Hunting"],a:2,d:4,e:"A Red Team assessment simulates a sophisticated adversary using real attack techniques against the actual production environment — testing whether defensive controls detect and respond to realistic attacks."},
  {q:"Which of the following BEST describes the difference between vulnerability scanning and penetration testing?",o:["Vulnerability scanning exploits vulnerabilities; pen testing only identifies them","Vulnerability scanning identifies potential weaknesses; pen testing exploits them to prove impact","They are the same thing performed by different tools","Vulnerability scanning is manual; pen testing is automated"],a:1,d:4,e:"Vulnerability scanning identifies and reports potential weaknesses without exploiting them. Penetration testing actually exploits vulnerabilities to demonstrate real-world impact — requires explicit authorization."},
  {q:"A SOC analyst notices that a SIEM rule fires 500 times daily but investigation shows all alerts are false positives. Which action BEST improves alert quality?",o:["Delete the SIEM rule","Tune the SIEM rule to add additional correlation conditions reducing false positives","Increase analyst headcount to investigate all alerts","Disable the rule until it can be rewritten"],a:1,d:4,e:"SIEM tuning adds conditions and exceptions to reduce false positives while maintaining detection of true positives — improving signal-to-noise ratio so analysts focus on real threats."},
  {q:"During forensic investigation, an analyst boots a suspect hard drive using a hardware write blocker. What does the write blocker prevent?",o:["The drive from being imaged","Any data from being read","Accidental modification of evidence during analysis","The drive from being connected to the forensic workstation"],a:2,d:4,e:"A write blocker is a hardware or software device that permits read operations while blocking all write operations — preserving the original evidence in its unmodified state."},
  {q:"A threat hunter finds evidence that an attacker has been in the network for 6 months using legitimate admin tools, making small configuration changes. What phase of incident response should begin immediately?",o:["Preparation","Detection — this is still in detection phase","Containment","Lessons Learned"],a:2,d:4,e:"Once a threat is confirmed (even after months), the next phase is Containment — stop the spread and prevent further damage. Investigation continues during and after containment."},
  {q:"An organization wants to give users access to a specific application for one week while on a project team. After the project ends access should be automatically removed. Which control?",o:["RBAC with manual review","Temporary ABAC rule with expiration","Just-in-Time (JIT) access with time-bound provisioning","DAC with user self-service"],a:2,d:4,e:"Time-bound JIT provisioning grants access for a defined period and automatically revokes it — eliminating the risk of forgotten access persisting after the business need ends."},
  {q:"A security team discovers that all admin actions on a critical server for the past 90 days have been performed by accounts belonging to terminated employees. Which control FAILED?",o:["Least Privilege","Deprovisioning / User Lifecycle Management","Separation of Duties","Dual Control"],a:1,d:4,e:"Deprovisioning failure — accounts of terminated employees should be disabled immediately upon departure. Lack of timely deprovisioning creates ghost accounts that attackers can exploit."},
  {q:"Which of the following BEST describes the purpose of a Security Operations Center (SOC)?",o:["Develops new security products","Provides 24/7 monitoring detection and response to security events","Manages compliance documentation","Performs annual penetration tests"],a:1,d:4,e:"A SOC is a dedicated team providing continuous (24/7) monitoring of security events, detection of threats, and coordinated response to incidents across the organization infrastructure."},
  {q:"An analyst uses threat intelligence to proactively search for evidence of attacker TTPs in the environment without waiting for automated alerts. Which activity?",o:["Penetration Testing","Vulnerability Scanning","Threat Hunting","Red Team Exercise"],a:2,d:4,e:"Threat Hunting is proactive — analysts use threat intelligence and hypotheses to actively search for hidden threats that have evaded automated detection, before any alert fires."},
  {q:"A ransomware attack encrypts 500 servers. The IR team begins restoring from backup without first confirming the ransomware is removed. What is the likely outcome?",o:["Successful recovery","The backups will fail to restore","Reinfection — ransomware re-encrypts restored systems","The ransomware will spread to backups"],a:2,d:4,e:"Restoring before Eradication causes immediate reinfection — the attack vector and malware must be removed BEFORE restoration. This is why Eradication always precedes Recovery in the IR lifecycle."},
  {q:"Which of the following BEST describes the purpose of maintaining chain of custody for digital evidence?",o:["Speeds up forensic analysis","Ensures the evidence is admissible in legal proceedings by proving it was not tampered with","Prevents unauthorized copying of evidence","Encrypts evidence to protect confidentiality"],a:1,d:4,e:"Chain of custody documents every person who handled evidence and when — proving the evidence is authentic and unmodified makes it admissible in court and withstands legal challenge."},
  {q:"A company deploys application whitelisting on all servers. An attacker who has compromised a server finds they cannot execute their custom malware payload. Why?",o:["The firewall blocked the malware download","Application whitelisting blocks execution of any application not on the approved list","The EDR detected and quarantined the malware","The malware was detected by antivirus signatures"],a:1,d:4,e:"Application whitelisting allows ONLY pre-approved applications to execute — any executable not on the approved list is blocked regardless of whether it is known malware, providing strong protection against novel threats."},
  {q:"An analyst creates SHA-256 hashes of all files on a server before and after a suspected intrusion. Comparing the two sets reveals which files were modified. Which technique?",o:["Digital signatures","File integrity monitoring","Log correlation","Vulnerability scanning"],a:1,d:4,e:"File Integrity Monitoring (FIM) uses hashing to detect unauthorized file modifications — comparing before and after hashes identifies exactly which files were changed during an incident."},
  {q:"A company implements a policy that developers cannot deploy code to production without approval from the security team, and the security team cannot approve without a developer sign-off. Which principle?",o:["Least Privilege","Dual Control","Separation of Duties","Need to Know"],a:2,d:4,e:"Separation of Duties splits the deployment process — developers write code but cannot self-approve deployments. Security approves but cannot deploy without developer involvement. Neither party can act alone."},
  {q:"After a breach, the legal team instructs IT to preserve all system logs for the past year. Standard log retention is 90 days. Which obligation triggers this?",o:["GDPR data minimization","Regulatory compliance","Legal Hold for potential litigation","Standard IR procedure"],a:2,d:4,e:"A Legal Hold preservation order requires retaining all potentially relevant evidence beyond normal retention schedules — violating a legal hold by deleting logs could be considered obstruction."},
  {q:"Which of the following BEST explains why collecting RAM before imaging the hard drive is critical in live forensics?",o:["RAM contains the encryption keys for the hard drive","RAM is volatile and contains running processes, network connections, and decrypted data lost on power off","RAM imaging is faster than disk imaging","Hard drive imaging requires RAM to be cleared first"],a:1,d:4,e:"RAM is volatile — it contains currently running processes, decrypted data, passwords, network connections, and malware that existed only in memory. Power off permanently destroys this evidence."},
  {q:"A SIEM alert fires: failed logins to 50 different accounts each with exactly 2 attempts. All attempts use common passwords. Which attack?",o:["Brute Force","Credential Stuffing","Password Spraying","Dictionary Attack"],a:2,d:4,e:"Password Spraying tries a SMALL number of common passwords against MANY accounts — staying under lockout thresholds. Brute force tries MANY passwords against one account."},
  {q:"An organization wants to test how quickly its SOC team detects and responds to a simulated breach without the team knowing it is a test. Which exercise?",o:["Tabletop Exercise","Red Team Exercise","Vulnerability Assessment","Penetration Test"],a:1,d:4,e:"A Red Team exercise tests real detection and response without the defenders knowing it is a test — measuring actual detection time, response quality, and control effectiveness under realistic conditions."},
  {q:"Which of the following is MOST important to document immediately after collecting forensic evidence?",o:["Write a final incident report","Record a SHA-256 hash of each piece of evidence","Notify law enforcement","Begin analysis of the evidence"],a:1,d:4,e:"Hashing evidence immediately after collection creates an immutable fingerprint — any subsequent alteration produces a different hash, mathematically proving the evidence was not tampered with."},
  {q:"An organization uses PAM (Privileged Access Management) to require approval before any admin account accesses production servers. Which security benefit does this provide?",o:["Eliminates need for strong passwords","Creates an approval workflow preventing unauthorized privileged access and generating audit logs","Allows admins to bypass MFA for convenience","Automatically patches servers when accessed"],a:1,d:4,e:"PAM creates controlled access workflows for privileged accounts — requiring approval, enforcing session recording, limiting session duration, and generating comprehensive audit trails for all admin activity."},
  {q:"A company implements EDR on all endpoints. The EDR detects unusual process behavior (cmd.exe spawned by Word) and automatically isolates the endpoint. Which capability?",o:["Vulnerability management","Automated threat containment / response","Log aggregation","Patch management"],a:1,d:4,e:"EDR automated response capabilities can contain threats without human intervention — detecting behavioral anomalies (suspicious parent-child process relationships) and isolating endpoints faster than manual response."},
  {q:"During an IR, a team member wants to reboot a compromised server to stop the malware. The team lead insists on collecting memory first. Why?",o:["Rebooting will spread the malware to other systems","A reboot will corrupt the hard drive","Memory contents (volatile evidence) are permanently lost when the system reboots","The malware will survive the reboot in BIOS"],a:2,d:4,e:"Memory (RAM) is volatile — all running processes, network connections, injected code, and encryption keys in memory are permanently lost when the system powers off or reboots."},
  {q:"Which phase of incident response involves patching the vulnerability that was exploited, removing malware artifacts, and closing the attack vector?",o:["Containment","Eradication","Recovery","Preparation"],a:1,d:4,e:"Eradication removes the root cause and all malware artifacts — patching the exploited vulnerability, closing the attack vector, and removing any backdoors installed during the compromise."},
  {q:"A company wants to measure how long it takes from breach occurrence to breach detection. Which metric does this describe?",o:["RTO","MTTR","Mean Time to Detect (MTTD) / Dwell Time","MTBF"],a:2,d:4,e:"Mean Time to Detect (MTTD) or Dwell Time measures how long attackers are in the environment before detection. Industry average dwell times have historically exceeded 200 days."},
  {q:"An analyst finds a malicious script in the Windows registry Run key set to execute at user login. Which stage of the kill chain does removing this represent?",o:["Reconnaissance","Delivery","Eradication of persistence mechanism","Weaponization"],a:2,d:4,e:"Removing registry persistence mechanisms is part of Eradication in the IR lifecycle — eliminating all footholds and backdoors the attacker established to maintain access."},
  {q:"A security team wants to understand attacker behavior patterns to improve detection rules. They deploy systems designed to be compromised and carefully observe attacker actions. Which technique?",o:["Penetration Testing","Red Team","Honeypot / Honeynet Research","Threat Hunting"],a:2,d:4,e:"Research honeypots are intentionally vulnerable systems that capture and study real attacker techniques — the intelligence gathered directly improves detection rules and incident response playbooks."},
  {q:"Which of the following access control models would MOST effectively prevent an insider threat from accessing data beyond their current job requirements?",o:["DAC","MAC","RBAC with regular access reviews","Role-based with static permissions set at hire"],a:2,d:4,e:"RBAC with regular periodic access reviews ensures permissions match current job requirements — reviews catch and remove excess access accumulated through privilege creep before it can be abused."},
  {q:"A user calls the help desk saying their computer is running slowly and their browser is showing unexpected pop-up advertisements from unfamiliar companies. Which malware type is MOST likely?",o:["Ransomware","Rootkit","Adware","Keylogger"],a:2,d:4,e:"Adware displays unwanted advertisements — browser pop-ups and redirects without file encryption or system damage are classic adware indicators."},
  {q:"An organization wants to test its incident response plan including communication trees escalation procedures and decision-making authority without taking any systems offline. Which exercise?",o:["Full Simulation","Tabletop Exercise","Red Team","Penetration Test"],a:1,d:4,e:"Tabletop exercises are discussion-based — teams talk through hypothetical scenarios testing procedures, communications, and decision-making without any technical systems being affected."},
  {q:"During forensics, an analyst needs to recover deleted files from a hard drive. Which principle explains why this is sometimes possible?",o:["Files are always encrypted when deleted","Deletion only removes the file system pointer; actual data remains until overwritten","The recycle bin stores copies of all deleted files permanently","Hard drives automatically back up deleted files to recovery partitions"],a:1,d:4,e:"File deletion typically removes only the directory entry (pointer) while the actual data remains on the disk until overwritten — forensic tools can recover data by scanning for file headers in unallocated space."},
  {q:"A company discovers that a sysadmin installed a hidden admin account named 'svchost' before being terminated. Which threat category?",o:["External Threat Actor","Advanced Persistent Threat","Insider Threat — Sabotage","Script Kiddie"],a:2,d:4,e:"This is a classic insider threat sabotage scenario — the departing employee planted a backdoor account before leaving to maintain access or cause damage after termination."},
  {q:"An analyst uses NetFlow data to investigate a suspected data breach. What information can NetFlow provide that full packet capture cannot provide as efficiently?",o:["Full content of stolen files","Long-term traffic pattern analysis across the entire network","Encryption keys used during transmission","Application layer payloads"],a:1,d:4,e:"NetFlow captures metadata (source/destination IPs, ports, volume, timing) for all network flows efficiently — practical for long-term pattern analysis across the entire network where full packet capture would be prohibitively expensive."},
  {q:"Which of the following BEST describes the difference between SIEM and SOAR?",o:["SIEM automates responses; SOAR aggregates logs","SIEM aggregates and correlates logs generating alerts; SOAR automates response actions based on those alerts","They are the same technology with different vendor names","SIEM is for endpoints; SOAR is for network devices"],a:1,d:4,e:"SIEM collects, correlates, and alerts. SOAR takes the next step — automating investigation steps and response actions based on SIEM alerts, reducing manual analyst workload."},
  {q:"After a ransomware incident the IR team restores from backup but the same ransomware reappears within hours. What step was SKIPPED?",o:["Preparation","Detection","Eradication","Lessons Learned"],a:2,d:4,e:"Eradication was skipped — the team restored without removing the ransomware and closing the attack vector. The attacker simply redeployed ransomware through the still-open entry point."},
  {q:"A company gives every new employee a standard set of permissions based on their job title. Six months later an audit finds many employees have far more access than needed. Which process FAILED?",o:["Provisioning","User Access Review","Deprovisioning","Authentication"],a:1,d:4,e:"User Access Review — periodic audits of permissions should identify excess access and remove it. Without regular reviews, initially appropriate permissions become excessive as roles evolve."},
  {q:"A security team implements a control requiring all privileged sessions to be recorded and reviewable by auditors. Which technology provides this?",o:["SIEM","PAM with session recording","EDR","Application whitelisting"],a:1,d:4,e:"PAM (Privileged Access Management) with session recording captures all keystrokes, commands, and screen activity during privileged sessions — creating a full audit trail reviewable for compliance and investigation."},
  {q:"Which of the following correctly describes the order of events in a typical ransomware attack?",o:["Encrypt → Establish C2 → Exfiltrate → Demand payment","Initial Access → Establish persistence → Disable backups → Encrypt → Demand payment","Encrypt → Demand payment → Establish persistence → Exfiltrate","Scan → Exploit → Encrypt → Establish C2"],a:1,d:4,e:"Modern ransomware typically: gains access, establishes persistence, disables security tools and backups (to prevent recovery), then encrypts files. Some variants also exfiltrate data for double extortion."},
  {q:"An organization wants to quickly identify all systems running a vulnerable version of OpenSSL across 50,000 assets. Which tool is MOST appropriate?",o:["Penetration Testing","Tabletop Exercise","Vulnerability Scanner","SIEM"],a:2,d:4,e:"Vulnerability scanners can rapidly inventory software versions across large environments and flag systems running vulnerable versions — much faster than manual checking or penetration testing."},
  {q:"A threat analyst receives a report of a new zero-day exploit in the wild. Which IR phase should begin immediately even before any compromise is detected?",o:["Detection","Eradication","Preparation — update detection rules and monitoring","Recovery"],a:2,d:4,e:"When a new zero-day is announced, organizations should immediately update detection rules, increase monitoring for exploitation indicators, and assess exposure — acting in Preparation before a compromise occurs."},
  {q:"Which of the following BEST describes XDR (Extended Detection and Response)?",o:["A more expensive version of EDR with the same capabilities","Extends EDR correlation across endpoints, network, cloud, email, and identity for unified detection","A hardware appliance for network monitoring","An EDR solution designed specifically for cloud workloads"],a:1,d:4,e:"XDR extends detection and response beyond endpoints — correlating signals from network, cloud, email, and identity sources alongside endpoint telemetry for a unified view of attacks spanning multiple vectors."},
  {q:"A database administrator account is used to access production data at 11PM on a Saturday when no maintenance is scheduled. UEBA fires an alert. Which indicator triggered this?",o:["Geographic anomaly","Impossible travel","Time and volume behavioral anomaly","Device fingerprint mismatch"],a:2,d:4,e:"UEBA establishes behavioral baselines — a DBA accessing production at 11PM Saturday when they typically work 9-5 weekdays is a significant behavioral anomaly flagging potential account compromise."},
  {q:"An organization implements a SOAR playbook that automatically blocks an IP after 10 failed logins in 60 seconds. What type of response is this?",o:["Manual response","Automated containment","Passive detection","Threat Hunting"],a:1,d:4,e:"Automated containment via SOAR playbook — the system automatically responds to the threat (blocking the IP) without human intervention, reducing response time from minutes to seconds."},
  {q:"During an investigation an analyst finds evidence that an attacker used a legitimate admin tool to run: wmic process call create 'cmd.exe /c whoami > c:\temp\out.txt'. Which technique?",o:["Malware installation","Living-off-the-Land (LotL) attack","SQL Injection","Privilege escalation"],a:1,d:4,e:"Living-off-the-Land uses legitimate built-in tools (WMIC, PowerShell, PsExec) to execute malicious commands — no malware files are written, making traditional signature-based detection ineffective."},
  {q:"Which of the following activities would be performed DURING the Detection and Analysis phase of incident response?",o:["Installing security monitoring tools","Isolating the compromised system","Correlating SIEM alerts and confirming an incident occurred","Patching the exploited vulnerability"],a:2,d:4,e:"Detection and Analysis involves identifying potential incidents and confirming they are real — correlating SIEM alerts, reviewing logs, analyzing indicators, and declaring a confirmed incident."},
  {q:"A security team wants to implement a control ensuring that if an analyst account is compromised an attacker cannot disable security monitoring tools. Which control BEST achieves this?",o:["Strong password policy","Separation of Duties — security tool management separate from SOC analyst role","MFA for analyst accounts","Encrypted communications"],a:1,d:4,e:"Separation of Duties ensures analysts can USE security tools but cannot modify configurations or disable them — a separate privileged role with strict access controls manages the tools themselves."},
  // ── DOMAIN 5 ADDITIONAL (need 53 more to reach 67) ───────────────────────────
  {q:"A company calculates that a server room flood has a 10% annual probability and would cause $500,000 in damage. What is the Annual Loss Expectancy?",o:["$500,000","$50,000","$5,000","$5,000,000"],a:1,d:5,e:"ALE = Asset Value × Exposure Factor × ARO = $500,000 × 100% × 0.10 = $50,000. ARO of 10% annual probability = 0.10 occurrences per year."},
  {q:"Which of the following risk frameworks specifically uses the functions Identify Protect Detect Respond and Recover?",o:["ISO 27001","NIST Cybersecurity Framework (CSF)","PCI DSS","SOC 2"],a:1,d:5,e:"The NIST CSF organizes cybersecurity activities into five functions: Identify, Protect, Detect, Respond, and Recover — providing a common language for managing cybersecurity risk."},
  {q:"A company stores customer data in the EU and transfers it to US servers for processing. Which regulation primarily governs this transfer?",o:["HIPAA","PCI DSS","GDPR","SOX"],a:2,d:5,e:"GDPR governs all processing of EU citizen personal data including transfers to third countries — transfers to the US require appropriate safeguards such as Standard Contractual Clauses or Binding Corporate Rules."},
  {q:"An organization decides to accept a residual risk after implementing controls that reduce it to within their risk appetite. Which term describes the remaining risk?",o:["Inherent Risk","Total Risk","Residual Risk","Secondary Risk"],a:2,d:5,e:"Residual Risk is the risk remaining after controls have been applied — organizations accept residual risk when it falls within their defined risk tolerance or appetite."},
  {q:"A new regulation requires organizations to implement specific technical controls or face significant fines. Which risk response do these fines most incentivize?",o:["Risk Acceptance","Risk Avoidance","Risk Mitigation / Compliance","Risk Transference"],a:2,d:5,e:"Regulatory fines incentivize risk mitigation through compliance — organizations implement the required controls to avoid the financial and reputational consequences of non-compliance."},
  {q:"Which of the following data roles is responsible for the day-to-day protection and maintenance of data including backups and security controls?",o:["Data Owner","Data Controller","Data Custodian","Data Processor"],a:2,d:5,e:"Data Custodian is the IT role responsible for implementing the technical controls protecting data — backups, access controls, encryption. The Data Owner is the business person accountable for classification and risk decisions."},
  {q:"A company must comply with PCI DSS. Which systems MUST be included in the PCI DSS scope?",o:["Only the payment processing servers","All systems in the cardholder data environment and systems that could affect its security","Only systems that store credit card numbers","Only internet-facing systems"],a:1,d:5,e:"PCI DSS scope includes all systems in the Cardholder Data Environment (CDE) AND any systems that could impact the security of the CDE — network segmentation is used to reduce scope."},
  {q:"An organization uses qualitative risk analysis for its risk register. Which approach does qualitative analysis use?",o:["Numerical probability and financial impact calculations","Descriptive ratings such as High Medium Low","Monte Carlo simulations","Annual Loss Expectancy formulas"],a:1,d:5,e:"Qualitative risk analysis uses descriptive ratings (High/Medium/Low) based on expert judgment — faster and easier than quantitative but more subjective. Quantitative uses numbers and financial calculations."},
  {q:"A vendor provides cloud services to a healthcare organization. The vendor processes patient data on behalf of the healthcare organization. Under HIPAA what is the vendor called?",o:["Data Controller","Business Associate","Data Processor","Covered Entity"],a:1,d:5,e:"Under HIPAA a Business Associate is any vendor that creates, receives, maintains, or transmits Protected Health Information on behalf of a Covered Entity — they must sign a Business Associate Agreement (BAA)."},
  {q:"Which of the following BEST describes the purpose of a Business Impact Analysis (BIA)?",o:["Identifies vulnerabilities in business systems","Determines the financial and operational impact of disrupting critical business processes","Assesses vendor security posture","Creates the incident response plan"],a:1,d:5,e:"A BIA identifies critical business processes and quantifies the impact of their disruption — establishing RTO and RPO requirements and prioritizing recovery efforts based on business impact."},
  {q:"An organization identifies that their web application firewall has a 30% chance of failing to block an attack in any given year, with potential damage of $200,000. What is the ALE?",o:["$200,000","$140,000","$60,000","$600,000"],a:2,d:5,e:"ALE = SLE × ARO = $200,000 × 0.30 = $60,000. This represents the expected yearly cost of this risk materializing."},
  {q:"A company wants to ensure that employee personal information is only used for employment purposes and not shared with marketing. Which privacy principle does this represent?",o:["Data Minimization","Purpose Limitation","Storage Limitation","Data Integrity"],a:1,d:5,e:"Purpose Limitation is a GDPR principle requiring that personal data is collected for specific explicit purposes and not processed in ways incompatible with those purposes."},
  {q:"Which of the following BEST describes SOC 2 Type II compliance?",o:["A one-time assessment of security control design","A period assessment (typically 6-12 months) verifying controls operated effectively over time","A technical vulnerability assessment","A penetration test of cloud infrastructure"],a:1,d:5,e:"SOC 2 Type II examines whether controls not only EXIST (Type I) but OPERATED EFFECTIVELY over an extended period — providing much stronger assurance than a point-in-time Type I assessment."},
  {q:"A company discovers its primary software vendor was breached and malicious code was inserted into an update delivered to all customers. This is an example of:",o:["Insider Threat","Zero-Day Attack","Supply Chain Attack","Watering Hole Attack"],a:2,d:5,e:"Supply chain attacks compromise a trusted vendor or software distribution mechanism — customers receive malicious updates from what appears to be a legitimate trusted source."},
  {q:"An organization processes personal data of EU residents. A customer requests that all their data be deleted from company systems. Under GDPR which right is being exercised?",o:["Right to Access","Right to Rectification","Right to Erasure (Right to be Forgotten)","Right to Portability"],a:2,d:5,e:"GDPR Article 17 — Right to Erasure (Right to be Forgotten) — allows individuals to request deletion of their personal data when it is no longer necessary for the purpose it was collected."},
  {q:"Which of the following BEST describes inherent risk?",o:["Risk remaining after controls are applied","Risk before any controls are applied","Risk transferred to insurance","Risk accepted by management"],a:1,d:5,e:"Inherent risk is the raw, uncontrolled risk level — the risk that exists before ANY security controls are implemented. After controls are applied the remaining risk is called residual risk."},
  {q:"A company contracts with a cloud provider for data storage. The contract specifies 99.99% uptime, 4-hour response to incidents, and right-to-audit clauses. This contract is BEST described as:",o:["NDA","MOU","SLA with security requirements","MSA"],a:2,d:5,e:"An SLA (Service Level Agreement) defines specific measurable service levels — uptime percentages, response times, and security obligations. The right-to-audit clause is a supply chain risk management control."},
  {q:"Which of the following BEST explains why data classification is foundational to an information security program?",o:["It determines which employees need security training","It establishes what level of protection each type of data requires, guiding all other security decisions","It identifies vulnerabilities in data processing systems","It is required by all regulatory frameworks"],a:1,d:5,e:"Data classification establishes sensitivity levels — Public, Internal, Confidential, Restricted — which then drive decisions about encryption, access controls, retention, sharing, and incident response priorities."},
  {q:"An organization wants to manage the risk of its employees clicking phishing links. Which combination of controls BEST addresses this?",o:["Firewall and IDS only","Security awareness training, email filtering, and MFA combined","Strong password policy and endpoint encryption","Vulnerability scanning and patch management"],a:1,d:5,e:"Defense in depth against phishing: training reduces likelihood of clicking (human control), email filtering reduces delivery (technical control), MFA limits impact of credential theft (compensating control)."},
  {q:"A risk assessment finds that patching a vulnerability would cost $50,000 but the maximum possible loss is only $10,000. Which risk response is MOST appropriate?",o:["Mitigation — always patch vulnerabilities","Avoidance — shut down the affected system","Acceptance — the cost to mitigate exceeds potential loss","Transference — buy insurance for $10,000"],a:2,d:5,e:"Risk Acceptance is appropriate when the cost to mitigate exceeds the potential impact — organizations formally accept and document the risk rather than spending more to fix it than it could ever cost."},
  {q:"Under GDPR which of the following describes the Data Controller?",o:["Any employee who accesses personal data","The organization that determines the purposes and means of processing personal data","The vendor that processes data on behalf of the organization","The IT administrator who implements data security controls"],a:1,d:5,e:"The Data Controller is the organization (or person) that determines WHY and HOW personal data is processed — they are legally accountable under GDPR for compliance and must notify supervisory authorities of breaches."},
  {q:"A company's security policy mandates that all sensitive data must be encrypted at rest and in transit and access must be logged. Which type of security control are these policies?",o:["Technical Controls","Physical Controls","Managerial/Administrative Controls","Operational Controls"],a:2,d:5,e:"Written security policies are Managerial/Administrative controls — they direct behavior and establish requirements. The actual encryption and logging implementations would be Technical controls."},
  {q:"An organization is choosing between two controls to address a risk. Control A costs $100,000 and reduces expected loss by $50,000 per year. Control B costs $20,000 and reduces expected loss by $40,000 per year. Which is more cost-effective?",o:["Control A — greater loss reduction","Control B — better return on investment","They are equivalent","Neither — both should be rejected"],a:1,d:5,e:"Control B: $40,000 reduction for $20,000 cost = 200% ROI. Control A: $50,000 reduction for $100,000 cost = 50% ROI. Control B provides significantly better return on security investment."},
  {q:"A vendor contract includes a clause requiring them to notify the organization within 72 hours of any security incident affecting the organization data. This is BEST described as:",o:["SLA uptime requirement","Breach notification requirement in vendor contract","NDA clause","Data retention requirement"],a:1,d:5,e:"Breach notification clauses in vendor contracts are supply chain risk management controls — ensuring the organization receives timely notice of incidents affecting their data to begin their own IR process."},
  {q:"Which of the following BEST describes the difference between a policy and a procedure?",o:["Policies are technical; procedures are administrative","Policies state WHAT must be done at a high level; procedures describe HOW to do it step by step","They are the same document with different names","Policies are optional; procedures are mandatory"],a:1,d:5,e:"Policies are high-level statements of intent and requirements (WHAT). Procedures are step-by-step instructions implementing those policies (HOW). Standards define specific technical requirements. Guidelines are recommendations."},
  {q:"An organization wants to ensure compliance with multiple regulatory frameworks (HIPAA, PCI DSS, SOC 2) simultaneously. Which approach is MOST efficient?",o:["Implement each framework independently","Use a unified control framework that maps to multiple regulations","Comply with the most stringent framework and ignore others","Hire separate compliance teams for each framework"],a:1,d:5,e:"A unified control framework (like NIST CSF or ISO 27001) maps to multiple regulatory requirements — implementing controls once that satisfy several frameworks simultaneously, reducing duplication of effort."},
  {q:"A company processes healthcare data for hospitals. They experience a breach exposing 50,000 patient records. Under HIPAA who must they notify?",o:["Only the affected patients","OCR (HHS), affected patients, and media if breach affects 500+ in a state","Only the hospitals they process data for","Only the OCR (HHS)"],a:1,d:5,e:"HIPAA Breach Notification Rule: covered entities must notify OCR (HHS), affected individuals, and local media if a breach affects 500+ people in a state. Business Associates must notify the covered entity."},
  {q:"A risk assessment reveals the organization has $2M in assets, a 25% exposure factor for a flood, and the flood occurs on average every 5 years. What is the ALE?",o:["$500,000","$100,000","$400,000","$2,000,000"],a:1,d:5,e:"SLE = $2,000,000 × 0.25 = $500,000. ARO = 1/5 = 0.20. ALE = $500,000 × 0.20 = $100,000 per year."},
  {q:"Which of the following security frameworks is specifically designed for payment card data protection and is MANDATORY for merchants processing credit cards?",o:["ISO 27001","NIST CSF","PCI DSS","SOC 2 Type II"],a:2,d:5,e:"PCI DSS (Payment Card Industry Data Security Standard) is contractually mandatory for all organizations that process, store, or transmit cardholder data — non-compliance can result in fines and loss of payment processing privileges."},
  {q:"An organization wants to implement a systematic process for identifying, documenting, and managing all known risks. Which tool BEST supports this?",o:["Vulnerability scanner","Risk Register","SIEM","BIA report"],a:1,d:5,e:"A Risk Register is a documented repository of identified risks including their likelihood, impact, current controls, risk owner, and treatment status — the foundation of ongoing risk management."},
  {q:"A third-party auditor reviews an organization controls and confirms they were operating effectively for the past 12 months. Which type of assessment is this?",o:["Penetration Test","SOC 2 Type I","SOC 2 Type II","Vulnerability Assessment"],a:2,d:5,e:"SOC 2 Type II assesses effectiveness of controls over a period of time (typically 6-12 months) — much stronger assurance than Type I which only assesses whether controls exist at a point in time."},
  {q:"A company is moving customer data from the EU to a US cloud provider. Under GDPR what mechanism allows this transfer?",o:["Any written agreement between the companies","Standard Contractual Clauses (SCCs) or adequacy decision","A simple notification to EU customers","GDPR does not restrict data transfers"],a:1,d:5,e:"GDPR restricts transfers of personal data outside the EU/EEA. Standard Contractual Clauses (SCCs) are the most common mechanism — contractual provisions ensuring the data receives equivalent protection."},
  {q:"Which of the following BEST describes the purpose of due care in information security?",o:["Investigating vendors before signing contracts","Taking ongoing reasonable steps to maintain security after implementing controls","Conducting annual risk assessments","Performing background checks on new employees"],a:1,d:5,e:"Due Care is the ongoing, continuous effort to maintain security — implementing patches, monitoring systems, updating training. Due Diligence is the initial investigation. Due Care is the sustained maintenance."},
  {q:"A company discovers that a terminated employee exported 10,000 customer records to a personal email account on their last day. Which type of threat does this represent?",o:["External APT","Ransomware attack","Insider Threat — Data Theft","Social Engineering"],a:2,d:5,e:"Insider threat data theft — a departing employee stealing customer data is a classic malicious insider scenario. Timely deprovisioning and data loss prevention controls are the primary defenses."},
  {q:"An organization wants contractual assurance that a cloud vendor will allow independent security audits at any time. Which contract clause achieves this?",o:["SLA","NDA","Right to Audit","Data Retention Clause"],a:2,d:5,e:"Right to Audit clauses give the contracting organization the legal right to conduct independent security assessments of the vendor — critical for supply chain risk management and regulatory compliance."},
  {q:"A company experiences a data breach. After notification, a customer requests a copy of all personal data the company holds about them. Under GDPR which right is this?",o:["Right to Erasure","Right to Rectification","Right to Access (Subject Access Request)","Right to Object"],a:2,d:5,e:"GDPR Article 15 — Right of Access allows individuals to obtain confirmation of whether their data is being processed and receive a copy of it. Organizations must respond within 30 days."},
  {q:"Which of the following is the PRIMARY purpose of a Disaster Recovery Plan (DRP)?",o:["Define security policies for normal operations","Provide step-by-step technical procedures to restore IT systems after a disaster","Define how the business continues operating with manual processes","Assign legal liability in case of data breach"],a:1,d:5,e:"A DRP is a technical document with specific step-by-step procedures for restoring IT systems and infrastructure after a disaster — it is the operational implementation of the broader Business Continuity Plan."},
  {q:"A security consultant is hired to identify gaps between an organization current security posture and ISO 27001 requirements. Which activity is this?",o:["Penetration Testing","Vulnerability Assessment","Gap Analysis","Threat Modeling"],a:2,d:5,e:"A Gap Analysis compares current state against a target framework or standard — identifying what controls exist, what are missing, and what must be implemented to achieve compliance or certification."},
  {q:"Under the NIST CSF which function includes activities like incident response, communications, and improvements based on lessons learned?",o:["Detect","Protect","Respond","Recover"],a:2,d:5,e:"The NIST CSF Respond function covers activities executed after an incident is detected — response planning, communications, analysis, mitigation, and improvements."},
  {q:"A company wants to assess the likelihood and impact of various risks to prioritize remediation. They lack time for full quantitative analysis. Which approach?",o:["Monte Carlo simulation","Qualitative risk matrix using High/Medium/Low ratings","ALE calculation for all risks","Full penetration test"],a:1,d:5,e:"A qualitative risk matrix provides rapid, practical prioritization using descriptive ratings — much faster than quantitative analysis while still providing actionable prioritization guidance."},
  {q:"Which of the following regulations specifically requires covered entities to conduct risk assessments and implement administrative physical and technical safeguards for electronic PHI?",o:["GDPR","PCI DSS","HIPAA Security Rule","SOX"],a:2,d:5,e:"The HIPAA Security Rule specifically requires covered entities and business associates to: conduct risk analysis, implement administrative safeguards, physical safeguards, and technical safeguards for all ePHI."},
  {q:"An organization outsources its security monitoring to a managed security service provider (MSSP). Which risk does this outsourcing create?",o:["The organization no longer has any security risk","Third-party risk — the MSSP becomes a trusted insider with access to sensitive security data","The organization cannot be held liable for breaches","All security incidents must now be handled by the MSSP"],a:1,d:5,e:"Outsourcing to an MSSP creates third-party/supply chain risk — the MSSP has trusted access to security infrastructure and sensitive logs. Proper vetting, contracts with security requirements, and right-to-audit clauses are essential."},
  {q:"A company classifies data as Public Internal Confidential and Restricted. An employee sends Restricted data via unencrypted email. Which control directly prevents this?",o:["Security Awareness Training","Data Loss Prevention (DLP) with classification-based email policies","Acceptable Use Policy","Full Disk Encryption"],a:1,d:5,e:"DLP with classification-based policies can automatically detect and block transmission of Restricted data via email regardless of employee intent — a technical control enforcing the classification policy."},
  {q:"Which of the following BEST describes the purpose of a Master Service Agreement (MSA) with a vendor?",o:["Defines specific service level metrics","Is the comprehensive governing contract establishing the overall relationship terms and conditions","Specifically addresses data retention requirements","Only covers non-disclosure obligations"],a:1,d:5,e:"An MSA is the overarching contract establishing the overall legal framework, terms, and conditions governing a vendor relationship — specific projects, service levels, and SLAs are defined in separate work orders under the MSA umbrella."},
  {q:"An organization wants to limit its attack surface by removing unused services, default accounts, and unnecessary features from all systems. Which control does this describe?",o:["Vulnerability Scanning","Hardening / Secure Baseline Configuration","Patch Management","Network Segmentation"],a:1,d:5,e:"System hardening removes unnecessary services, default credentials, unused features, and open ports — reducing the attack surface by eliminating potential entry points that serve no business purpose."},
  {q:"A CISO presents a risk to the board and recommends spending $200,000 on controls to mitigate a risk with ALE of $50,000. The board should MOST likely:",o:["Approve the spending immediately","Question whether the control cost justifies the risk reduction","Reject all security spending as excessive","Transfer the risk to insurance instead"],a:1,d:5,e:"Spending $200,000 to mitigate a $50,000 annual risk is poor ROI — the board should question this investment. Risk treatment decisions should consider whether the cost of control is proportionate to the risk reduced."},
  {q:"Which of the following BEST describes the concept of data minimization under GDPR?",o:["Deleting data as quickly as possible","Only collecting data that is adequate relevant and limited to what is necessary for the purpose","Encrypting all personal data","Storing data only in the EU"],a:1,d:5,e:"Data minimization requires organizations to only collect and process the minimum personal data necessary for the specified purpose — not collecting data speculatively or just because it might be useful someday."},
  {q:"An organization terminates a vendor contract. Which security action is MOST critical immediately after termination?",o:["Archiving all communications with the vendor","Revoking all vendor access to systems data and facilities","Conducting an exit interview","Updating the vendor risk register"],a:1,d:5,e:"Revoking all vendor access immediately upon contract termination is critical — former vendors with lingering access represent the same risk as terminated employees. Access must be removed before the relationship ends."},
  {q:"A company implements a control requiring all financial transactions over $10,000 to be approved by both the CFO AND the Treasurer before processing. This BEST exemplifies:",o:["Least Privilege","Separation of Duties","Dual Control","Job Rotation"],a:2,d:5,e:"Dual Control requires TWO authorized persons to simultaneously approve a sensitive action — both CFO AND Treasurer must approve, meaning neither can authorize alone. This prevents fraud by requiring collusion."},

  // D2 — 6 more to reach 73
  {q:"An attacker floods a target with traffic from thousands of compromised IoT devices simultaneously. Which attack category?",o:["Volumetric DDoS","Application Layer Attack","Protocol Attack","Insider Threat"],a:0,d:2,e:"Volumetric DDoS uses massive traffic volume from many sources (botnet of IoT devices) to overwhelm bandwidth and network infrastructure of the target."},
  {q:"A security researcher discovers that two different documents produce the same SHA-1 hash value. Which cryptographic weakness does this demonstrate?",o:["Preimage resistance failure","Collision vulnerability","Length extension attack","Birthday attack success"],a:1,d:2,e:"Finding two inputs with the same hash output is a collision attack — SHA-1 has known collision vulnerabilities which is why it has been deprecated in favor of SHA-256."},
  {q:"An attacker sends specially crafted packets with overlapping fragment offsets to a target causing the reassembly process to crash the system. Which attack?",o:["Ping of Death","SYN Flood","Teardrop Attack","Smurf Attack"],a:2,d:2,e:"Teardrop Attack sends fragmented packets with overlapping offset values — when the target attempts to reassemble the fragments the overlapping offsets cause a buffer overflow crashing the system."},
  {q:"A company discovers an attacker has been using a valid employee VPN account outside business hours to exfiltrate data slowly over 8 months. Which threat actor characteristic is demonstrated?",o:["Script Kiddie — using existing tools","Hacktivist — disrupting operations","APT — long dwell time, patient, stealthy","Organized Crime — seeking financial gain"],a:2,d:2,e:"8 months of patient, stealthy exfiltration without detection is the hallmark of an Advanced Persistent Threat — sophisticated, long-term, low-and-slow to avoid triggering alerts."},
  {q:"An attacker gains access to an HR system and reads employee salary data. No data is modified or deleted. Which CIA principle is violated?",o:["Availability only","Integrity only","Confidentiality only","Both Integrity and Availability"],a:2,d:2,e:"Confidentiality is violated — unauthorized access to sensitive data (salary information) breaches confidentiality even when no modification or deletion occurs."},
  {q:"A company web application is vulnerable because user input is passed directly to the operating system. An attacker enters: ; cat /etc/shadow to extract password hashes. Which attack?",o:["SQL Injection","Path Traversal","OS Command Injection","LDAP Injection"],a:2,d:2,e:"OS Command Injection passes unsanitized user input to operating system command interpreters — the semicolon chains an additional OS command, /etc/shadow contains hashed system passwords."},
  // D3 — 14 more to reach 60
